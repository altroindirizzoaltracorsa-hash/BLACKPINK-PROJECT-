<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blinks United — Our Projects</title>
<meta name="description" content="Everything Blinks United has built for BLACKPINK — our past and current projects, campaigns and tools.">
<meta property="og:title" content="Blinks United — Our Projects">
<meta property="og:description" content="Everything Blinks United has built for BLACKPINK — past and current projects, campaigns and tools.">
<meta name="theme-color" content="#080509">
<link rel="icon" href="/blinksunited.jpg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #080509;
    --surf:    #100910;
    --card:    #150c13;
    --card-hi: #1c1019;
    --line:    rgba(255,255,255,0.08);
    --pink:    #FF0066;
    --pink-soft: rgba(255,0,102,0.12);
    --gold:    #C8A84B;
    --text:    #F5F0F0;
    --muted:   rgba(245,240,240,0.5);
    --dim:     rgba(245,240,240,0.3);
    --mono:    ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --serif:   Georgia, "Times New Roman", serif;
  }

  html, body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* ── top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.4rem; background: rgba(8,5,9,0.82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.22em; color: var(--pink); }
  .brand img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
  .back { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); transition: color 0.2s; white-space: nowrap; }
  .back:hover { color: var(--pink); }

  /* ── hero ── */
  .hero { position: relative; text-align: center; padding: 5rem 1.4rem 3rem; overflow: hidden; }
  .hero::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--pink) 40%, var(--gold) 70%, transparent);
  }
  .hero-eyebrow { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.34em; text-transform: uppercase; color: var(--pink); margin-bottom: 1.1rem; }
  .hero h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(2.8rem, 11vw, 5.5rem); line-height: 0.92; letter-spacing: 0.01em; }
  .hero h1 em { font-style: italic; color: var(--pink); }
  .hero-sub { font-family: var(--serif); font-style: italic; font-size: clamp(0.95rem, 3.4vw, 1.15rem); color: var(--muted); margin-top: 1.1rem; max-width: 40ch; margin-left: auto; margin-right: auto; }

  /* ── sections ── */
  .wrap { max-width: 1040px; margin: 0 auto; padding: 1rem 1.2rem 4rem; }
  .section { margin-top: 3rem; }
  .section-head { display: flex; align-items: baseline; gap: 0.8rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); margin-bottom: 1.6rem; }
  .section-title { font-family: var(--mono); font-size: 0.82rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--text); }
  .section-count { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; color: var(--dim); }

  /* ── project grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .card {
    position: relative; display: flex; flex-direction: column; gap: 0.7rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 1.4rem 1.4rem 1.2rem; transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(255,0,102,0.4); background: var(--card-hi); }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .card-icon { font-size: 1.9rem; line-height: 1; }
  .pill { font-family: var(--mono); font-size: 0.52rem; letter-spacing: 0.18em; text-transform: uppercase; padding: 0.25rem 0.55rem; border-radius: 999px; white-space: nowrap; }
  .pill.current { color: var(--pink); background: var(--pink-soft); border: 1px solid rgba(255,0,102,0.35); }
  .pill.past { color: var(--gold); background: rgba(200,168,75,0.1); border: 1px solid rgba(200,168,75,0.3); }
  .card-name { font-family: var(--serif); font-size: 1.28rem; font-weight: 700; line-height: 1.15; }
  .card-tag { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--pink); }
  .card-desc { font-size: 0.86rem; line-height: 1.5; color: var(--muted); flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-top: 0.3rem; padding-top: 0.8rem; border-top: 1px solid var(--line); }
  .card-period { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.1em; color: var(--dim); }
  .card-link { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink); transition: opacity 0.2s; }
  .card-link:hover { opacity: 0.7; }

  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 2.6rem 1.5rem; text-align: center; font-family: var(--serif); font-style: italic; color: var(--muted); font-size: 0.95rem; }

  footer { border-top: 1px solid var(--line); padding: 2.2rem 1.4rem; text-align: center; }
  footer .flogo { font-family: var(--serif); font-size: 1.15rem; letter-spacing: 0.12em; color: var(--pink); }
  footer p { font-family: var(--mono); font-size: 0.56rem; letter-spacing: 0.14em; color: var(--dim); margin-top: 0.7rem; }
  footer a { color: var(--pink); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/"><img src="/blinksunited.jpg" alt="Blinks United">BLINKS UNITED</a>
    <a class="back" href="/">← Back to site</a>
  </div>

  <header class="hero">
    <p class="hero-eyebrow">✦ Blinks United ✦</p>
    <h1>Our <em>Projects</em></h1>
    <p class="hero-sub">Everything we've built for BLACKPINK — the campaigns, trackers and tools, past and present.</p>
  </header>

  <main class="wrap">
    <section class="section">
      <div class="section-head">
        <span class="section-title">● Current</span>
        <span class="section-count" id="current-count"></span>
      </div>
      <div class="grid" id="current-grid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <span class="section-title">◍ Past</span>
        <span class="section-count" id="past-count"></span>
      </div>
      <div class="grid" id="past-grid"></div>
    </section>
  </main>

  <footer>
    <div class="flogo">BLINKS UNITED</div>
    <p>Built by fans, for BLACKPINK · <a href="/">blinksunited.com</a></p>
  </footer>

  <script>
    // ── Project list ──────────────────────────────────────────────────────
    // Edit this array to add / move / remove projects. status: 'current' | 'past'.
    // Fields: icon (emoji), name, tag, desc, period, url (optional, '' to hide link).
    const PROJECTS = [
      // ── Current ──
      {
        status: 'current', icon: '💎', name: 'JUMP → 1B', tag: '1B Streams · In progress',
        desc: "Driving BLACKPINK's 'JUMP' to 1 billion Spotify streams.",
        period: 'In progress →', url: '/streams',
      },
      {
        status: 'current', icon: '💎', name: 'Shut Down → 1B', tag: '1B Streams · In progress',
        desc: "Driving 'Shut Down' to 1 billion Spotify streams.",
        period: 'In progress →', url: '/streams',
      },
      {
        status: 'current', icon: '💎', name: 'DDU-DU DDU-DU → 1B', tag: '1B Streams · In progress',
        desc: "Driving 'DDU-DU DDU-DU' to 1 billion Spotify streams.",
        period: 'In progress →', url: '/streams',
      },
      {
        status: 'current', icon: '💯', name: 'GO → 100M', tag: '100M Streams · In progress',
        desc: "Pushing 'GO' to 100 million Spotify streams.",
        period: 'In progress →', url: '/streams',
      },
      {
        status: 'current', icon: '💗', name: 'Less Than a Lover — Release', tag: 'Release · Jennie',
        desc: "Jennie's 'Less Than a Lover' — the first release we ever tracked on the website. 24-hour & 1st-week stream goals, iTunes tracking and per-Blink milestone contributions.",
        period: 'In progress →', url: '/streams',
      },
      // ── Past (completed ✓) ──
      {
        status: 'past', icon: '💎', name: 'How You Like That → 1B', tag: '1B Streams · with @BPSpotifySchool',
        desc: "Helped push 'How You Like That' to 1 billion Spotify streams — a joint campaign with @BPSpotifySchool.",
        period: 'Reached 1B ✓', url: '',
      },
      {
        status: 'past', icon: '🚀', name: 'JUMP — Release', tag: 'Release Day',
        desc: "Release-day streaming support for BLACKPINK's 'JUMP'.",
        period: 'Released ✓', url: '',
      },
      {
        status: 'past', icon: '💎', name: 'Kill This Love → 1B', tag: '1B Streams · with @BPSpotifySchool',
        desc: "Helped drive 'Kill This Love' to 1 billion Spotify streams, together with @BPSpotifySchool.",
        period: 'Reached 1B ✓', url: '',
      },
      {
        status: 'past', icon: '🚀', name: 'DEADLINE — EP Release', tag: 'EP · BLACKPINK',
        desc: "Streaming support for BLACKPINK's DEADLINE EP, released in February — an extended campaign that ran well beyond release day.",
        period: 'Completed ✓', url: '',
      },
      {
        status: 'past', icon: '💎', name: 'Pink Venom → 1B', tag: '1B Streams',
        desc: "Pushed 'Pink Venom' to 1 billion Spotify streams.",
        period: 'Reached 1B ✓', url: '',
      },
    ];

    function card(p) {
      const link = p.url ? `<a class="card-link" href="${p.url}">Open →</a>` : '<span></span>';
      return `<div class="card">
        <div class="card-top"><span class="card-icon">${p.icon || '✦'}</span><span class="pill ${p.status}">${p.status === 'past' ? 'Past' : 'Current'}</span></div>
        <div class="card-name">${p.name}</div>
        ${p.tag ? `<div class="card-tag">${p.tag}</div>` : ''}
        <div class="card-desc">${p.desc || ''}</div>
        <div class="card-foot"><span class="card-period">${p.period || ''}</span>${link}</div>
      </div>`;
    }

    function render() {
      const current = PROJECTS.filter(p => p.status === 'current');
      const past    = PROJECTS.filter(p => p.status === 'past');
      document.getElementById('current-grid').innerHTML = current.map(card).join('');
      document.getElementById('past-grid').innerHTML = past.length
        ? past.map(card).join('')
        : '<div class="empty">Our archive is being compiled — past projects will land here soon. 🖤💗</div>';
      document.getElementById('current-count').textContent = current.length + (current.length === 1 ? ' project' : ' projects');
      document.getElementById('past-count').textContent = past.length ? past.length + (past.length === 1 ? ' project' : ' projects') : '';
    }
    render();
  </script>
</body>
</html>
