<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Girl Group Race — Blinks United</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Most streamed K-pop girl groups on Spotify this year.">
<meta name="theme-color" content="#0c0509">
<style>
  :root{
    --bg:#0c0509; --card:#15070c; --line:#3a1526; --pink:#ff2e77; --pink-soft:#ff8fb4;
    --text:#fff2f6; --muted:#c48aa0; --dim:#8a5c6c; --gold:#f5c542;
  }
  *{box-sizing:border-box;margin:0;font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
  body{background:
      radial-gradient(120% 60% at 50% -10%, #3a0c22 0%, transparent 55%),
      linear-gradient(180deg,#15070c 0%, #0c0509 100%);
    color:var(--text); min-height:100vh; padding:22px 16px 48px;}
  .wrap{max-width:760px;margin:0 auto;}
  .top{text-align:center;margin-bottom:22px;}
  .kicker{font-size:11px;letter-spacing:.24em;color:var(--pink-soft);text-transform:uppercase;}
  h1{font-size:22px;font-weight:800;letter-spacing:.04em;margin:10px 0 4px;
     background:linear-gradient(90deg,#ff8fb4,#ff2e77 55%,#ff8fb4);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:11px;color:var(--dim);letter-spacing:.06em;}

  .row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;
       background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .row.lead{border-color:#ff2e7788;box-shadow:0 0 0 1px #ff2e7722 inset;}
  .rank{font-size:15px;font-weight:800;color:var(--dim);text-align:center;}
  .row.lead .rank{color:var(--pink);}
  .name{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .row.lead .name{color:var(--pink-soft);}
  .meta{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.03em;}
  .nums{text-align:right;white-space:nowrap;}
  .ytd{font-size:15px;font-weight:800;}
  .gain{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .gain b{color:var(--pink-soft);font-weight:700;}
  .track{grid-column:1/-1;height:5px;border-radius:3px;background:#0a0407;border:1px solid var(--line);overflow:hidden;margin-top:9px;}
  .track>i{display:block;height:100%;background:linear-gradient(90deg,#ff2e77,#ff8fb4);transition:width .8s cubic-bezier(.4,0,.2,1);}
  .row:not(.lead) .track>i{background:linear-gradient(90deg,#6a3f52,#a8748a);}

  .note{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}
  .note b{color:var(--muted);font-weight:700;}
  .stale{display:none;font-size:11px;color:var(--gold);text-align:center;margin:12px 0;}
  .prov{color:var(--gold);font-weight:700;}
  .lag{color:var(--gold);}
  .err{display:none;font-size:12px;color:#ff5c7a;text-align:center;margin:18px 0;}
  .skel{opacity:.35;}

  /* ---- daily log ---- */
  .logsec{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;}
  .loghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .logtitle{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-soft);}
  .dl{font:inherit;font-size:10.5px;letter-spacing:.08em;cursor:pointer;white-space:nowrap;
      background:transparent;color:var(--pink-soft);border:1px solid var(--line);
      border-radius:8px;padding:6px 11px;transition:border-color .2s,color .2s;}
  .dl:hover:not(:disabled){border-color:var(--pink);color:var(--pink);}
  .dl:disabled{opacity:.4;cursor:default;}
  /* The tab strip scrolls sideways rather than wrapping: eight tabs wrap to two
     ragged lines on a phone, which reads as a broken layout rather than a list. */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;
        scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{font:inherit;font-size:11px;letter-spacing:.04em;cursor:pointer;white-space:nowrap;
       background:var(--card);color:var(--muted);border:1px solid var(--line);
       border-radius:999px;padding:6px 13px;transition:all .18s;}
  .tab:hover{color:var(--pink-soft);}
  .tab[aria-selected="true"]{background:#ff2e7718;border-color:#ff2e7788;color:var(--pink-soft);font-weight:700;}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);}
  table.log{border-collapse:collapse;width:100%;font-size:11px;}
  table.log th,table.log td{padding:8px 7px;text-align:right;white-space:nowrap;
       border-bottom:1px solid #2a0f1b;}
  table.log th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
       font-weight:700;position:sticky;top:0;background:#1b0810;}
  /* The day column stays put while the rest scrolls, but an opaque sticky column
     hides what slides under it — and a total losing its leading digits still
     reads as a valid number (2,989,440,060 becoming 989,440,060). The shadow
     makes the occlusion visible so a cut number looks cut. */
  table.log td:first-child,table.log th:first-child{text-align:left;color:var(--muted);
       position:sticky;left:0;background:var(--card);padding-left:11px;
       box-shadow:7px 0 7px -7px #000c;}
  table.log th:first-child{background:#1b0810;z-index:1;}
  @media (max-width:360px){
    table.log{font-size:10.5px;}
    table.log th,table.log td{padding:7px 5px;}
  }
  table.log tr:last-child td{border-bottom:none;}
  table.log td.up{color:var(--pink-soft);}
  table.log td.none{color:var(--dim);}
  .logempty{padding:18px 14px;font-size:11px;color:var(--dim);line-height:1.6;}
  /* The all-groups view is a stack of days rather than a day x group matrix.
     Seven columns of nine-digit numbers cannot fit a phone, so the matrix
     scrolled sideways — which hid BABYMONSTER off the right edge entirely and
     pushed me into abbreviating the figures to make truncation look broken.
     Stacking removes the cause: nothing scrolls, so nothing needs shortening. */
  .dayblock{border:1px solid var(--line);border-radius:12px;background:var(--card);
       margin-bottom:8px;overflow:hidden;}
  .dayhead{padding:8px 12px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--dim);background:#1b0810;border-bottom:1px solid #2a0f1b;
       display:flex;justify-content:space-between;gap:10px;}
  .dayrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
       padding:8px 12px;border-bottom:1px solid #2a0f1b;}
  .dayrow:last-child{border-bottom:none;}
  .dayrow .g{font-size:11.5px;color:var(--text);font-weight:700;letter-spacing:.02em;}
  .dayrow .v{text-align:right;white-space:nowrap;}
  .dayrow .v b{font-size:12px;color:var(--pink-soft);font-weight:800;}
  .dayrow .v i{display:block;font-style:normal;font-size:9.5px;color:var(--dim);margin-top:2px;}
  .dayrow.absent .g{color:var(--dim);font-weight:400;}
  .dayrow.absent .v b{color:var(--dim);font-weight:400;font-size:11px;}
  /* A provisional row is a real reading of a day Spotify has not finished
     publishing. It is rewritten on a later run, so it must not be read as the
     day's gain — +7,310 sitting under a run of +4M days looked like a collapse
     rather than a day still in progress. */
  .dayrow.partial .v b{color:var(--amber,#e8b04b);}
  .dayrow.partial .v i{color:var(--amber,#e8b04b);opacity:.75;}
  .dayhead.partial span:last-child{color:var(--amber,#e8b04b);}
  td.up.partial{color:var(--amber,#e8b04b);}
  /* Catch-up projection widget */
  .catchup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:14px 0 8px;}
  .cu-title{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-soft);margin-bottom:10px;}
  .cu-modes{display:flex;gap:6px;margin-bottom:11px;}
  .cu-mode{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:11px;letter-spacing:.04em;cursor:pointer;}
  .cu-mode:hover{color:var(--pink-soft);}
  .cu-mode[aria-selected="true"]{background:#ff2e7718;border-color:#ff2e7788;color:var(--pink-soft);font-weight:700;}
  .cu-picks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
  .cu-sel{background:#0a0407;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;flex:1;min-width:130px;}
  .cu-sel:focus{outline:none;border-color:var(--pink);}
  .cu-arrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);}
  .cu-out{font-size:12.5px;line-height:1.65;color:var(--muted);}
  .cu-out b{color:var(--pink-soft);font-weight:700;}
  .cu-eta{color:var(--text);font-weight:700;font-size:14px;margin-bottom:3px;}
  .cu-eta span{color:var(--pink);}
  .cu-note{font-size:10.5px;line-height:1.5;color:var(--dim);margin-top:8px;}
  .cu-win{color:var(--gold);}
  .cu-graph{margin-top:12px;}
  .cu-leg{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px;font-size:11px;color:var(--muted);}
  .cu-lg{display:inline-flex;align-items:center;gap:6px;}
  .cu-lg i{width:12px;height:3px;border-radius:2px;display:inline-block;}
  .cu-spark2{display:block;width:100%;height:auto;}
  .cu-graph-cap{font-size:10.5px;color:var(--dim);margin-top:6px;letter-spacing:.02em;}
  .cu-graph-cap span{font-weight:700;}
  .cu-graph-sub{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.4;}
  .cu-tr-good{color:var(--pink-soft);}
  .cu-tr-warn{color:var(--gold);}
  .cu-tr-bad{color:#ff6b6b;}

  /* ---- view toggle ---- */
  .modes{display:flex;gap:6px;margin:16px 0 18px;}
  .mode{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--line);
        border-radius:10px;padding:9px 8px;font-family:inherit;font-size:11.5px;
        letter-spacing:.06em;cursor:pointer;transition:all .18s;}
  .mode:hover{color:var(--pink-soft);}
  .mode[aria-selected="true"]{background:#ff2e7718;border-color:#ff2e7788;color:var(--pink-soft);font-weight:700;}

  /* ---- road to 1B ---- */
  /* Same row component as the group race, so the two views read as one page.
     The third column carries the arrival rather than a total, because that is
     what the race is about. */
  .b-eta{font-size:13px;font-weight:800;}
  .b-eta.soon{color:var(--pink-soft);}
  /* .nums sets white-space:nowrap so a stream figure never breaks mid-number.
     This sub-line is prose, not a figure — left nowrap it pushed the grid's auto
     column to 180px and the row off the right edge of a 320px phone. */
  .b-sub{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.02em;
         white-space:normal;max-width:116px;margin-left:auto;}
  /* The total — the headline of the whole board — sits directly under the date
     it implies, a step up in weight from the rate below it. */
  .b-tot{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em;
         white-space:normal;max-width:116px;margin-left:auto;}
  .b-tot b{color:var(--text);font-weight:800;font-size:12px;}
  .b-drift{font-size:10px;margin-top:2px;letter-spacing:.02em;
           white-space:normal;max-width:116px;margin-left:auto;}
  .b-days{font-size:10.5px;color:var(--muted);}
  .b-days b{color:var(--pink-soft);font-weight:700;}
  .b-grp{font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;}
  .b-head{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-soft);
          margin:22px 0 10px;}
  .b-head:first-child{margin-top:0;}
  .row.done{border-color:#f5c54255;}
  .row.done .rank{color:var(--gold);}
  .row.done .name{color:var(--gold);}
  .row.done .track>i{background:linear-gradient(90deg,#f5c542,#ffe08a);}
  .b-warn{color:var(--gold);}
  .b-empty{font-size:11px;color:var(--dim);line-height:1.6;padding:14px 0;}

  /* ---- road to 1B: controls ---- */
  .b-ctl{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .b-sorts{display:flex;gap:6px;}
  .b-sort{flex:1;background:var(--card);color:var(--muted);border:1px solid var(--line);
          border-radius:8px;padding:7px 6px;font-family:inherit;font-size:10.5px;
          letter-spacing:.03em;cursor:pointer;transition:all .18s;}
  .b-sort:hover{color:var(--pink-soft);}
  .b-sort[aria-selected="true"]{background:#ff2e7718;border-color:#ff2e7788;color:var(--pink-soft);font-weight:700;}
  .b-filter{display:flex;align-items:center;gap:8px;}
  .b-filter label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
  .b-filter select{flex:1;background:#0a0407;color:var(--text);border:1px solid var(--line);
                   border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;}
  .b-filter select:focus{outline:none;border-color:var(--pink);}

  /* ---- road to 1B: per-track panel ---- */
  .row.tappable{cursor:pointer;}
  .row.tappable:hover{border-color:#ff2e7755;}
  .b-chev{font-size:10px;color:var(--dim);margin-left:6px;}
  .row.open .b-chev{color:var(--pink-soft);}
  .b-panel{grid-column:1/-1;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);}
  .b-chart{display:block;width:100%;height:auto;}
  .b-cap{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:8px;}
  .b-cap b{color:var(--pink-soft);font-weight:700;}
  .b-closer{color:var(--pink-soft);font-weight:700;}
  .b-slower{color:#ff6b6b;font-weight:700;}
  .b-flat{color:var(--gold);font-weight:700;}
  .b-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:9.5px;color:var(--dim);margin-top:7px;}
  .b-leg span{display:inline-flex;align-items:center;gap:5px;}
  .b-leg i{width:9px;height:9px;border-radius:2px;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="kicker">Spotify · this year</div>
    <h1>Girl Group Race</h1>
    <div class="sub" id="asof">loading…</div>
  </div>

  <div class="modes" id="modes" role="tablist" hidden>
    <button class="mode" data-view="race" aria-selected="true" role="tab">Group race</button>
    <button class="mode" data-view="1b" aria-selected="false" role="tab">Road to 1B</button>
  </div>

  <div id="stale" class="stale"></div>
  <div id="err" class="err"></div>
  <div id="list"></div>

  <div id="race1b" hidden>
    <div class="b-ctl" id="b-ctl" hidden>
      <div class="b-sorts" id="b-sorts" role="tablist">
        <button class="b-sort" data-sort="soon" aria-selected="true">Days left</button>
        <button class="b-sort" data-sort="total" aria-selected="false">Total days</button>
        <button class="b-sort" data-sort="daily" aria-selected="false">Per day</button>
      </div>
      <div class="b-filter">
        <label for="b-group">Group</label>
        <select id="b-group"></select>
      </div>
    </div>
    <div id="b-body" class="b-empty">loading…</div>
    <div class="note" id="b-note"></div>
  </div>

  <div id="catchup" class="catchup" hidden>
    <div class="cu-title">Catch-up projection</div>
    <div class="cu-modes" id="cu-modes" role="tablist">
      <button class="cu-mode" data-mode="year" aria-selected="true">This year · 2026</button>
      <button class="cu-mode" data-mode="overall" aria-selected="false">All-time</button>
    </div>
    <div class="cu-picks">
      <select id="cu-chaser" class="cu-sel" aria-label="Chasing group"></select>
      <span class="cu-arrow">chasing</span>
      <select id="cu-target" class="cu-sel" aria-label="Target group"></select>
    </div>
    <div id="cu-out" class="cu-out"></div>
  </div>

  <div class="note" id="note"></div>

  <div class="logsec" id="logsec" hidden>
    <div class="loghead">
      <div class="logtitle">Daily log</div>
      <button class="dl" id="dl" disabled>↓ CSV</button>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="logbody"></div>
    <div class="note" id="lognote"></div>
  </div>
</div>

<script>
  const fmt = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));
  const big = n => {
    if (n == null) return '—';
    if (n >= 1e9) return (n / 1e9).toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'K';   // a 630k gap is 630K, not 0.63M
    return String(Math.round(n));
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── Catch-up projection ─────────────────────────────────────
  // Daily rates come from OUR OWN daily log (data/group_streams/history.csv) — a
  // current, granular measurement summed from the same track IDs kworb uses. The
  // API's kworb series is a coarse multi-week average that lags several days, so it
  // understates a group's recent acceleration (it had LE SSERAFIM ≈ BLACKPINK when
  // the daily log clearly shows LE SSERAFIM pulling ahead). We fall back to the
  // kworb series only when the log has nothing for a group.
  let _logRates = null; // { groupName: streams/day } from the daily log
  function _parseLogRates(text) {
    const lines = String(text || '').trim().split(/\r?\n/);
    if (lines.length < 2) return {};
    lines.shift(); // header: date,group,artist_id,total_streams,daily_delta,tracks,note
    const byGroup = {};
    for (const ln of lines) {
      const c = ln.split(',');
      const date = c[0], group = c[1], total = Number(c[3]);
      if (!date || !group || !Number.isFinite(total)) continue;
      (byGroup[group] = byGroup[group] || []).push({ date, total });
    }
    const rates = {};
    for (const g of Object.keys(byGroup)) {
      const arr = byGroup[g].sort((a, b) => a.date < b.date ? -1 : 1).slice(-14); // trailing ~2 weeks
      if (arr.length >= 2) {
        const first = arr[0], last = arr[arr.length - 1];
        const days = (Date.parse(last.date) - Date.parse(first.date)) / 86400000;
        if (days > 0) rates[g] = (last.total - first.total) / days;
      }
    }
    return rates;
  }
  function ensureLogRates() {
    if (_logRates) return Promise.resolve(_logRates);
    return fetch(HISTORY_CSV, { cache: 'no-store' }).then(r => r.text())
      .then(t => (_logRates = _parseLogRates(t)))
      .catch(() => (_logRates = {}));
  }
  function _rateOf(g) {
    if (_logRates && _logRates[g.name] != null) return _logRates[g.name];
    const s = (g.series || []).filter(p => p && p.v != null && p.d);
    if (s.length >= 2) {
      const first = s[0], last = s[s.length - 1];
      const days = (Date.parse(last.d) - Date.parse(first.d)) / 86400000;
      if (days > 0) return (last.v - first.v) / days;
    }
    return g.daily != null ? g.daily : null;
  }
  let _cuGroups = [];
  let _cuMode = 'year'; // 'year' = 2026 streams gained · 'overall' = all-time total
  function renderCatchup(groups, asOf) {
    _cuGroups = (groups || []).filter(g => g.ytd != null);
    const box = document.getElementById('catchup');
    if (!box) return;
    if (_cuGroups.length < 2) { _hasCatchup = false; applyView(); return; }
    _hasCatchup = true;
    applyView();
    const chaser = document.getElementById('cu-chaser');
    const target = document.getElementById('cu-target');
    const opts = _cuGroups.map((g, i) => `<option value="${i}">${esc(g.name)}</option>`).join('');
    const prevC = chaser.value, prevT = target.value;
    chaser.innerHTML = opts; target.innerHTML = opts;
    // Default: 2nd place chasing the leader; keep the user's picks across refreshes.
    chaser.value = (prevC !== '' && _cuGroups[prevC]) ? prevC : String(Math.min(1, _cuGroups.length - 1));
    target.value = (prevT !== '' && _cuGroups[prevT]) ? prevT : '0';
    chaser.onchange = () => drawCatchup(asOf);
    target.onchange = () => drawCatchup(asOf);
    document.querySelectorAll('#cu-modes .cu-mode').forEach(b => {
      b.setAttribute('aria-selected', b.dataset.mode === _cuMode ? 'true' : 'false');
      b.onclick = () => {
        _cuMode = b.dataset.mode;
        document.querySelectorAll('#cu-modes .cu-mode').forEach(x =>
          x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
        drawCatchup(asOf);
      };
    });
    // Draw immediately (kworb-series fallback), then re-draw with our daily-log
    // rates the moment the CSV loads — usually within the same second.
    ensureLogRates().then(() => drawCatchup(asOf));
    drawCatchup(asOf);
  }
  // Gap between the two picked groups on every date BOTH have a point for, using
  // the same source as the "Gap now" figure (kworb series: ytd this-year, total
  // all-time) so the graph and the number always agree. Oldest-first.
  function _cuGapSeries(c, t, yearMode) {
    const val = p => (yearMode ? p.ytd : p.v);
    const cm = new Map((c.series || []).map(p => [p.d, val(p)]));
    const out = [];
    for (const p of (t.series || [])) {
      const cv = cm.get(p.d), tv = val(p);
      if (cv == null || tv == null) continue;
      out.push({ d: p.d, gap: tv - cv });
    }
    return out.sort((a, b) => a.d < b.d ? -1 : 1);
  }

  const _cuDate = ms => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  // Two labelled lines — each group's own trajectory over time (2026 streams
  // gained in year mode, all-time total otherwise) — in the same style as the
  // /vs.html face-off chart, so it reads at a glance: a y-axis, dates, a legend,
  // and a plain-language trend of whether the gap is closing, stalling or widening.
  // Returns '' when neither line has ≥2 days yet.
  function _cuGraphHtml(c, t, yearMode) {
    const val = p => (yearMode ? p.ytd : p.v);
    const mk = g => (g.series || [])
      .filter(p => p && p.d && val(p) != null)
      .map(p => ({ t: Date.parse(p.d + 'T00:00:00Z'), y: val(p) }))
      .sort((a, b) => a.t - b.t);
    const cs = mk(c), ts = mk(t);
    if (cs.length < 2 && ts.length < 2) return '';
    const all = [...cs, ...ts];
    const tMin = Math.min(...all.map(p => p.t)), tMax = Math.max(...all.map(p => p.t));
    const yLoR = Math.min(...all.map(p => p.y)), yHiR = Math.max(...all.map(p => p.y));
    const padY = (yHiR - yLoR) * 0.10 || 1, yLo = Math.max(0, yLoR - padY), yHi = yHiR + padY;
    const W = 320, H = 152, PL = 46, PR = 12, PT = 12, PB = 22;
    const X = ms => PL + (tMax === tMin ? 0.5 : (ms - tMin) / (tMax - tMin)) * (W - PL - PR);
    const Y = v => H - PB - (yHi === yLo ? 0.5 : (v - yLo) / (yHi - yLo)) * (H - PT - PB);
    const COL_C = '#ff2e77', COL_T = '#f5c542';
    let grid = '';
    for (let i = 0; i <= 3; i++) {
      const gv = yLo + (yHi - yLo) * i / 3, gy = Y(gv);
      grid += `<line x1="${PL}" x2="${W - PR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="#ffffff12"/>`
            + `<text x="${PL - 6}" y="${(gy + 3).toFixed(1)}" text-anchor="end" fill="#8a5c6c" font-size="8">${big(Math.round(gv))}</text>`;
    }
    const lineFor = (s, col) => { if (s.length < 2) return '';
      const d = s.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
      const last = s[s.length - 1];
      return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`
           + `<circle cx="${X(last.t).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="3" fill="${col}"/>`;
    };
    const xlab = `<text x="${PL}" y="${H - 6}" fill="#8a5c6c" font-size="8">${_cuDate(tMin)}</text>`
               + `<text x="${W - PR}" y="${H - 6}" text-anchor="end" fill="#8a5c6c" font-size="8">${_cuDate(tMax)}</text>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" class="cu-spark2" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Streams over time">`
      + `${grid}${lineFor(ts, COL_T)}${lineFor(cs, COL_C)}${xlab}</svg>`;
    const legend = `<div class="cu-leg">`
      + `<span class="cu-lg"><i style="background:${COL_C}"></i>${esc(c.name)}</span>`
      + `<span class="cu-lg"><i style="background:${COL_T}"></i>${esc(t.name)}</span></div>`;

    // Trend read from the gap between the two lines over the window.
    const gs = _cuGapSeries(c, t, yearMode);
    let cap = '';
    if (gs.length >= 2) {
      const n = gs.length, first = gs[0], last = gs[n - 1], mid = gs[Math.floor((n - 1) / 2)];
      const perDay = (a, b) => { const dd = (Date.parse(b.d) - Date.parse(a.d)) / 86400000; return dd > 0 ? (b.gap - a.gap) / dd : 0; };
      const early = perDay(first, mid), late = perDay(mid, last);
      const span = Math.round((Date.parse(last.d) - Date.parse(first.d)) / 86400000) || n - 1;
      const moved = last.gap - first.gap;   // <0 = gap shrank over the window
      const movedTxt = Math.abs(moved) < 1 ? 'flat' : `${big(Math.abs(moved))} ${moved < 0 ? 'closer' : 'wider'} vs ${span}d ago`;
      let trend, cls;
      if (late > 1e4 && late > Math.abs(early)) { trend = 'gap widening lately'; cls = 'cu-tr-bad'; }
      else if (late < 0 && early < 0 && Math.abs(late) > Math.abs(early) * 1.15) { trend = 'closing faster lately'; cls = 'cu-tr-good'; }
      else if (late < 0 && Math.abs(late) < Math.abs(early) * 0.85) { trend = 'closing has slowed'; cls = 'cu-tr-warn'; }
      else if (late < 0) { trend = 'closing steadily'; cls = 'cu-tr-good'; }
      else { trend = 'roughly flat lately'; cls = 'cu-tr-warn'; }
      cap = `<div class="cu-graph-cap"><span class="${cls}">${trend}</span> · gap ${movedTxt}</div>`;
    }
    const sub = `<div class="cu-graph-sub">Each line is that group's ${yearMode ? '2026 streams gained' : 'all-time total'} so far — the closer the lines, the more the chase is working.</div>`;
    return `<div class="cu-graph">${legend}${svg}${cap}${sub}</div>`;
  }

  function drawCatchup(asOf) {
    const out = document.getElementById('cu-out');
    const c = _cuGroups[+document.getElementById('cu-chaser').value];
    const t = _cuGroups[+document.getElementById('cu-target').value];
    if (!out || !c || !t) return;
    if (c === t) { out.innerHTML = '<span class="cu-note">Pick two different groups.</span>'; return; }
    const cr = _rateOf(c), tr = _rateOf(t);
    if (cr == null || tr == null) { out.innerHTML = '<span class="cu-note">Not enough history yet to project a rate.</span>'; return; }
    // Mode picks WHICH totals we compare; the daily rates are the same either way.
    const yearMode = _cuMode !== 'overall';
    const cVal = yearMode ? (c.ytd || 0) : (c.total || 0);
    const tVal = yearMode ? (t.ytd || 0) : (t.total || 0);
    const scope = yearMode ? 'this year' : 'all-time';
    const gap = tVal - cVal;
    const rateLine = `<b>${esc(c.name)}</b> +${big(cr)}/day vs <b>${esc(t.name)}</b> +${big(tr)}/day`;
    // Anchor "now" to the data's streaming day (the totals are as-of that day).
    const now = asOf ? Date.parse(asOf + 'T00:00:00Z') : Date.now();
    const year = new Date(now).getUTCFullYear();
    const daysLeft = Math.max(0, Math.round((Date.UTC(year, 11, 31) - now) / 86400000));
    let verdict;
    if (gap < 0) {
      verdict = `<div class="cu-eta">${esc(c.name)} is already ahead by ${big(-gap)} ${scope} ✅</div>`;
    } else {
      const close = cr - tr;
      if (close <= 0) {
        verdict = `<div class="cu-eta">Not catching up — ${esc(t.name)} is gaining just as fast or faster, so the ${scope} gap isn't closing.</div>`
                + `<div>Gap now: <b>${big(gap)}</b></div>`;
      } else {
        const days = gap / close;
        const eta = new Date(now + days * 86400000);
        const etaStr = eta.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const months = days / 30.44;
        const dur = months < 12 ? `~${months.toFixed(1)} months` : `~${(days / 365.25).toFixed(1)} years`;
        verdict = `<div class="cu-eta">Overtakes around <span>${etaStr}</span></div>`
                + `<div>Gap now: <b>${big(gap)}</b> · closing <b>${big(close)}/day</b> · ${Math.round(days).toLocaleString()} days (${dur})</div>`;
        if (yearMode && days > daysLeft) {
          const needExtra = gap / Math.max(1, daysLeft) - close;
          verdict += `<div class="cu-note cu-win">↺ That lands after Dec 31 — the year-to-date board resets on Jan 1, so ${esc(t.name)} takes ${year}. `
                   + `To pass within the year, ${esc(c.name)} would need to gain ~${big(needExtra)}/day <i>more</i> than it does now (${daysLeft} days left).</div>`;
        }
      }
    }
    const scopeTag = `<div class="cu-note">Comparing <b>${yearMode ? year + ' streams gained' : 'all-time totals'}</b>.</div>`;
    out.innerHTML = scopeTag + `<div>${rateLine}</div>` + verdict + _cuGraphHtml(c, t, yearMode);
  }

  function render(d) {
    const groups = d.groups || [];
    document.getElementById('asof').textContent =
      d.asOf ? `streaming day ${d.asOf}` : 'no data captured yet';

    // Bars are scaled to the leader, so the picture is the race, not the axis.
    const top = Math.max(...groups.map(g => g.ytd || 0), 1);

    document.getElementById('list').innerHTML = groups.map((g, i) => {
      // kworb skips days. When our own series spans more than one day we say so
      // rather than passing a multi-day jump off as a daily figure.
      let gain = '';
      if (g.gain != null && g.spanDays) {
        gain = g.spanDays === 1
          ? `<b>+${fmt(g.gain)}</b> that day`
          : `<b>+${fmt(g.gain)}</b> over ${g.spanDays} days`;
      } else if (g.daily != null) {
        gain = `<b>+${fmt(g.daily)}</b> daily`;
      }
      const gap = g.gapToAbove != null ? ` · ${big(g.gapToAbove)} behind` : '';
      // kworb can be a day behind on one group and current on the others, so a
      // row whose streaming day isn't the newest says which day it IS, rather
      // than sitting silently under a heading that doesn't apply to it.
      const lag = g.day && d.asOf && g.day !== d.asOf
        ? ` · <span class="lag">${esc(g.day)}</span>` : '';
      // An approximate baseline is never passed off as a measured one.
      const prov = g.exact === false
        ? ` <span class="prov" title="Baseline still approximate: no published figure yet for this group's streaming day. Corrects itself once its page catches up.">≈</span>` : '';
      return `<div class="row${i === 0 ? ' lead' : ''}">
        <div class="rank">${i + 1}</div>
        <div>
          <div class="name">${esc(g.name)}${prov}</div>
          <div class="meta">${fmt(g.total)} all-time${gap}${lag}</div>
        </div>
        <div class="nums">
          <div class="ytd">${big(g.ytd)}</div>
          <div class="gain">${gain}</div>
        </div>
        <div class="track"><i style="width:${Math.max(2, 100 * (g.ytd || 0) / top).toFixed(1)}%"></i></div>
      </div>`;
    }).join('') || '<div class="err" style="display:block">No snapshots stored yet.</div>';

    // If kworb has not advanced in a while, say so on the page rather than
    // letting a stale number look current.
    if (d.asOf) {
      const age = Math.floor((Date.now() - Date.parse(d.asOf + 'T00:00:00Z')) / 86400000);
      if (age >= 3) {
        // About kworb's day, so it belongs to the group-race view only — the
        // per-track board does not come from kworb at all.
        _staleShown = true;
        document.getElementById('stale').textContent =
          `⚠ kworb has not published a newer day in ${age} days — figures below are for ${d.asOf}.`;
        applyView();
      }
    }

    renderCatchup(groups, d.asOf);

    document.getElementById('note').innerHTML =
      `<b>How this is worked out.</b> Nobody publishes a year-to-date figure, so it is derived: ` +
      `each group's running Spotify total from kworb, minus what they had on 1 January. ` +
      `Dates are kworb's streaming days, not the day we fetched — its label runs a day ahead of the data. ` +
      `Because we store running totals rather than adding up daily numbers, a day kworb skips costs a day of ` +
      `detail and cannot bend the yearly figure. Baselines were seeded against ${esc(d.seedDay || '—')} from a ` +
      `published ranking rounded to about a million, so each total carries a fixed ±500k that never grows and ` +
      `applies to every group alike — the order and the gaps are exact.` +
      (groups.some(g => g.exact === false)
        ? ` <span class="prov">≈</span> marks a group whose baseline is still approximate: kworb has not yet ` +
          `published a day for it that we hold a reference list for. It corrects itself automatically once it does.`
        : '');
  }

  // ---------------------------------------------------------------------------
  // Daily log. Reads the CSV the nightly job appends to, straight from the repo
  // — the same raw.githubusercontent path the chart pages already use for data,
  // so the log needs no endpoint of its own and cannot go stale against the file.
  // ---------------------------------------------------------------------------
  const HISTORY_CSV =
    'https://raw.githubusercontent.com/altroindirizzoaltracorsa-hash/BLACKPINK-PROJECT-/main/data/group_streams/history.csv';

  // A real parser rather than split(','): the `note` column is written by
  // csv.DictWriter and gets quoted when it contains a comma, which it does
  // ("1 track(s) from last-known; 2 merged-value group(s)"). Splitting naively
  // would shift every column after it.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
        } else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    const head = rows.shift();
    return rows.filter(r => r.length === head.length && r.some(v => v !== ''))
               .map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
  }

  let logRows = [], logCsvText = '', logGroups = [], activeTab = 'ALL';

  function num(v) { return v === '' || v == null ? null : Number(v); }

  // The fetcher marks a row it wrote mid-publish with "still publishing" in the
  // note column, and rewrites that same dated row on a later run once Spotify
  // has finished. Until then its delta is a partial figure, so the log has to
  // say so rather than present it as the day's gain.
  function isPartial(r) { return !!r && /still publishing/i.test(r.note || ''); }

  function renderLog() {
    const body = document.getElementById('logbody');

    if (!logRows.length) {
      body.innerHTML = '<div class="tablewrap"><div class="logempty">' +
        'No days recorded yet. The first row appears after tonight\u2019s fetch.' +
        '</div></div>';
      return;
    }

    const days = [...new Set(logRows.map(r => r.date))].sort().reverse();

    if (activeTab === 'ALL') {
      // A block per day listing every group down the page. Full figures, no
      // horizontal scroll, and no group can end up off-screen the way
      // BABYMONSTER did in the matrix this replaced.
      const by = {};
      logRows.forEach(r => { (by[r.date] = by[r.date] || {})[r.group] = r; });
      body.innerHTML = days.map(d => {
        const present = logGroups.filter(g => by[d] && by[d][g]);
        const sum = present.reduce((a, g) => a + (num(by[d][g].daily_delta) || 0), 0);
        // "combined" is a claim about the whole day. It is only true once every
        // group has a final reading — otherwise this is a running subtotal of a
        // day still being published, and saying "+7,310 combined" for a day
        // where six of seven groups have no reading yet is simply wrong.
        const anyPartial = present.some(g => isPartial(by[d][g]));
        const whole = present.length === logGroups.length && !anyPartial;
        const headNote = !sum ? 'first day'
          : whole ? `+${fmt(sum)} combined`
          : `+${fmt(sum)} so far · ${present.length}/${logGroups.length} groups`;
        return `<div class="dayblock">
          <div class="dayhead${whole || !sum ? '' : ' partial'}"><span>${esc(d)}</span>` +
          `<span>${headNote}</span>` +
          `</div>` +
          logGroups.map(g => {
            const r = by[d] && by[d][g];
            if (!r) {
              // Deliberately does not name a cause. A group can be missing because
              // Spotify had not published a new day, because the fetch held, or
              // because a row was removed as unsound — and the file does not
              // record which. Asserting one would be a guess wearing a fact's
              // clothes, which is the failure this whole page keeps hitting.
              return `<div class="dayrow absent"><div class="g">${esc(g)}</div>` +
                     `<div class="v"><b>—</b><i>no reading stored</i></div></div>`;
            }
            const dd = num(r.daily_delta);
            const part = isPartial(r);
            // A blank delta is the group's FIRST stored day, not a zero day.
            return `<div class="dayrow${part ? ' partial' : ''}"><div class="g">${esc(g)}</div><div class="v">` +
              (dd == null ? '<b>first day</b>' : `<b>+${fmt(dd)}${part ? ' so far' : ''}</b>`) +
              `<i>${part ? 'still publishing · not final yet'
                         : fmt(num(r.total_streams)) + ' total'}</i></div></div>`;
          }).join('') +
        `</div>`;
      }).join('');
      return;
    }

    const mine = logRows.filter(r => r.group === activeTab)
                        .sort((a, b) => b.date.localeCompare(a.date));
    body.innerHTML =
      '<div class="tablewrap"><table class="log"><thead><tr>' +
      '<th>Day</th><th>Total</th><th>Gained</th><th>Tracks</th>' +
      '</tr></thead><tbody>' +
      mine.map(r => {
        const dd = num(r.daily_delta);
        const part = isPartial(r);
        return '<tr>' +
          `<td>${esc(r.date)}</td>` +
          `<td>${fmt(num(r.total_streams))}</td>` +
          (dd == null ? '<td class="none">first day</td>'
                      : `<td class="up${part ? ' partial' : ''}">+${fmt(dd)}${part ? ' so far' : ''}</td>`) +
          `<td class="none">${esc(r.tracks)}${r.note ? ' <span title="' + esc(r.note) + '">*</span>' : ''}</td>` +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = ['ALL', ...logGroups].map(t =>
      `<button class="tab" role="tab" data-tab="${esc(t)}" aria-selected="${t === activeTab}">` +
      `${t === 'ALL' ? 'All groups' : esc(t)}</button>`).join('');
    tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      activeTab = b.dataset.tab;
      renderTabs();
      renderLog();
    }));
  }

  function loadLog() {
    _hasLog = true;
    applyView();
    fetch(HISTORY_CSV, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text => {
        logCsvText = text;
        logRows = parseCSV(text);
        // Order the columns the way the race above orders the rows, by the most
        // recent total, so the two halves of the page read the same way.
        const latest = {};
        logRows.forEach(r => {
          const prev = latest[r.group];
          if (!prev || r.date > prev.date) latest[r.group] = r;
        });
        logGroups = Object.keys(latest)
          .sort((a, b) => num(latest[b].total_streams) - num(latest[a].total_streams));

        const dl = document.getElementById('dl');
        dl.disabled = false;
        dl.addEventListener('click', () => {
          // Built from the text already fetched rather than linking the raw URL:
          // the download attribute is ignored cross-origin, so a plain link would
          // navigate away from the page instead of saving the file.
          const url = URL.createObjectURL(new Blob([logCsvText], { type: 'text/csv;charset=utf-8' }));
          const a = document.createElement('a');
          a.href = url;
          a.download = `girlgroup-streams-${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        const dayCount = new Set(logRows.map(r => r.date)).size;
        document.getElementById('lognote').innerHTML =
          `<b>What this is.</b> Every group's running Spotify total, fetched by us each night ` +
          `directly from Spotify off a fixed track list — not read from kworb, so a day kworb ` +
          `skips or a track it stops listing cannot affect it. A day is recorded only when ` +
          `Spotify publishes a new one, so a missing row means Spotify had not moved, not that ` +
          `the job failed. A group's first stored day is labelled as such, having nothing to ` +
          `subtract from. A total that FALLS is refused outright rather than stored. ` +
          `Currently ${dayCount} day${dayCount === 1 ? '' : 's'} across ${logGroups.length} groups.`;

        renderTabs();
        renderLog();
      })
      .catch(e => {
        document.getElementById('logbody').innerHTML =
          '<div class="tablewrap"><div class="logempty">Could not load the log (' +
          esc(e.message) + '). The file appears once the nightly job has run at least once.</div></div>';
      });
  }

  // ── Road to 1B ──────────────────────────────────────────────────────────
  // Per-track rather than per-group: which songs reach a billion streams, and
  // when. Fed by group_track_daily_stats, which the nightly fetch fills from the
  // per-track figures it already pulls to build the group totals.
  const _d = s => s ? new Date(Date.parse(s + 'T00:00:00Z'))
    .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const _dshort = s => s ? new Date(Date.parse(s + 'T00:00:00Z'))
    .toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : '—';

  function _bRow(t, i, arrived) {
    const pct = Math.max(2, Math.min(100, 100 * t.streams / 1e9));
    // Flags earned rather than decorative. A merged figure is not this track's
    // alone and a stale one was not observed, so neither is presented as a plain
    // reading — this is the same distinction the fetch records per row.
    const flags = [];
    if (t.mergedWith > 0) flags.push(`<span class="b-warn" title="Spotify is serving ${t.mergedWith + 1} versions of this song as one merged count, so this figure is not this track alone.">merged ×${t.mergedWith + 1}</span>`);
    if (t.stale) flags.push('<span class="b-warn" title="The fetch failed for this track and the last known value was carried forward.">not observed</span>');
    if (t.releasePrecision === 'year') flags.push('<span class="b-warn" title="Spotify gives only a year for this release, so the days-from-release figure is approximate.">year-only date</span>');
    // Spotify dates a track by the album its ID sits on, so a single later folded
    // into an album reads months late — JUMP came back as DEADLINE's 2026-02-27
    // rather than its own 2025-07-11. The date is normally corrected by finding
    // the earliest release carrying the title; when that search finds nothing
    // (a feature, a soundtrack) the album date stands and must say so, because
    // it is an upper bound on the real one, not the real one.
    // Not "may be late": it can miss in either direction. Kiss And Make Up's ID
    // sits on a Dua Lipa album dated 2017-06-02, sixteen months BEFORE the song
    // came out, while a single folded into a later album reads late. The honest
    // claim is only that this is the album the ID belongs to.
    else if (t.releasePrecision === 'album') flags.push('<span class="b-warn" title="No release carrying this title was found in the group\'s discography, so this is the date of the album this track ID sits on. The song itself may be older or newer than that.">album date, not the song\'s</span>');

    // The right column reads top to bottom as: when · how long in total · how
    // fast. It used to carry days-left while the TOTAL was buried mid-sentence
    // on the left, so the two "days" numbers sat in different places and the
    // bigger one looked like a detail of the smaller.
    // The change rides WITH the total — "961 days total (+1 day)" — rather than
    // sitting on its own line as a change to be applied. Either form carries the
    // same two facts, but one is read and the other has to be worked out.
    const drift = (() => {
      if (t.totalDaysDelta == null) return '';
      const n = t.totalDaysDelta, was = t.totalDaysPrev;
      const when = esc(t.prevDay || '');
      if (n === 0) {
        // A zero here is the STEADY case, not a missing reading: a day passed
        // and a day's worth of streams arrived, so the finish line did not move.
        return ` <span class="b-flat" title="Unchanged from ${when}: a day passed and a day's worth of streams arrived, so the finish line did not move.">(unchanged)</span>`;
      }
      const cls = n < 0 ? 'b-closer' : 'b-slower';
      const mag = Math.abs(n);
      return ` <span class="${cls}" title="On ${when} the same estimate came to ${was.toLocaleString()} days; today it comes to ${t.totalDays.toLocaleString()}.">`
           + `(${n < 0 ? '\u2212' : '+'}${mag.toLocaleString()}\u00a0${mag === 1 ? 'day' : 'days'})</span>`;
    })();

    let right, sub;
    if (arrived) {
      right = `<div class="b-eta" style="color:var(--gold)">past 1B</div>`;
      sub = `<div class="b-sub">${big(t.streams)}${t.rate ? ` · +${fmt(Math.round(t.rate))}/day` : ''}</div>`;
    } else if (t.daysLeft == null) {
      right = `<div class="b-eta">—</div>`;
      sub = `<div class="b-sub">not enough history for a rate</div>`;
    } else {
      const soon = t.daysLeft <= 120 ? ' soon' : '';
      right = `<div class="b-eta${soon}">${_dshort(t.eta)}</div>`;
      sub = t.totalDays != null
        // The drift gets its own line rather than trailing the total behind a
        // separator: at this width the separator wrapped and left a line
        // starting with a stray "·".
        ? `<div class="b-tot"><b>${t.totalDays.toLocaleString()}</b> days total${drift}</div>`
          + `<div class="b-sub">+${fmt(Math.round(t.rate))}/day</div>`
        // No release date, so no total to show — the days left and the rate are
        // still real and go where the total would have been.
        : `<div class="b-tot"><b>${t.daysLeft.toLocaleString()}</b> days left</div>`
          + `<div class="b-sub">+${fmt(Math.round(t.rate))}/day</div>`;
    }

    // The split of the total into measured and projected, on the left, where the
    // reading order is "this song, this far in, this much to go". The total
    // itself sits on the right under the date it implies, because those two are
    // the same claim stated twice and belong together.
    const total = (!arrived && t.totalDays != null)
      ? `<div class="b-days"><b>${t.elapsed.toLocaleString()}</b> days passed · <b>${t.daysLeft.toLocaleString()}</b> left</div>`
      : (t.release
          ? `<div class="b-days">released ${_d(t.release)}${t.elapsed != null ? ` · ${t.elapsed.toLocaleString()} days ago` : ''}</div>`
          : `<div class="b-days" style="color:var(--dim)">no release date on file</div>`);

    // The arrived list is not a ranking — it is a set of tracks that are simply
    // done — so it carries no position. Numbering it restarted at 1 under the
    // racing list and read as a second leaderboard.
    // Only a track with a day-by-day series has anything to open.
    const canOpen = (t.series || []).length >= 2;
    const open = canOpen && _bOpen === t.trackId;
    return `<div class="row${arrived ? ' done' : (i === 0 ? ' lead' : '')}`
      + `${canOpen ? ' tappable' : ''}${open ? ' open' : ''}"`
      + `${canOpen ? ` data-tid="${esc(t.trackId)}"` : ''}>
      <div class="rank">${arrived ? '✓' : i + 1}</div>
      <div>
        <div class="name">${esc(t.name)}${canOpen ? `<span class="b-chev">${open ? '▾' : '▸'}</span>` : ''}</div>
        <div class="meta"><span class="b-grp">${esc(t.group)}</span> · ${fmt(t.streams)}${arrived ? '' : ` · ${big(t.toGo)} to go`}</div>
        ${total}
        ${flags.length ? `<div class="b-days">${flags.join(' · ')}</div>` : ''}
      </div>
      <div class="nums">${right}${sub}</div>
      <div class="track"><i style="width:${pct.toFixed(1)}%"></i></div>
      ${open ? `<div class="b-panel">${_bChart(t)}</div>` : ''}
    </div>`;
  }

  // ── per-track panel ───────────────────────────────────────────────────────
  // One bar per recorded day. Every day adds streams, so "closer to 1B" is
  // always true in absolute terms and says nothing; what moves the finish line
  // is whether a day beat the track's own typical day. So the bars are measured
  // against this track's median day, and the caption answers the question in
  // calendar terms — what the early pace implied against what the recent pace
  // implies.
  function _median(ns) {
    if (!ns.length) return 0;
    const s = [...ns].sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function _bChart(t) {
    const pts = (t.series || []).filter(p => p.dd != null);
    if (pts.length < 2) return '<div class="b-cap">Not enough recorded days to chart yet.</div>';
    // A day is only comparable if we actually observed it and it is this track's
    // own figure — the same exclusions the rate uses, so the picture and the
    // number cannot disagree.
    const clean = pts.filter(p => !p.st && !p.m && p.dd > 0).map(p => p.dd);
    const med = _median(clean);
    const hi = Math.max(...pts.map(p => p.dd), med, 1);
    const W = 320, H = 118, PL = 40, PR = 8, PT = 10, PB = 20;
    const n = pts.length;
    const bw = Math.max(2, (W - PL - PR) / n - 2);
    const X = i => PL + i * ((W - PL - PR) / n) + 1;
    const Y = v => H - PB - (v / hi) * (H - PT - PB);
    const COL_UP = '#ff2e77', COL_DOWN = '#6a3f52', COL_FLAG = '#f5c542';
    let bars = '';
    pts.forEach((p, i) => {
      const flagged = !!(p.st || p.m) || p.dd === 0;
      const col = flagged ? COL_FLAG : (p.dd >= med ? COL_UP : COL_DOWN);
      const y = Y(p.dd), h = Math.max(1, H - PB - y);
      const why = flagged
        ? (p.st ? 'carried forward, not observed'
                : p.m ? 'merged with another version'
                      : 'no movement recorded that day')
        : (p.dd >= med ? 'at or above its typical day' : 'below its typical day');
      bars += `<rect x="${X(i).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" `
            + `height="${h.toFixed(1)}" rx="1" fill="${col}"${flagged ? ' opacity="0.55"' : ''}>`
            + `<title>${esc(p.d)} · ${fmt(p.dd)} — ${why}</title></rect>`;
    });
    const medY = Y(med);
    const grid = `<line x1="${PL}" x2="${W - PR}" y1="${medY.toFixed(1)}" y2="${medY.toFixed(1)}" `
      + `stroke="#ffffff33" stroke-dasharray="3 3"/>`
      + `<text x="${PL - 5}" y="${(medY + 3).toFixed(1)}" text-anchor="end" fill="#8a5c6c" font-size="8">${big(med)}</text>`
      + `<text x="${PL - 5}" y="${(H - PB).toFixed(1)}" text-anchor="end" fill="#8a5c6c" font-size="8">0</text>`;
    const xlab = `<text x="${PL}" y="${H - 6}" fill="#8a5c6c" font-size="8">${esc(pts[0].d.slice(5))}</text>`
      + `<text x="${W - PR}" y="${H - 6}" text-anchor="end" fill="#8a5c6c" font-size="8">${esc(pts[n - 1].d.slice(5))}</text>`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" class="b-chart" preserveAspectRatio="xMidYMid meet" `
      + `role="img" aria-label="Daily streams for ${esc(t.name)}">${grid}${bars}${xlab}</svg>`;

    // The caption. `trend` compares the pace over the older half of the span
    // with the newer half and asks what each implies for the streams still to
    // go — which is the difference between "it is still moving" and "it is
    // arriving sooner than it was".
    let cap;
    const tr = t.trend;
    if (!tr) {
      cap = '<div class="b-cap">Too few clean days yet to say whether the pace is changing.</div>';
    } else if (tr.shift == null) {
      // Past 1B: the two paces still say whether it is speeding up or slowing,
      // but there is no distance left to turn either into an arrival date.
      const faster = tr.late > tr.early;
      cap = `<div class="b-cap">Past 1B, and still `
          + `<span class="${faster ? 'b-closer' : 'b-slower'}">${faster ? 'speeding up' : 'slowing'}</span> — `
          + `<b>+${fmt(Math.round(tr.early))}/day</b> over ${esc(tr.earlyFrom.slice(5))}–${esc(tr.midAt.slice(5))} `
          + `vs <b>+${fmt(Math.round(tr.late))}/day</b> since.</div>`;
    } else {
      const sh = tr.shift;
      const word = sh <= -3 ? `<span class="b-closer">1B is ${Math.abs(sh).toLocaleString()} days closer</span>`
                 : sh >= 3 ? `<span class="b-slower">1B slipped ${sh.toLocaleString()} days further</span>`
                           : `<span class="b-flat">holding steady</span>`;
      cap = `<div class="b-cap">${word} than the earlier pace implied — `
          + `<b>+${fmt(Math.round(tr.early))}/day</b> over ${esc(tr.earlyFrom.slice(5))}–${esc(tr.midAt.slice(5))} `
          + `vs <b>+${fmt(Math.round(tr.late))}/day</b> since, which is `
          + `${tr.daysAtEarly.toLocaleString()} days left against ${tr.daysAtLate.toLocaleString()}.</div>`;
    }
    const leg = `<div class="b-leg">`
      + `<span><i style="background:${COL_UP}"></i>at or above its median day</span>`
      + `<span><i style="background:${COL_DOWN}"></i>below</span>`
      + `<span><i style="background:${COL_FLAG};opacity:.55"></i>not a clean reading</span></div>`;
    return svg + cap + leg;
  }

  // Sort and filter are per-viewer conveniences, so they live in localStorage
  // and every read is wrapped — a private window throws on access rather than
  // returning null.
  const SORT_LS = 'bu_gg_1b_sort', GRP_LS = 'bu_gg_1b_group';
  let _bSort = 'soon', _bGroup = 'ALL', _bOpen = null;
  const SORTS = {
    // Nulls sink in every order: a track with no rate has no position in a race.
    soon:  (a, b) => (a.daysLeft ?? 1e9) - (b.daysLeft ?? 1e9),
    total: (a, b) => (a.totalDays ?? 1e9) - (b.totalDays ?? 1e9),
    daily: (a, b) => (b.rate ?? -1) - (a.rate ?? -1),
  };

  let _b = null;

  function buildControls(d) {
    const ctl = document.getElementById('b-ctl');
    ctl.hidden = false;
    // The filter lists only the groups actually on the board, so it can never
    // offer an option that empties it.
    const groups = [...new Set([...(d.tracks || []), ...(d.done || [])].map(t => t.group))].sort();
    if (!groups.includes(_bGroup)) _bGroup = 'ALL';
    const sel = document.getElementById('b-group');
    sel.innerHTML = `<option value="ALL">All groups</option>`
      + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
    sel.value = _bGroup;
    sel.onchange = () => {
      _bGroup = sel.value;
      try { localStorage.setItem(GRP_LS, _bGroup); } catch {}
      drawBoard();
    };
    ctl.querySelectorAll('.b-sort').forEach(b => {
      b.onclick = () => {
        _bSort = b.dataset.sort;
        try { localStorage.setItem(SORT_LS, _bSort); } catch {}
        drawBoard();
      };
    });
  }

  function drawBoard() {
    const d = _b;
    if (!d) return;
    const body = document.getElementById('b-body');
    document.querySelectorAll('#b-sorts .b-sort').forEach(b =>
      b.setAttribute('aria-selected', b.dataset.sort === _bSort ? 'true' : 'false'));

    const keep = t => _bGroup === 'ALL' || t.group === _bGroup;
    const racing = (d.tracks || []).filter(keep).sort(SORTS[_bSort] || SORTS.soon);
    // The arrived list has no days-left or release→1B to sort by, so under
    // either of those it keeps its own order (biggest first) rather than being
    // shuffled by a field it does not have.
    const arrived = (d.done || []).filter(keep)
      .sort(_bSort === 'daily' ? SORTS.daily : (a, b) => b.streams - a.streams);

    if (!racing.length && !arrived.length) {
      body.className = 'b-empty';
      body.innerHTML = `No tracks for ${esc(_bGroup)} on this board.`;
      return;
    }
    body.className = '';
    const label = { soon: 'soonest first', total: 'fewest days from release first',
                    daily: 'fastest per day first' }[_bSort];
    body.innerHTML =
      (racing.length
        ? `<div class="b-head">Closing in · ${racing.length} track${racing.length === 1 ? '' : 's'}`
          + `${_bGroup === 'ALL' ? ` over ${big(d.floor)}` : ''} · ${label}</div>`
          + racing.map((t, i) => _bRow(t, i, false)).join('')
        : '') +
      (arrived.length
        ? `<div class="b-head">Already past a billion</div>`
          + arrived.map((t, i) => _bRow(t, i, true)).join('')
        : '');
  }

  // Delegated, because the rows are rebuilt on every sort and filter change —
  // handlers bound to the old nodes would be thrown away with them.
  document.addEventListener('click', e => {
    if (!e.target.closest) return;
    // A tap inside an open chart is reading it, not asking to close it — the
    // bars carry their own tooltips, and collapsing the panel out from under
    // that is the opposite of what the tap meant.
    if (e.target.closest('#b-body .b-panel')) return;
    const row = e.target.closest('#b-body .row.tappable');
    if (!row) return;
    _bOpen = (_bOpen === row.dataset.tid) ? null : row.dataset.tid;
    drawBoard();
  });

  function render1B(d) {
    _b = d;
    try {
      _bSort = localStorage.getItem(SORT_LS) || _bSort;
      _bGroup = localStorage.getItem(GRP_LS) || _bGroup;
    } catch {}
    if (!SORTS[_bSort]) _bSort = 'soon';
    const body = document.getElementById('b-body');
    const racing = d.tracks || [], arrived = d.done || [];
    if (!racing.length && !arrived.length) {
      body.className = 'b-empty';
      body.innerHTML = 'No per-track rows yet. They are written by the nightly fetch, ' +
        'one day at a time, the first time Spotify publishes after the table was created.';
      document.getElementById('b-note').innerHTML = '';
      return;
    }
    buildControls(d);
    drawBoard();

    const nDated = racing.filter(t => t.release).length;
    document.getElementById('b-note').innerHTML =
      `<b>How this is worked out.</b> ${esc(d.note || '')} ` +
      `Figures are for streaming day <b>${esc(d.asOf || '—')}</b>. ` +
      `<b>Release dates are the earliest Spotify still lists.</b> A pre-release single ` +
      `that was delisted once its album shipped leaves no trace, so a date can be later ` +
      `than the real one and nothing in the data shows it — How You Like That reads ` +
      `2 Oct 2020, its album, rather than the 26 Jun single. Days-from-release is ` +
      `therefore a floor for the older tracks. ` +
      `A track's rate is taken from its own recorded span, so a song that has been ` +
      `slowing for weeks projects from what it is doing now rather than its peak — ` +
      `and because these tracks are nearly all decaying, every arrival date here is ` +
      `the <b>earliest plausible</b> one, not the likeliest. ` +
      (nDated < racing.length
        ? `${racing.length - nDated} of ${racing.length} have no release date on file yet, ` +
          `so they show an arrival date but no days-from-release figure. `
        : '') +
      `The tracks already past a billion are shown without a days figure on purpose: ` +
      `our per-track history begins in September 2026 and they crossed long before, ` +
      `so the number of days it took them is not something this data can tell you.`;
  }

  let _1bLoaded = false;
  function load1B(key) {
    if (_1bLoaded) return;
    _1bLoaded = true;
    fetch('/api/girlgroups?view=1b', { headers: { 'x-admin-secret': key } })
      .then(r => r.json())
      .then(d => { if (d.error) throw new Error(d.error); render1B(d); })
      .catch(e => {
        _1bLoaded = false;   // let a retry happen on the next switch
        document.getElementById('b-body').className = 'b-empty';
        document.getElementById('b-body').textContent = 'Could not load: ' + e.message;
      });
  }

  const VIEW_LS = 'bu_gg_view';
  // Visibility is RECOMPUTED from state rather than toggled in place. The log
  // and the catch-up box un-hide themselves when their data arrives, and the log
  // arrives from a fetch — so a switch to the 1B view that merely hid them would
  // be undone a moment later when that fetch resolved, putting the group race's
  // log under the 1B board. Each block's own "do I have data" flag and the
  // current view are tracked separately and applied together.
  let _view = 'race', _hasCatchup = false, _hasLog = false, _staleShown = false;
  function applyView() {
    const race = _view === 'race';
    const set = (id, show) => { const el = document.getElementById(id); if (el) el.hidden = !show; };
    set('list', race);
    set('note', race);
    set('catchup', race && _hasCatchup);
    set('logsec', race && _hasLog);
    set('race1b', !race);
    document.getElementById('stale').style.display = (race && _staleShown) ? 'block' : 'none';
    document.querySelectorAll('#modes .mode').forEach(b =>
      b.setAttribute('aria-selected', (b.dataset.view === _view) ? 'true' : 'false'));
    document.querySelector('.kicker').textContent = race ? 'Spotify · this year' : 'Spotify · per track';
  }
  function setView(v, key) {
    _view = v;
    applyView();
    try { localStorage.setItem(VIEW_LS, v); } catch {}
    if (v === '1b') load1B(key);
  }

  function initViews(key) {
    const modes = document.getElementById('modes');
    modes.hidden = false;
    modes.querySelectorAll('.mode').forEach(b =>
      b.addEventListener('click', () => setView(b.dataset.view, key)));
    let saved = 'race';
    try { saved = localStorage.getItem(VIEW_LS) || 'race'; } catch {}
    setView(saved === '1b' ? '1b' : 'race', key);
  }

  // Admin-only. The key is the same one the rest of the site stores after the
  // admin unlock on the home page, so there is one login, not two. Sent as a
  // header rather than ?key= to keep it out of URLs, referrers and access logs.
  const ADMIN_KEY_LS = 'bu_admin_key';
  const key = (() => { try { return localStorage.getItem(ADMIN_KEY_LS); } catch { return null; } })();

  function locked(msg) {
    document.getElementById('asof').textContent = '';
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.innerHTML = msg;
  }

  if (!key) {
    locked('Admin only. Unlock on the <a href="/" style="color:var(--pink-soft)">home page</a>, then come back.');
  } else {
    fetch('/api/girlgroups', { headers: { 'x-admin-secret': key } })
      .then(r => {
        if (r.status === 401) {
          // Stale or wrong key — drop it so the next unlock starts clean, the
          // same way the admin panels on the home page treat a 401.
          try { localStorage.removeItem(ADMIN_KEY_LS); } catch {}
          throw new Error('__401__');
        }
        return r.json();
      })
      .then(d => { if (d.error) throw new Error(d.error); render(d); loadLog(); initViews(key); })
      .catch(e => {
        if (e.message === '__401__') {
          locked('That admin key was rejected. Unlock again on the <a href="/" style="color:var(--pink-soft)">home page</a>.');
        } else {
          locked('Could not load: ' + e.message);
        }
      });
  }
</script>
</body>
</html>
