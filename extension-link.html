<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link your account — blinksunited</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#121212; color:#f2f2f2; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(420px,92vw); background:#1c1c1e; border:1px solid #2c2c2e; border-radius:14px; padding:24px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#9a9a9a; font-size:13px; margin:6px 0 16px; }
    label { display:block; font-size:12px; color:#9a9a9a; margin:10px 0 4px; }
    input { width:100%; box-sizing:border-box; background:#0e0e0e; border:1px solid #2c2c2e; border-radius:8px;
      padding:10px; color:#f2f2f2; font-size:14px; }
    button { width:100%; margin-top:14px; padding:11px; border:none; border-radius:8px; cursor:pointer;
      background:#1db954; color:#04220f; font-weight:700; font-size:14px; }
    button.ghost { background:transparent; border:1px solid #2c2c2e; color:#f2f2f2; font-weight:500; }
    .msg { margin-top:14px; font-size:13px; }
    .ok { color:#1db954; } .err { color:#e0554e; }
    .hidden { display:none; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
    .chips button { width:auto; margin:0; padding:7px 12px; border:1px solid #4a1526; border-radius:999px;
      background:transparent; color:#d38aa4; font-weight:500; font-size:12px; }
    .chips button.on { border-color:#ff2e77; background:rgba(255,46,119,0.14); color:#fff2f6; }
    .foot { margin-top:16px; font-size:11px; color:#6a6a6a; }
    a { color:#1db954; }
  </style>
  <script src="/i18n/i18n.js" defer></script>
</head>
<body>
  <div class="card">
    <h1 id="title">Link your account</h1>
    <p id="lead">Connecting your blinksunited profile…</p>

    <div id="login" class="hidden">
      <!-- The counter app's people only. A scrobbler user is a blink who is
           already streaming; a BLOOM linking the counter may be making an
           account for this trade and nothing else. -->
      <div id="appintro" class="hidden">
        <label>Which fandom are you? <span style="opacity:0.6">(optional)</span></label>
        <div id="fandoms" class="chips"></div>
      </div>
      <button id="google">Continue with Google</button>
      <button id="twitter" class="ghost">Continue with X</button>
      <button id="discord" class="ghost">Continue with Discord</button>
      <div style="text-align:center;color:#6a6a6a;font-size:11px;margin:12px 0 2px;">— or with email —</div>
      <label>Email<input id="email" type="email" autocomplete="email" /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
      <button id="signin" class="ghost">Sign in &amp; link</button>
      <button id="magic" class="ghost">Email me a login link instead</button>
    </div>

    <!-- Shown once linked, so somebody who is here only for a vote trade can be
         a name rather than one of many identical anonymous rows. -->
    <div id="namebox" class="hidden">
      <label>Your name on the <a href="/collabs">collab board</a>
        <span style="opacity:0.6">(optional — leave it and stay anonymous)</span></label>
      <input id="dname" type="text" maxlength="40" autocomplete="off" />
      <button id="savename" class="ghost">Save this name</button>
    </div>

    <div id="status" class="msg"></div>
    <div class="foot">The anon key here is public by design; your account stays protected by Supabase RLS.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://esbzlrmrdvvsrsobrzfz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYnpscm1yZHZ2c3Jzb2JyemZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODQyNDYsImV4cCI6MjA5NTY2MDI0Nn0.P3VhWYeog5CmE67VjvHboG3rP876OPjcmmtBmz1zfck';
    // Guarded: the library comes from a CDN, and unguarded this threw at the
    // first line, leaving a card with nothing to press and no explanation.
    if (typeof supabase === 'undefined' || !supabase.createClient) {
      document.getElementById('lead').textContent =
        'Could not load the sign-in library — something is blocking cdn.jsdelivr.net.';
      document.getElementById('status').className = 'msg err';
      document.getElementById('status').textContent =
        'Try another network or turn off a content blocker for this page, then reload.';
      throw new Error('supabase-js did not load');
    }
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // This page serves TWO products: the Multi-Account Scrobbler extension, and
    // the Android Vote Counter app (which opens it with ?app=android so the
    // token can bounce back through a deep link). They need different words and
    // different questions — a BLOOM linking the counter is not here to scrobble
    // — so everything below branches on this rather than pitching one at both.
    const IS_APP = new URLSearchParams(location.search).get('app') === 'android';

    const $ = (id) => document.getElementById(id);
    const status = (html, cls) => { $('status').className = 'msg ' + (cls || ''); $('status').innerHTML = html; };
    let extensionSeen = false;

    // The extension's content script announces itself and acks the save.
    window.addEventListener('message', (e) => {
      if (e.source !== window || !e.data) return;
      if (e.data.source === 'bu-ext-link-ready') extensionSeen = true;
      if (e.data.source === 'bu-ext-link-ack') {
        if (e.data.ok) status(IS_APP
          ? '✅ Linked! The votes you cast will now log to your profile and to the <a href="/collabs">collab board</a>.'
          : '✅ Linked! Every Spotify tab in this browser now scrobbles to your profile. You can close this tab.', 'ok');
        else status('Could not save to the extension. Make sure it is installed and enabled, then reload.', 'err');
      }
    });

    // Same sides, same keys, same reserved namespace as /vote-link — the other
    // page somebody can link from. test_fandom_names checks the two agree.
    const FANDOMS = [
      { key: 'blink',    label: 'BLINK' },
      { key: 'bloom',    label: 'BLOOM' },
    ];
    const RESERVED = new RegExp('^(' + FANDOMS.map((f) => f.key).join('|') + ')\\d+$', 'i');
    const myFandom = () => {
      try {
        const v = localStorage.getItem('buFandom');
        return FANDOMS.some((f) => f.key === v) ? v : null;
      } catch { return null; }
    };
    function renderFandoms() {
      const cur = myFandom();
      $('fandoms').innerHTML = FANDOMS.map((f) =>
        `<button type="button" data-f="${f.key}" class="${f.key === cur ? 'on' : ''}">${f.label}</button>`).join('');
    }
    if (IS_APP) {
      $('appintro').classList.remove('hidden');
      renderFandoms();
      $('fandoms').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-f]');
        if (!btn) return;
        try { localStorage.setItem('buFandom', btn.getAttribute('data-f')); } catch {}
        renderFandoms();
      });
    }

    // Give a brand-new account a numbered name before the token is minted:
    // /api/extension-link stores the token's label once and reuses it for ever,
    // so a name arriving afterwards would never be seen.
    async function ensureFanName(session) {
      const md = session.user.user_metadata || {};
      const fandom = md.fandom || myFandom();
      try {
        if (md.display_name) {
          if (!fandom) return;
          const { data: name } = await sb.rpc('reissue_fan_name', { p_fandom: fandom });
          if (!name || name === md.display_name) return;
          await sb.auth.updateUser({ data: { display_name: name, display_name_auto: true } });
          return;
        }
        const created = session.user.created_at ? Date.parse(session.user.created_at) : 0;
        if (!created || (Date.now() - created) > 10 * 60 * 1000) return;
        let name = null;
        const got = await sb.rpc('assign_fan_name', { p_fandom: fandom || 'blink' });
        if (got.error) {
          const old = await sb.rpc('assign_blink_name');
          name = old.error ? null : old.data;
        } else { name = got.data; }
        if (!name) return;
        const data = { display_name: name, display_name_auto: true };
        if (fandom && md.fandom !== fandom) data.fandom = fandom;
        await sb.auth.updateUser({ data });
      } catch {}
    }

    $('savename').addEventListener('click', async () => {
      const name = $('dname').value.trim();
      if (!name) { status('Enter a name, or leave this alone to stay anonymous.', 'err'); return; }
      if (RESERVED.test(name)) {
        status('That name is reserved — it is one the site hands out. Please choose another.', 'err');
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { status('Sign in first.', 'err'); return; }
      // display_name_auto FALSE: a name they chose is never replaced by a later
      // fandom answer.
      const { error } = await sb.auth.updateUser({
        data: { display_name: name, display_name_auto: false } });
      if (error) { status('Could not save that: ' + error.message, 'err'); return; }
      try {
        await fetch('/api/leaderboard?action=set-display-name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName: name, accessToken: session.access_token }),
        });
      } catch (e) {}
      status('✅ Saved — you are <b>' + name.replace(/[<&>]/g, '') + '</b> on the collab board.', 'ok');
      $('lead').textContent = 'Signed in as ' + name + '.';
    });

    async function mintAndSend() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showLogin(); return; }
      status('Linking…');
      try {
        await ensureFanName(session);
        const r = await fetch('/api/extension-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: session.access_token }),
        });
        const d = await r.json();
        if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
        // Hand the token to the extension.
        window.postMessage({ source: 'bu-ext-link', token: d.token, profile: d.profile }, '*');
        $('login').classList.add('hidden');
        $('lead').textContent = `Signed in as ${d.profile}.`;
      if (IS_APP) {
        const { data: { session: s2 } } = await sb.auth.getSession();
        $('dname').value = (s2 && s2.user.user_metadata && s2.user.user_metadata.display_name) || '';
        $('namebox').classList.remove('hidden');
      }

        // Native Android app handoff: when this page is opened from the BU Vote
        // Counter app (?app=android) — in the user's real browser, so OAuth works —
        // bounce the token back into the app via its custom-scheme deep link. This
        // avoids embedded-WebView logins, which X/Google refuse.
        if (new URLSearchParams(location.search).get('app') === 'android') {
          status('✅ Signed in — opening the app…', 'ok');
          const deep = 'buvotecounter://link?token=' + encodeURIComponent(d.token)
            + '&profile=' + encodeURIComponent(d.profile || '');
          location.href = deep;
          setTimeout(() => {
            status('If the app didn\'t reopen, tap here: <a href="' + deep + '">return to BU Vote Counter</a>', 'ok');
          }, 1500);
          return;
        }

        status('Handing the token to the extension…');
        // If no ack shortly, the extension probably isn't installed here.
        setTimeout(() => {
          if (!extensionSeen) {
            status('Extension not detected on this page. Install/enable the SessionBox Multi-Account Scrobbler, then reload this page.', 'err');
          }
        }, 2500);
      } catch (err) {
        status('Error: ' + err.message, 'err');
      }
    }

    function showLogin() {
      // Two products, two readings. Telling somebody who installed the vote
      // counter to "link the scrobbler" is how an account starts looking like
      // more than it is.
      if (IS_APP) {
        $('title').textContent = 'Link your vote counter';
        document.title = 'Link your vote counter — blinksunited';
        $('lead').innerHTML = 'Sign in with your blinksunited account to link the vote counter. '
          + '<b>An account is all this needs</b> — no scrobbler, no streaming, nothing to set up.';
      } else {
        $('title').textContent = 'Link your scrobbler';
        document.title = 'Link your scrobbler — blinksunited';
        $('lead').textContent = 'Sign in with your blinksunited account to link the extension.';
      }
      $('login').classList.remove('hidden');
      status('');
    }

    // OAuth providers — same set and same provider strings the main site
    // (index.html signInWithProvider) uses, so this page links with whatever
    // provider your blinksunited account was created with. redirectTo stays on
    // THIS page so the OAuth round-trip returns here and mints/hands off the
    // token (onAuthStateChange → mintAndSend below). Note the X provider id is
    // 'x' (matching the main site) — the old 'twitter' id is what Supabase was
    // rejecting as "provider is not enabled".
    async function oauth(provider, label) {
      status('Redirecting to ' + label + '…');
      const { error } = await sb.auth.signInWithOAuth({
        provider,
        options: { redirectTo: location.href },
      });
      if (error) status(label + ' sign-in failed: ' + error.message, 'err');
    }
    $('google').addEventListener('click', () => oauth('google', 'Google'));
    $('twitter').addEventListener('click', () => oauth('x', 'X'));
    $('discord').addEventListener('click', () => oauth('discord', 'Discord'));

    $('signin').addEventListener('click', async () => {
      const email = $('email').value.trim(); const password = $('password').value;
      if (!email || !password) return;
      status('Signing in…');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { status('Sign-in failed: ' + error.message, 'err'); return; }
      mintAndSend();
    });

    $('magic').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { status('Enter your email first.', 'err'); return; }
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      status(error ? ('Could not send link: ' + error.message) : 'Check your email for a login link, then reopen this page.', error ? 'err' : 'ok');
    });

    // Re-run when auth state resolves (e.g. returning from a magic link).
    sb.auth.onAuthStateChange(() => mintAndSend());
    mintAndSend();
  </script>
</body>
</html>
