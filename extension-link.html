<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link your scrobbler — blinksunited</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#121212; color:#f2f2f2; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(420px,92vw); background:#1c1c1e; border:1px solid #2c2c2e; border-radius:14px; padding:24px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#9a9a9a; font-size:13px; margin:6px 0 16px; }
    label { display:block; font-size:12px; color:#9a9a9a; margin:10px 0 4px; }
    input { width:100%; box-sizing:border-box; background:#0e0e0e; border:1px solid #2c2c2e; border-radius:8px;
      padding:10px; color:#f2f2f2; font-size:14px; }
    button { width:100%; margin-top:14px; padding:11px; border:none; border-radius:8px; cursor:pointer;
      background:#1db954; color:#04220f; font-weight:700; font-size:14px; }
    button.ghost { background:transparent; border:1px solid #2c2c2e; color:#f2f2f2; font-weight:500; }
    .msg { margin-top:14px; font-size:13px; }
    .ok { color:#1db954; } .err { color:#e0554e; }
    .hidden { display:none; }
    .foot { margin-top:16px; font-size:11px; color:#6a6a6a; }
    a { color:#1db954; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Link your scrobbler</h1>
    <p id="lead">Connecting your blinksunited profile to the Multi-Account Scrobbler extension…</p>

    <div id="login" class="hidden">
      <label>Email<input id="email" type="email" autocomplete="email" /></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" /></label>
      <button id="signin">Sign in &amp; link</button>
      <button id="magic" class="ghost">Email me a login link instead</button>
    </div>

    <div id="status" class="msg"></div>
    <div class="foot">The anon key here is public by design; your account stays protected by Supabase RLS.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://esbzlrmrdvvsrsobrzfz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYnpscm1yZHZ2c3Jzb2JyemZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODQyNDYsImV4cCI6MjA5NTY2MDI0Nn0.P3VhWYeog5CmE67VjvHboG3rP876OPjcmmtBmz1zfck';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const status = (html, cls) => { $('status').className = 'msg ' + (cls || ''); $('status').innerHTML = html; };
    let extensionSeen = false;

    // The extension's content script announces itself and acks the save.
    window.addEventListener('message', (e) => {
      if (e.source !== window || !e.data) return;
      if (e.data.source === 'bu-ext-link-ready') extensionSeen = true;
      if (e.data.source === 'bu-ext-link-ack') {
        if (e.data.ok) status('✅ Linked! Every Spotify tab in this browser now scrobbles to your profile. You can close this tab.', 'ok');
        else status('Could not save to the extension. Make sure it is installed and enabled, then reload.', 'err');
      }
    });

    async function mintAndSend() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showLogin(); return; }
      status('Linking…');
      try {
        const r = await fetch('/api/extension-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: session.access_token }),
        });
        const d = await r.json();
        if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
        // Hand the token to the extension.
        window.postMessage({ source: 'bu-ext-link', token: d.token, profile: d.profile }, '*');
        $('login').classList.add('hidden');
        $('lead').textContent = `Signed in as ${d.profile}.`;
        status('Handing the token to the extension…');
        // If no ack shortly, the extension probably isn't installed here.
        setTimeout(() => {
          if (!extensionSeen) {
            status('Extension not detected on this page. Install/enable the SessionBox Multi-Account Scrobbler, then reload this page.', 'err');
          }
        }, 2500);
      } catch (err) {
        status('Error: ' + err.message, 'err');
      }
    }

    function showLogin() {
      $('lead').textContent = 'Sign in with your blinksunited account to link the extension.';
      $('login').classList.remove('hidden');
      status('');
    }

    $('signin').addEventListener('click', async () => {
      const email = $('email').value.trim(); const password = $('password').value;
      if (!email || !password) return;
      status('Signing in…');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { status('Sign-in failed: ' + error.message, 'err'); return; }
      mintAndSend();
    });

    $('magic').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { status('Enter your email first.', 'err'); return; }
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      status(error ? ('Could not send link: ' + error.message) : 'Check your email for a login link, then reopen this page.', error ? 'err' : 'ok');
    });

    // Re-run when auth state resolves (e.g. returning from a magic link).
    sb.auth.onAuthStateChange(() => mintAndSend());
    mintAndSend();
  </script>
</body>
</html>
