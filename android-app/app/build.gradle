plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Optional release signing. keystore.properties + the keystore file are created by
// the CI build (see .github/workflows/build-android.yml). When absent (a bare local
// build) we fall back to debug signing so the project still assembles.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.blinksunited.votecounter'
    compileSdk 34

    defaultConfig {
        applicationId "com.blinksunited.votecounter"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.6"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
