name: Query LTAL scrobbles

# One-off: total up community scrobbles for "Less Than a Lover" from a past
# daily leaderboard snapshot (leaderboard_archive). overall_ltal in a day's
# snapshot = each user's CUMULATIVE ltal scrobbles as of the end of that day,
# so summing it (deduping linked/secondary accounts like the site does) gives
# the all-time LTAL total as of DATE.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Archive day key (YYYY-MM-DD)'
        required: true
        default: '2026-07-28'

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Sum overall_ltal from the daily archive
        env:
          TARGET: ${{ github.event.inputs.date }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          target = os.environ["TARGET"].strip()
          base = "https://blinksunited.com/api/leaderboard-archive"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "gh-actions-ltal-query"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Confirm the date exists + show neighbours for context.
          listing = get(f"{base}?period=daily")
          keys = sorted(k["key"] for k in listing.get("items", []))
          print("archived daily keys available:", keys[0] if keys else None, "->", keys[-1] if keys else None, f"({len(keys)} days)")
          near = [k for k in keys if "2026-07-2" in k or "2026-07-3" in k or "2026-08-0" in k]
          print("keys near target:", near)
          if target not in keys:
              print(f"\n!! No archive for {target}. Closest available shown above — re-run with one of those.")
              raise SystemExit(0)

          snap = get(f"{base}?period=daily&key={urllib.parse.quote(target)}")
          users = snap.get("users", {}) or {}

          # Same dedup as computeCommunityTotal(): skip any username that is listed
          # as another user's linkedAccount.
          secondary = set()
          for k, d in users.items():
              for a in (d.get("linkedAccounts") or []):
                  ak = (a.get("username") or "").lower()
                  if ak and ak != k.lower():
                      secondary.add(ak)

          def score(d, key):
              return (d.get("scores") or {}).get(key) or 0

          total_cumulative = 0   # overall_ltal = all-time as of that day
          total_that_day = 0     # daily_ltal   = scrobbles on that specific day
          contributors = []
          counted = 0
          for k, d in users.items():
              if k.lower() in secondary:
                  continue
              counted += 1
              v = score(d, "overall_ltal")
              total_cumulative += v
              total_that_day += score(d, "daily_ltal")
              if v:
                  contributors.append((d.get("displayName") or d.get("username") or k, v))

          contributors.sort(key=lambda x: -x[1])
          print("\nsnapshot archivedAt:", snap.get("archivedAt"), "| label:", snap.get("label"))
          print("counted users (deduped):", counted, "| secondary skipped:", len(secondary))
          print(f"\n=== LESS THAN A LOVER as of {target} ===")
          print("CUMULATIVE total scrobbles (overall_ltal):", f"{total_cumulative:,}")
          print("scrobbles on that day alone (daily_ltal):", f"{total_that_day:,}")
          print("\nTop 15 contributors (cumulative):")
          for name, v in contributors[:15]:
              print(f"  {v:>10,}  {name}")
          PY
