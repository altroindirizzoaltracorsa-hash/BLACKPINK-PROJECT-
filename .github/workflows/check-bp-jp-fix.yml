name: Check BP JP fix

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Only recompute days on/after this date (YYYY-MM-DD, blank = all)"
        required: false
        default: "2026-08-14"
      artist:
        description: "Limit to one artist_id (blank = all tracked)"
        required: false
        default: ""
      apply:
        description: "Set to 'true' to WRITE the corrections. Blank/false = dry-run (read-only)."
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Diagnose vma_user_votes.ext_at (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/diag_ext_at.py
