name: Probe track play_count

# Read-only: should this track count towards a group's total?
#
# Prints each track's play_count, its CREDITED ARTISTS, whether any pinned
# catalogue already counts it, and — with kworb_artist set — whether kworb lists
# it under that artist. A track on a group's Spotify profile is not necessarily
# a track credited to the group, and the catalogues are pinned to kworb's scope
# so that the seven groups stay comparable. Writes nothing.

on:
  workflow_dispatch:
    inputs:
      track_ids:
        description: 'Comma-separated Spotify track IDs'
        required: true
        default: '0CC8DrwncRXH6MqAL5A90O,0eOpWsum2W5l1KLxJ4QVcM,0IHmXRAKcRd00l50QW5pQU,4tPfvkQAA3q6PF6bkBhvB0,4HB3f71StsELKzgk2iV9mM'
      kworb_artist:
        description: 'Optional Spotify artist id — reports whether kworb lists each track under it'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spotifyscraper
        run: pip install spotifyscraper httpx
      - name: Fetch current play_count
        env:
          TRACK_IDS: ${{ inputs.track_ids }}
          KWORB_ARTIST: ${{ inputs.kworb_artist }}
        run: python .github/scripts/probe_track_playcount.py
