name: Fetch iTunes Store Chart Positions

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours — fresher snapshots, 4 captures per day
    - cron: '0 */6 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch iTunes Store chart positions
        run: node .github/scripts/fetch_itunes_chart_positions.mjs
      - name: Compute peak positions
        run: node .github/scripts/compute_itunes_peaks.mjs
      - name: Commit chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update iTunes Store chart positions $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
