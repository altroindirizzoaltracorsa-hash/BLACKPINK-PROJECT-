name: Fetch Apple Music Global Top 100

on:
  workflow_dispatch:
  schedule:
    # 08:30 UTC daily — offset from per-country run at 08:00
    - cron: '30 8 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install playwright
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Fetch Apple Music Global Top 100
        run: node .github/scripts/fetch-apple-global-chart.mjs
      - name: Commit chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove npm artifacts so they don't block git pull --rebase
          rm -rf node_modules package.json package-lock.json
          git add data/
          [ -f .apple-token-cache ] && git add .apple-token-cache || true
          git diff --cached --quiet || git commit -m "chore: update Apple Music Global Top 100 $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
