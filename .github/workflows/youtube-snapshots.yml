name: YouTube Snapshots

# Captures an hourly views/likes/comments snapshot for the /vs.html face-off.
# The YouTube fetch + Upstash write run on Vercel (/api/youtube-history?snapshot=1,
# which needs YOUTUBE_API_KEY there); this job just triggers it.
#
# Fires every 20 min, not hourly, because GitHub drops scheduled runs: against an
# hourly cron this workflow actually ran 6 times in 24h (4-5h gaps), and one of
# those gaps straddled a 24h mark. The endpoint self-limits — MIN_GAP_MS keeps the
# stored series to ~one point/hour — so the extra runs only cost a YouTube call and
# give the 24h pin three chances an hour instead of one.
on:
  schedule:
    - cron: '5,25,45 * * * *'   # :05/:25/:45 — off the busy top-of-hour, which GitHub sheds first
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (blank = production).'
        required: false
        default: ''

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture snapshot
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: ${{ inputs.base_url != '' && inputs.base_url || 'https://www.blinksunited.com' }}
        run: |
          code=$(curl -sS -L --max-time 60 -o /tmp/out.json -w '%{http_code}' \
            -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/youtube-history?snapshot=1")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ] || exit 1

          # Hit the READ path too. It is not passive — it re-derives and freezes
          # milestone crossings and 24h pins that the write path missed. That
          # self-heal used to be driven by whoever happened to open /vs.html;
          # now the page is admin-only, so this job drives it on a schedule
          # instead, which is more reliable than depending on a visitor.
          rcode=$(curl -sS -L --max-time 60 -o /dev/null -w '%{http_code}' \
            -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/youtube-history") || rcode=000
          echo "self-heal read: HTTP $rcode"
          [ "$rcode" = "200" ] || exit 1

          # And confirm the gate still holds from outside.
          ucode=$(curl -sS -L --max-time 60 -o /dev/null -w '%{http_code}' "$BASE/api/youtube-history") || ucode=000
          [ "$ucode" = "401" ] && echo "gate: unauthenticated read refused (401)" \
            || { echo "gate: FAILED — got $ucode, expected 401"; exit 1; }
