name: Probe Melon 5min chart (read-only)

# Dumps every /chart/melon/* link on 가이섬 with its Korean anchor text, then
# for each melon path reports whether the page yields real ranking rows
# (objects with both 'ranking' and 'song') vs. an analytics/graph view.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36';
          const BASE='https://xn--o39an51b2re.com';
          async function get(u){const r=await fetch(BASE+u,{headers:{'User-Agent':UA,'Accept-Language':'ko,en;q=0.9'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
          function nextData(html){const m=html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);if(!m)return null;try{return JSON.parse(m[1]);}catch{return null;}}
          function findRows(o){if(Array.isArray(o)){if(o.length&&o[0]&&typeof o[0]==='object'&&('ranking'in o[0])&&('song'in o[0]))return o;return null;}if(o&&typeof o==='object'){for(const v of Object.values(o)){const r=findRows(v);if(r)return r;}}return null;}
          (async()=>{
            // 1) collect melon menu links + KR text from a few seed pages
            const seeds=['/', '/chart/melon/realtime','/chart/melon/daily'];
            const pairs={};
            for(const s of seeds){
              let html; try{html=await get(s);}catch(e){console.log('ERR seed',s,e.message);continue;}
              const re=/<a[^>]+href="(\/chart\/melon\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/g; let m;
              while((m=re.exec(html))){const path=m[1];let text=m[2].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();if(!(path in pairs)||(!pairs[path]&&text))pairs[path]=text;}
            }
            console.log('=== MELON MENU ===');
            const paths=Object.keys(pairs).sort();
            for(const p of paths) console.log(p.padEnd(40), JSON.stringify(pairs[p]));
            // 2) for each melon path, test for ranking rows
            console.log('\n=== ROW TEST (does the page have ranking+song rows?) ===');
            for(const p of paths){
              let html; try{html=await get(p);}catch(e){console.log('NA  ',p,'->',e.message);continue;}
              const nd=nextData(html); const pp=nd?.props?.pageProps; const rows=pp?findRows(pp):null;
              console.log((rows?('ROWS='+String(rows.length).padStart(4)):'no-rows').padEnd(10),p, JSON.stringify(pairs[p]));
              await new Promise(r=>setTimeout(r,300));
            }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
