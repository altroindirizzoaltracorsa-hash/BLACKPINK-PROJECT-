name: Why are the scrobble refreshes failing (read-only)
# Eleven of twenty-one users failed in run 45052769716, all on
# "Last.fm HTTP 404" / "HTTP 403", while the response reported `dead: []`.
# Two candidate explanations, and they call for opposite fixes:
#
#   A. THE ACCOUNTS ARE GONE. Renamed or made private. Nothing to fix in the
#      code; they should simply stop being retried.
#
#   B. WE ARE SENDING THE WRONG HANDLE. api/cron-scrobbles.js:658 reads
#
#          const linkedAccounts = entry.linkedAccounts
#            || [{ type: 'lastfm', username: entry.username }];
#
#      so a fan with NO linked account has their DISPLAY NAME fetched as a
#      Last.fm handle. Two of the names in that run ("Humah kim", "Chaengie là
#      bồ của ltq") contain spaces, which a Last.fm username cannot, so at
#      least some of the 404s are this. Those fans are not dead accounts and
#      retiring them would be recording our own bug as their absence.
#
# This separates them. It prints, per failing handle, whether the handle came
# from a real linked account or from the display-name fallback, whether it is
# even a legal Last.fm username, and what the API actually answers.
#
# READ-ONLY: one GET of the public leaderboard, then one user.getInfo per
# DISTINCT handle. No writes, no lock, nothing is retired or marked.
#
# The Last.fm key is shared with the whole live site and error 29 is the key
# being spent, not a flake — so the calls are paced and capped.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max distinct handles to test live (default 400 — the board has ~353)'
        required: false
        default: '400'
      entry:
        description: 'Also dump this one board entry in full (e.g. remspot3). Identification only — no API calls.'
        required: false
        default: ''
      skip_live:
        description: 'Set 1 to skip every Last.fm call and only read the board (free, instant)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          BASE:  ${{ secrets.VERCEL_URL }}
          LIMIT: ${{ github.event.inputs.limit }}
          ENTRY: ${{ github.event.inputs.entry }}
          SKIP_LIVE: ${{ github.event.inputs.skip_live }}
        run: |
          set -euo pipefail
          # -L --location-trusted: VERCEL_URL 308-redirects to the apex, and
          # without following, curl "succeeds" on a redirect stub. No admin
          # header needed — the leaderboard is public.
          curl -sS -L --location-trusted -o board.json \
               -w "leaderboard: HTTP %{http_code}  %{size_download} bytes\n" \
               "${BASE}/api/leaderboard"
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          # THE DAY IS THE UTC DAY, as everywhere in this repo — index.html's
          # italyDateLabel() is UTC-anchored despite its name. Needed here only
          # to say whether an entry's daily_date is today's, which is what
          # decides whether the community goal counts it at all.
          _now = datetime.now(timezone.utc)
          today_label = f"{_now.day:02d}/{_now.month:02d}"

          LFM_KEY = "666b8ef2f3cc360fbc20df275fba2981"
          BASES   = {"lastfm":  "https://ws.audioscrobbler.com/2.0/",
                     "librefm": "https://libre.fm/2.0/"}
          LIMIT   = int(os.environ.get("LIMIT") or 250)

          # Last.fm usernames: ASCII letters/digits/underscore/hyphen, starting
          # with a letter. Anything else cannot be a handle, so a 404 on it is
          # OUR bug and not a departed fan. Deliberately generous (no length
          # bound) so the verdict is never stricter than the real rule.
          LEGAL = re.compile(r'^[A-Za-z][A-Za-z0-9_-]*$')

          def get(url, tries=2):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "blinks-united-probe"})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return r.status, json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      return e.code, None              # 404/403 is the ANSWER here
                  except Exception as e:
                      if i == tries - 1: return None, {"__error": str(e)}
                      time.sleep(0.8)
              return None, None

          def probe(kind, handle):
              p = {"method": "user.getInfo", "user": handle, "format": "json"}
              if kind == "lastfm": p["api_key"] = LFM_KEY
              time.sleep(0.35)                          # shared key — see header
              code, data = get(BASES[kind] + "?" + urllib.parse.urlencode(p))
              if data and isinstance(data, dict) and data.get("error"):
                  return f"error {data['error']}"
              if code == 200 and data: return "ok"
              return f"HTTP {code}" if code else "network"

          board = json.load(open("board.json"))
          users = board.get("users") or {}
          print(f"\nboard entries: {len(users)}")

          # ── Classify every entry by WHERE its handle comes from ────────────
          # This is the whole question, and it is answered without a single API
          # call: an entry with no linkedAccounts is fetched under its display
          # name because of line 658.
          # NOTE, measured 2026-11-22: the line-658 fallback fires for ZERO
          # entries, because `entry.linkedAccounts || [...]` sees an EMPTY
          # ARRAY as truthy. So a malformed handle like 'Humah kim' is a
          # STORED linked account, not one we synthesised — it was typed into
          # the signup field and never validated. The fallback is dead code;
          # it is still counted here so that stays visible if it changes.
          fallback, linked, rows = [], [], []
          other_only = []          # a scrobbler the cron CAN poll, just not Last.fm
          none_at_all = []         # nothing server-side: only client-posted scores
          POLLABLE = ("statsfm", "listenbrainz", "musicat", "librefm", "lastfm")
          for name, d in users.items():
              accts = d.get("linkedAccounts")
              scr = [a for a in (accts or []) if a.get("type") in ("lastfm", "librefm")
                     and a.get("username")]
              if accts is None:
                  fallback.append(name)
                  rows.append(("fallback", "lastfm", d.get("username") or name, name))
              elif scr:
                  linked.append(name)
                  for a in scr:
                      rows.append(("linked", a["type"], a["username"], name))
              else:
                  # No Last.fm/Libre.fm. NOT the same as unreachable: Stats.fm
                  # and ListenBrainz are polled server-side too. Separating
                  # these two is the difference between "the cron cannot see
                  # them" and "the cron sees them another way".
                  kinds = sorted({a.get("type") for a in (accts or []) if a.get("username")})
                  (other_only if any(k in POLLABLE for k in kinds) else none_at_all
                   ).append((name, ",".join(kinds) or "-"))

          print(f"\n── WHERE THE HANDLE COMES FROM ──")
          print(f"  entries with a real linked Last.fm/Libre.fm account: {len(linked)}")
          print(f"  entries fetched under their DISPLAY NAME (line 658):  {len(fallback)}")
          print(f"  entries with another pollable scrobbler instead:      {len(other_only)}")
          print(f"  entries with NO server-side scrobbler at all:         {len(none_at_all)}")
          print(f"\n  The last group is the one that matters for the daily goal: the")
          print(f"  cron cannot refresh them at all, so their row carries today's")
          print(f"  date ONLY if they open the site. That is structural, not a bug.")
          for name, kinds in none_at_all[:40]:
              print(f"    {name!r:<34} linked: {kinds}")
          if other_only[:40]:
              print(f"\n  Pollable by another route (so NOT invisible to the cron):")
              for name, kinds in other_only[:40]:
                  print(f"    {name!r:<34} linked: {kinds}")

          # ── One entry in full, for identification ──────────────────────────
          # Asked for by name because `remspot3` carries 38 linked handles
          # (remspot3 … remspot40), every one a 404 — 38 of the board's 83
          # failures from a single row, which reads as test data rather than a
          # fan. Deleting a board row is irreversible and is not a
          # diagnostic's job, so this only DESCRIBES it: when it was last
          # refreshed, whether a signed-in owner is attached, what it scores,
          # and every handle on it. Costs no API calls.
          want = (os.environ.get("ENTRY") or "").strip().lower()
          if want:
              hit = {k: v for k, v in users.items() if k.lower() == want
                     or (v.get("username") or "").lower() == want}
              print(f"\n── ENTRY {want!r} ──")
              if not hit:
                  print("  not on the board under that name")
              for k, d in hit.items():
                  sc = d.get("scores") or {}
                  accts = d.get("linkedAccounts")
                  print(f"  board key:      {k!r}")
                  print(f"  username:       {(d.get('username'))!r}")
                  print(f"  displayName:    {(d.get('displayName'))!r}")
                  print(f"  updatedAt:      {d.get('updatedAt')}")
                  print(f"  lastScrobbleAt: {d.get('lastScrobbleAt')}")
                  # Presence only, never the value: an owner id identifies a
                  # signed-in person and does not belong in a run log.
                  print(f"  appUserId:      {'present (a signed-in owner)' if d.get('appUserId') else 'none'}")
                  print(f"  daily_date:     {sc.get('daily_date')}   (today is {today_label})")
                  print(f"  overall_all:    {sc.get('overall_all')}")
                  print(f"  daily_all:      {sc.get('daily_all')}")
                  print(f"  weekly_all:     {sc.get('weekly_all')}")
                  print(f"  linkedAccounts: {0 if accts is None else len(accts)}"
                        f"{' (key absent — would hit the line-658 fallback)' if accts is None else ''}")
                  for a in (accts or []):
                      print(f"    {a.get('type'):<13} {a.get('username')!r}")
                  print(f"\n  A row whose every handle 404s cannot be refreshed and, since the")
                  print(f"  isolation fix, still fails rather than publishing a zero. It costs")
                  print(f"  about one Last.fm call per run. Harmless to leave; say so if it")
                  print(f"  should be cleaned up.")

          # ── Which handles cannot be handles at all ─────────────────────────
          illegal = [(src, k, h, who) for src, k, h, who in rows if not LEGAL.match(h or "")]
          print(f"\n── HANDLES THAT ARE NOT LEGAL LAST.FM USERNAMES ──")
          print(f"  {len(illegal)} of {len(rows)} — every one of these 404s by construction,")
          print(f"  and NONE of them is evidence that a fan left.")
          for src, k, h, who in illegal[:40]:
              why = "contains a space" if " " in h else "non-ASCII or bad start"
              print(f"  [{src:<8}] {k:<7} {h!r:<34} ({why})  entry={who!r}")

          # ── Now ask the APIs about the rest ────────────────────────────────
          seen, todo = set(), []
          for src, k, h, who in rows:
              key = (k, (h or "").lower())
              if key in seen: continue
              seen.add(key)
              todo.append((src, k, h, who))
          capped = [] if (os.environ.get("SKIP_LIVE") or "").strip() == "1" else todo[:LIMIT]
          if not capped:
              print(f"\n── LIVE user.getInfo SKIPPED (skip_live=1) ──")
              print(f"  {len(todo)} distinct handles not tested; the board-only findings")
              print(f"  above are complete and cost nothing.")
              raise SystemExit(0)
          print(f"\n── LIVE user.getInfo, {len(capped)} distinct handles"
                f"{' (capped)' if len(todo) > LIMIT else ''} ──")

          agg = {}
          bad = []
          for src, k, h, who in capped:
              verdict = probe(k, h)
              agg[(src, verdict)] = agg.get((src, verdict), 0) + 1
              if verdict != "ok":
                  bad.append((src, k, h, who, verdict, bool(LEGAL.match(h or ""))))

          print(f"\n── RESULT BY WHERE THE HANDLE CAME FROM ──")
          for (src, verdict), n in sorted(agg.items(), key=lambda kv: (kv[0][0], -kv[1])):
              print(f"  {src:<8} {verdict:<12} {n:>4}")

          print(f"\n── EVERY FAILING HANDLE ──")
          print(f"  legal=no  the string cannot be a username, so this is OUR bug.")
          print(f"  legal=yes the string COULD be a username. That is all it means.")
          print(f"            It does NOT establish the account was deleted: a first")
          print(f"            name typed into the Last.fm field ('Kat', 'Faith',")
          print(f"            'JOSEPHINE', 'Mahi') is well-formed and never existed.")
          print(f"            A string cannot tell 'deleted' from 'never typed right'.")
          for src, k, h, who, verdict, legal in bad:
              print(f"  {verdict:<12} [{src:<8}] {k:<7} legal={'yes' if legal else 'no ':<3} "
                    f"{h!r:<30} entry={who!r}")

          n_fb   = sum(1 for b in bad if b[0] == "fallback")
          n_ill  = sum(1 for b in bad if not b[5])
          print(f"\n── VERDICT ──")
          print(f"  failing handles: {len(bad)} of {len(capped)} tested")
          print(f"    from the display-name fallback (line 658, OUR bug): {n_fb}")
          print(f"    not even a legal username (OUR bug):                {n_ill}")
          print(f"    well-formed, so UNDECIDABLE from the string alone:  "
                f"{sum(1 for b in bad if b[0] == 'linked' and b[5])}")

          # ── WHAT THIS COSTS, which is the number that matters ──────────────
          # A failing handle is cheap on its own (user.getInfo throws on the
          # first call). The damage is that there is no try/catch inside the
          # per-account loop in refreshUser, so ONE dead account aborts the
          # whole fan and discards the plays from their working accounts. So
          # the figure to watch is ENTRIES affected, not handles.
          ent_bad = {}
          for src, k, h, who, verdict, legal in bad:
              ent_bad.setdefault(who, []).append(f"{k}/{h}")
          print(f"\n── ENTRIES THAT CANNOT BE REFRESHED AT ALL ──")
          print(f"  {len(ent_bad)} of {len(users)} board entries "
                f"({100*len(ent_bad)/max(1,len(users)):.0f}%) carry at least one")
          print(f"  failing handle. Because one throw aborts the fan, every one of")
          print(f"  these contributes ZERO to the daily goal every single day — and")
          print(f"  unlike a slow sweep, this does not clear by itself.")
          for who, hs in sorted(ent_bad.items(), key=lambda kv: -len(kv[1]))[:12]:
              extra = f"  (+{len(hs)-3} more)" if len(hs) > 3 else ""
              print(f"    {who!r:<34} {len(hs):>3} failing: {', '.join(hs[:3])}{extra}")
          PY
