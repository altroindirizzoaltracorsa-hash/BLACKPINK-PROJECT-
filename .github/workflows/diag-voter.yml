name: Diag voter rank

# Read-only: why a given voter isn't ranked on the VMA voting board.
on:
  workflow_dispatch:
    inputs:
      voter:
        description: 'BU display name or scrobbler handle to investigate'
        required: false
        default: 'LALALAMESAA'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dump voter/stream rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOTER: ${{ github.event.inputs.voter }}
        run: python .github/scripts/diag_voter.py
