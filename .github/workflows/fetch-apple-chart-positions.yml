name: Fetch Apple Music Chart Positions

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC daily — Apple Music charts typically refresh in the morning UTC
    - cron: '0 8 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Apple Music chart positions
        run: node .github/scripts/fetch_apple_chart_positions.mjs
      - name: Commit chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update Apple Music chart positions $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
