name: Probe Circle charts (read-only)

# Lists every /chart/circle/* link on 가이섬 with its Korean label, and tests
# which return real ranking rows. Answers "why only weekly?" Removed after.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Circle
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36';
          const BASE='https://xn--o39an51b2re.com';
          async function get(u){const r=await fetch(BASE+u,{headers:{'User-Agent':UA,'Accept-Language':'ko,en;q=0.9'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
          function nextData(h){const m=h.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);if(!m)return null;try{return JSON.parse(m[1]);}catch{return null;}}
          function findRows(o){if(Array.isArray(o)){if(o.length&&o[0]&&typeof o[0]==='object'&&('ranking'in o[0])&&('song'in o[0]))return o;return null;}if(o&&typeof o==='object'){for(const v of Object.values(o)){const r=findRows(v);if(r)return r;}}return null;}
          (async()=>{
            // collect circle links from a few seeds
            const seeds=['/', '/chart/circle/digital-weekly','/chart/melon/realtime'];
            const pairs={};
            for(const s of seeds){
              let html; try{html=await get(s);}catch(e){console.log('ERR',s,e.message);continue;}
              const re=/<a[^>]+href="(\/chart\/circle\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/g; let m;
              while((m=re.exec(html))){const p=m[1];let t=m[2].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();if(!(p in pairs)||(!pairs[p]&&t))pairs[p]=t;}
            }
            console.log('=== CIRCLE MENU ===');
            const paths=Object.keys(pairs).sort();
            if(!paths.length) console.log('(no circle links found on seed pages)');
            for(const p of paths) console.log(p.padEnd(38), JSON.stringify(pairs[p]));
            console.log('\n=== ROW TEST ===');
            for(const p of paths){
              let rows=null; try{rows=findRows(nextData(await get(p))?.props?.pageProps);}catch(e){console.log('NA  ',p,e.message);continue;}
              console.log((rows?('ROWS='+String(rows.length).padStart(4)):'no-rows').padEnd(10),p,JSON.stringify(pairs[p]));
              await new Promise(r=>setTimeout(r,300));
            }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
