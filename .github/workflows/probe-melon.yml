name: Probe Melon Global K-Chart

# One-off, read-only feasibility probe: can CI fetch Melon's Global K-Chart, and
# how is it structured? Prints diagnostics only. Safe to delete.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe Melon
        run: node .github/scripts/probe_melon.mjs
