name: TEST member-fetch dispatch (throwaway)
# One-off: verifies the Vercel canary→GitHub path end-to-end by calling the admin
# action /api/streams?action=dispatch-member-fetch, which uses GH_DISPATCH_TOKEN to
# workflow_dispatch fetch-catalog.yml. Prints the JSON status. Delete after use.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call the admin dispatch endpoint
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "Calling dispatch-member-fetch…"
          code=$(curl -sS -L -o /tmp/resp.json -w '%{http_code}' \
            "https://www.blinksunited.com/api/streams?action=dispatch-member-fetch&key=${ADMIN_KEY}")
          echo "HTTP $code"
          echo "Response body:"; cat /tmp/resp.json; echo
