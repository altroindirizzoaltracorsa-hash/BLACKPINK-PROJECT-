name: Probe kchart menu (read-only)

# Dumps every /chart/<service>/<type> link on 가이섬 together with its Korean
# anchor text, so we can build the full chart list + KR labels precisely.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump chart menu
        run: |
          python3 - <<'PY'
          import re, urllib.request
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko,en;q=0.9'}
          base='https://xn--o39an51b2re.com'
          seeds=['/', '/chart/melon/realtime','/chart/genie/realtime','/chart/bugs/realtime',
                 '/chart/flo/24hour','/chart/vibe/daily','/chart/circle/digital-weekly','/chart/youtube/track-weekly']
          def get(u):
              req=urllib.request.Request(base+u, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r: return r.read().decode('utf-8','replace')
          pairs={}
          for s in seeds:
              try: html=get(s)
              except Exception as e: print('ERR',s,e); continue
              for m in re.finditer(r'<a[^>]+href="(/chart/[^"]+)"[^>]*>(.*?)</a>', html, re.S):
                  path=m.group(1)
                  text=re.sub(r'<[^>]+>','',m.group(2))
                  text=re.sub(r'\s+',' ',text).strip()
                  if path not in pairs or (not pairs[path] and text): pairs[path]=text
          # group by service
          from collections import defaultdict
          byv=defaultdict(list)
          for p,t in pairs.items():
              parts=p.split('/')  # ['','chart','melon','realtime']
              if len(parts)>=4: byv[parts[2]].append((parts[3], t))
          for svc in sorted(byv):
              print(f'\n### {svc} ({len(byv[svc])})')
              for typ,txt in sorted(byv[svc]):
                  print(f'  /chart/{svc}/{typ:22}  {txt!r}')
          PY
