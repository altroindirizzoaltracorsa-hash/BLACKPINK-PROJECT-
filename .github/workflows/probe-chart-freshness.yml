name: Probe chart freshness

# Which countries are behind on /spotify-charts, and by how much.
#
# The page reads the newest tracking_date per country, so a country whose rows
# stopped arriving shows a stale chart that looks perfectly healthy — there is
# no error anywhere, just an old date. "Thailand is stuck on Oct 12" is the
# symptom; this asks whether that is one country or fifty, and whether they all
# stopped on the same day (one broken sweep) or drifted apart (rate-limit
# skips landing on different countries each run).
#
# Read-only: SELECTs only.
#
# Results come back as ::notice annotations, GROUPED BY DATE rather than one
# line per country: GitHub keeps only ~10 notices per run, and 74 countries
# would blow past that and silently truncate the answer.
on:
  workflow_dispatch:
    inputs:
      chart_type:
        description: 'daily | weekly'
        required: false
        default: 'daily'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CT: ${{ github.event.inputs.chart_type }}
        run: |
          set -u
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::SUPABASE_DB_URL is not set."; exit 1; fi
          CT="${CT:-daily}"
          set +e
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -v ct="$CT" >/tmp/out.txt 2>&1 <<'SQL'
          \pset footer off
          select 'chart_type=' || :'ct' || '  today=' || current_date
                 || '  newest anywhere=' || (select max(tracking_date) from chart_positions where chart_type = :'ct');
          -- How many countries sit on each of the last few dates. NEWEST FIRST,
          -- because the question is "who is current", and a truncated answer
          -- must lose the stragglers rather than the headline.
          select '  ' || d::text || ' (' || (current_date - d) || 'd): '
                 || count(*) || ' countries  ' || left(string_agg(c, ' ' order by c), 300)
            from (select country as c, max(tracking_date) as d
                    from chart_positions where chart_type = :'ct' group by country) t
           group by d order by d desc limit 8;
          -- Rows per sweep day: a half-run sweep is a short day here, which a
          -- per-country date cannot distinguish from "nothing charted".
          select '  rows ' || tracking_date::text || ': ' || count(*) || ' in '
                 || count(distinct country) || ' countries'
            from chart_positions where chart_type = :'ct' and tracking_date > current_date - 8
           group by tracking_date order by tracking_date desc;
          -- Thailand specifically: its last dates, and what charted on each.
          select '  TH ' || tracking_date::text || ': ' || count(*) || ' row(s)  '
                 || left(string_agg(distinct coalesce(track_name, primary_artist_name, '?'), ', '), 120)
            from chart_positions
           where chart_type = :'ct' and country = 'TH'
           group by tracking_date order by tracking_date desc limit 6;
          SQL
          rc=$?
          set -e
          # ONE annotation: GitHub keeps ~10 notices per run, and a literal
          # newline ends a workflow command, so lines are joined with %0A.
          blob=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            esc=${line//\%/%25}
            if [ -z "$blob" ]; then blob="$esc"; else blob="$blob%0A$esc"; fi
          done < /tmp/out.txt
          echo "::notice title=charts::${blob:0:3500}"
          if [ "$rc" -ne 0 ]; then echo "::error::psql exited $rc"; exit "$rc"; fi
