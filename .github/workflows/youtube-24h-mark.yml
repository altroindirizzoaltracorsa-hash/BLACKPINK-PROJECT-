name: YouTube 24h Mark Capture

# Takes a tight burst of samples across a video's 24h mark, so the pinned number
# comes from seconds after the mark instead of whenever the hourly job happened
# to run.
#
# Why this exists: the dense 15s series (bu_yt_live_*) is written by
# /api/youtube-stats, which only runs in a visitor's browser. A mark that falls
# at 06:00 Rome has nobody on the page, so the only candidates are the hourly
# snapshots and the pin lands 5-25 min late. This job samples with ?force=1
# (bypassing MIN_GAP_MS) from just before the mark until just after it.
#
# MARK_UTC is a comma-separated list of marks. Each run picks the soonest one
# inside its window and ignores the rest, so several marks can be pending at once
# — the two MVs premiere 4h apart, so their marks are 4h apart too. A mark that
# has passed is simply never selected again; a stale list is harmless.
#   captured 2026-09-03T00:00Z  SaWaDiKa teaser     (pinned by hand)
#   captured 2026-09-03T04:00Z  JISOO CLICK teaser  (pinned +14s)
#   captured 2026-09-04T04:00Z  s466YCiHfKw 7-day   (read back from the series, -8s)
#   passed   2026-09-05T00:00Z  SaWaDiKa MV
#   passed   2026-09-05T04:00Z  JISOO CLICK MV
#   pending  2026-10-24T04:00Z  -5ZXrO_lYSA Tarantino MV 24h
#   pending  2026-10-30T04:00Z  -5ZXrO_lYSA Tarantino MV 7-day
#   LOST     2026-10-30T23:00:09Z  Pksr9T8m_aA ADDICTED MV 24h  (see below)
#   pending  2026-11-05T23:00:09Z  Pksr9T8m_aA ADDICTED MV 7-day
#
# That last one is NOT on the hour, and deliberately. /api/youtube-stats
# reports the MV's publishedAt as 2026-10-29T23:00:09Z — nine seconds after
# the single's own release instant — so twenty-four hours after it is
# 23:00:09Z, and pinning the round hour would stop nine seconds short of a
# day. Read from the API rather than assumed from the release time, because
# the two are not the same number.
# The 22:35 and 22:55 slots already reach it: a mark is in window from 5h
# before, so they need no new cron.
#
# HOW THE ADDICTED 24H FIGURE WAS LOST, because the cron is the lesser half of
# it. The id was put on vs.html and into MARK_UTC above and into NEITHER list
# in api/youtube-history.js — no RELEASE entry, so no mark existed to freeze,
# and not in DEFAULT_IDS, so ?snapshot=1 recorded nothing for it and the only
# writes came from a visitor having vs.html open. Overnight that is nobody:
# the stored series has a 15h50m hole with the mark inside it, 9h32m after the
# last reading (5,382,933) and 6h18m before the next (9,394,949), 4,012,016
# views apart. Nothing within the 95-minute tolerance, so the figure is gone
# rather than late, and interpolating across that gap would be inventing it.
#
# And the crons did not fire near it either: GitHub shed every 22:xx-23:xx slot
# on Oct 30 and ran them at 01:44-02:47 on Oct 31, about three hours past the
# mark. Even on time they would have recorded nothing, because ?snapshot=1
# takes DEFAULT_IDS and the id was not in it. BOTH had to be fixed.
#
# So for anything that matters: put the id in all three lists FIRST (the test
# now fails if it is not), and DISPATCH THIS WORKFLOW BY HAND a few hours
# ahead. A dispatched run is already allocated and sleeps to the instant; a
# scheduled one is a lottery on this repo.
#
# KEEP THIS LIST CURRENT. A mark that is not here is not captured precisely —
# the job finds nothing in window, exits 0 green, and the pin silently falls
# back to whenever the hourly snapshot last ran. That fallback is weaker than
# it sounds: the hourly job is scheduled every 20 min but GitHub sheds it, and
# on 2026-10-23 it actually ran at 00:11, 05:06, 10:17, 15:15 and 19:22 — five
# hour gaps, any one of which can straddle a mark.
on:
  schedule:
    # Six chances spread over the two hours before the mark; GitHub sheds
    # scheduled runs, and each run waits for the mark itself, so any one
    # surviving is enough. One set per pending mark's hour: 22:xx-23:xx covers a
    # 00:00 mark, 02:xx-03:xx a 04:00 one.
    - cron: '35 22 * * *'
    - cron: '55 22 * * *'
    - cron: '15 23 * * *'
    - cron: '35 23 * * *'
    - cron: '45 23 * * *'
    - cron: '55 23 * * *'
    - cron: '35 2 * * *'
    - cron: '55 2 * * *'
    - cron: '15 3 * * *'
    - cron: '35 3 * * *'
    - cron: '45 3 * * *'
    - cron: '55 3 * * *'
  workflow_dispatch:
    inputs:
      mark_utc:
        description: 'Mark instant(s), comma-separated RFC3339 UTC (blank = the built-in list).'
        required: false
        default: ''

jobs:
  capture:
    runs-on: ubuntu-latest
    # Long enough to be dispatched hours ahead and sleep until the mark. A run
    # dispatched by hand is already allocated, so it cannot be dropped the way a
    # scheduled run can — this is the reliable path; the crons above are backup.
    timeout-minutes: 350
    steps:
      - name: Sample across the mark
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: https://www.blinksunited.com
          MARK_UTC: ${{ inputs.mark_utc != '' && inputs.mark_utc || '2026-10-24T04:00:00Z,2026-10-30T04:00:00Z,2026-10-30T23:00:09Z,2026-11-05T23:00:09Z' }}
        run: |
          set -u
          now=$(date -u +%s)
          echo "now   $(date -u -d @$now +%FT%TZ)"

          # Pick the soonest mark this run can actually serve. A mark is in window
          # from 5h before it (any earlier and a scheduled run on some other night
          # would sleep for a day and die on the job timeout) until 15 min after it
          # (past that the pin is either set or will use a stored point anyway).
          # 5h rather than 3h so a hand-dispatched run — the only kind GitHub
          # cannot shed — can be started early in the evening rather than in a
          # narrow slot, while staying under the 6h ceiling on a job.
          mark=""
          for m in ${MARK_UTC//,/ }; do
            t=$(date -u -d "$m" +%s) || { echo "skipping unparseable mark: $m"; continue; }
            if [ $(( now - t )) -le 900 ] && [ $(( t - now )) -le 18000 ]; then
              if [ -z "$mark" ] || [ "$t" -lt "$mark" ]; then mark=$t; fi
            fi
          done
          if [ -z "$mark" ]; then
            echo "No mark within the window (MARK_UTC=$MARK_UTC). Exiting."
            exit 0
          fi
          echo "mark  $(date -u -d @$mark +%FT%TZ)"

          # Wait until 45s before the mark (a late-started run skips straight through).
          target=$(( mark - 45 ))
          if [ "$now" -lt "$target" ]; then
            echo "Sleeping $(( target - now ))s until 30s before the mark…"
            sleep $(( target - now ))
          fi

          # Force a sample every 15s until 3 min past the mark, stopping as soon as
          # the endpoint reports it pinned something.
          deadline=$(( mark + 180 ))
          while [ "$(date -u +%s)" -le "$deadline" ]; do
            code=$(curl -sS -L --max-time 30 -o /tmp/out.json -w '%{http_code}' \
              -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/youtube-history?snapshot=1&force=1") || code=000
            echo "$(date -u +%T) HTTP $code $(cat /tmp/out.json 2>/dev/null)"
            if grep -q '"pinned":\[".' /tmp/out.json 2>/dev/null; then
              echo "Pinned — done."
              exit 0
            fi
            sleep 15
          done
          echo "Window closed. The pin will be captured by the next snapshot or page visit."
