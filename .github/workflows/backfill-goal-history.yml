name: Backfill community goal history

# Records past community-goal days that were hit but never stored (the old path
# only wrote a day if a visitor loaded the home page while the goal showed hit).
# Walks finalized daily leaderboard_archive snapshots. Run with dry=1 first to
# preview, then dry=0 to apply. Idempotent.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: '1 = preview only, 0 = apply'
        required: true
        default: '1'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Call backfill endpoint
        env:
          BASE: ${{ secrets.VERCEL_URL }}
          KEY:  ${{ secrets.ADMIN_KEY }}
          DRY:  ${{ github.event.inputs.dry }}
        run: |
          set -e
          B="${BASE%/}"
          code=$(curl -sS -X POST -o resp.json -w "%{http_code}" \
            "$B/api/leaderboard?action=backfill-goal-history&key=$KEY&dry=$DRY")
          echo "HTTP $code"
          echo "--- summary ---"
          jq -r '"dry=\(.dry)  archivesScanned=\(.archivesScanned)  recorded=\(.recordedCount)  skipped=\(.skippedCount)  streak=\(.streak)"' resp.json || cat resp.json
          echo "--- recorded days ---"
          jq -r '.recorded[]? | "  \(.day)  total=\(.total)  stretch=\(.stretch)  was=\(.was)"' resp.json || true
          echo "--- skipped (top 15) ---"
          jq -r '.skipped[]? | "  \(.day)  total=\(.total)  alreadyHas=\(.alreadyHas)"' resp.json | head -15 || true
          if [ "$code" -ge 400 ]; then exit 1; fi
