name: BLACKPINK Spotify Catalog

on:
  # Fourteen slots at ≤80-minute gaps covering 13:23 → 05:19 UTC, which is the
  # site's own watch window (3PM Rome → 7AM) rather than a guess. Spotify's daily
  # publish lands "way after 3PM Rome" and wanders from there — observed anywhere
  # from ~19:00 to ~01:30 UTC — so a fixed nightly slot kept catching a day hours
  # after it landed, or missing one entirely and merging two days into one entry.
  # The 05:19 → 13:23 gap is the documented quiet stretch (7AM–3PM Rome).
  #
  # Do NOT read a slot that finds nothing as evidence of a late publish: at 06:00
  # Rome the day genuinely isn't due yet. That inference has been wrong every time.
  #
  # Two things make fourteen slots cheap rather than reckless:
  #
  # 1. Only three of them run the `fetch` job, which is where every RapidAPI
  #    scraper request in this workflow comes from (see the `if:` on it — it
  #    matches these three cron strings verbatim). The other eleven run only
  #    fetch-artist-streams / fetch-group-streams, which use spotifyscraper and
  #    Supabase and cost no quota at all. That is the whole point: this workflow
  #    is what records the per-member/per-track artist streams, and THAT part is
  #    free to run as often as we like.
  # 2. Both python jobs hold when the total is unchanged, so a slot that fires
  #    before Spotify publishes writes nothing. Verified in run 36520505572:
  #    all five artists "100.0% unchanged … NOT UPDATED YET, skipping".
  #
  # The minutes are deliberately NOT :00. Scheduled workflows are queued
  # behind the top-of-the-hour crush, and on this repo that delay measured
  # 2h10m–5h on every single run (the '0 22' slot was firing at 00:06–01:24, the
  # '0 5' slot at 07:24–09:58) — which is most of why the small-hours floor runs
  # were landing mid-morning and not covering the publish window they were added
  # for. Keep every minute field off :00 and :30.
  schedule:
    - cron: '23 13 * * *'
    - cron: '41 14 * * *'
    - cron: '57 15 * * *'
    - cron: '9 17 * * *'
    - cron: '11 18 * * *'
    - cron: '27 19 * * *'
    - cron: '43 20 * * *'
    - cron: '53 21 * * *'   # full run (campaign tracks) — was '0 22 * * *'
    - cron: '9 23 * * *'
    - cron: '21 0 * * *'
    - cron: '37 1 * * *'
    - cron: '49 2 * * *'    # full run (campaign tracks) — was '0 2 * * *'
    - cron: '7 4 * * *'
    - cron: '19 5 * * *'    # full run (campaign tracks) — was '0 5 * * *'
  workflow_dispatch:   # also allows manual trigger from the GitHub Actions tab
    inputs:
      base_url:
        description: 'Base URL to test against (leave blank for production). Use a Vercel preview URL to validate api/streams.js changes before they reach main.'
        required: false
        default: ''
      run_artist_fetch:
        description: 'Run fetch-artist-streams. Set to false when manually triggering for an unrelated job (e.g. a one-off backfill) outside Spotify''s usual update window (midday-evening Rome time), to avoid writing a premature/duplicate day.'
        required: false
        default: 'true'
      group_dry_run:
        description: 'Girl groups: report what would be recorded without writing (1)'
        required: false
        default: '0'
      group_override_date:
        description: 'Girl groups: force a streaming-day label (backfills only)'
        required: false
        default: ''
      run_backfill:
        description: 'Re-fetch album metadata for every tracked track and PATCH artist_tracks (album, release date, track number, art). Off by default — it rewrites all ~214 rows, not just empty ones. Set to true after adding a column that needs filling.'
        required: false
        default: 'false'

# Fourteen slots a day, each ~12 minutes, and GitHub's scheduler can bunch them
# it runs late. Two catalog fetches at once would both read the same "last
# recorded day" and could write the same day twice, so serialize the whole
# workflow. cancel-in-progress is false because a run that is already writing
# must be allowed to finish; a superseded PENDING run is only ever a no-op slot.
concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  # The ONLY job here that can spend RapidAPI scraper keys, so it is pinned to the
  # three original nightly slots and skipped on the other eleven.
  #
  #   - fetch-tracks.mjs calls /api/streams?force=1, which bypasses the canary gate
  #     and fetches all four campaign tracks: 4 requests, every time.
  #   - fetch-catalog.mjs is Worker-first and would cost nothing IF the Cloudflare
  #     Worker were configured — but SPOTIFY_WORKER_URL / SPOTIFY_WORKER_KEY are NOT
  #     set in Vercel today, so it falls through and attempts one RapidAPI request
  #     per provider (2) before landing on the kworb scrape. Verified in run
  #     36520222919: "worker: ... not set; rapidapi: spotify-scraper: HTTP 429;
  #     spotify-scraper-api: HTTP 403; ... source: kworb".
  #
  # So do NOT move this job onto the cheap slots on the theory that the catalog
  # total is free. It becomes free — and starts SAVING quota, by side-caching the
  # four tracks into bp_worker_* which fetchTrackMetadata reads before RapidAPI —
  # only once the Worker env vars exist. Re-check that log line before changing it.
  #
  # The cron strings below must stay byte-identical to the three marked "full run"
  # in the schedule above: github.event.schedule returns the literal text from this
  # file, so renumbering one there silently turns that slot into a full one.
  fetch:
    if: >-
      github.event_name != 'schedule' ||
      contains(fromJSON('["53 21 * * *","49 2 * * *","19 5 * * *"]'), github.event.schedule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force-refresh campaign tracks (JUMP / Shut Down / DDU-DU DDU-DU) on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          VERCEL_URL: ${{ inputs.base_url != '' && inputs.base_url || 'https://blinksunited.com' }}
        run: node .github/scripts/fetch-tracks.mjs

      - name: Force-refresh BLACKPINK catalog total on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          VERCEL_URL: ${{ inputs.base_url != '' && inputs.base_url || 'https://blinksunited.com' }}
        run: node .github/scripts/fetch-catalog.mjs

  # Experimental, manual-only: test whether spotifyscraper's embed-page-bootstrapped
  # anon token survives GitHub Actions' network, unlike open.spotify.com/get_access_token
  # which is blocked here. Prints diagnostics only, does not touch production data.
  test-spotifyscraper:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Run test fetch
        run: python .github/scripts/test-spotifyscraper.py

  # Runs on EVERY scheduled slot (all fourteen) and on manual dispatch unless
  # run_artist_fetch=false. Previously manual-only, which silently froze
  # per-member/per-artist streams (and the 2026 streams-gained board) between
  # hand-triggered /update-streams runs.
  #
  # This is the job the fourteen slots exist for: it uses spotifyscraper + Supabase,
  # costs no RapidAPI quota, and holds (prints "NOT UPDATED YET") when the total
  # is unchanged — so firing it every ~80 minutes across the publish window is
  # free and lands each day close to when Spotify actually publishes it.
  #
  # Sweeping more often does mean meeting Spotify mid-publish more often. That is
  # what publish_unfinished() + the provisional/open-row path are for, and
  # checks/sweep_split_publishes.sql (run weekly by check-split-publishes.yml
  # over every tracked artist) is the backstop if they ever fail.
  fetch-artist-streams:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_artist_fetch != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      # actionlint typechecks the gate on the `fetch` job but cannot verify
      # `github.event.schedule` against the untyped event payload, so print it here,
      # in the job that runs on every slot. An empty value on a scheduled run means
      # that gate is failing CLOSED — the three forced campaign-track sweeps stop and
      # only Vercel's 21:00 ?cron=1 floor is left, which is survivable but wrong.
      - name: Which slot is this
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "fetch job (campaign tracks + catalog total) ran: ${{ github.event_name != 'schedule' || contains(fromJSON('["53 21 * * *","49 2 * * *","19 5 * * *"]'), github.event.schedule) }}"

      - name: Fetch and store artist streams
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/fetch_artist_streams.py

  # The seven K-pop girl groups, fetched straight from Spotify off the seeded
  # track lists in data/group_catalogs/. Runs AFTER fetch-artist-streams (needs:)
  # so the two never fetch at once, and so a day is only ever recorded when the
  # BLACKPINK job judged Spotify had published one.
  #
  # Summing those exact track IDs was verified to reproduce kworb's published
  # total to the digit for BLACKPINK and ILLIT, and to within 0.005% elsewhere —
  # so this is the same measurement kworb reports, on our own schedule rather
  # than its. Writes data/group_streams/{history.json,history.csv}.
  fetch-group-streams:
    needs: fetch-artist-streams
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_artist_fetch != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Fetch the seven group totals
        env:
          OVERRIDE_DATE: ${{ inputs.group_override_date }}
          DRY_RUN: ${{ inputs.group_dry_run }}
          # For the per-track detail (group_tracks + group_track_daily_stats).
          # The committed files are written before Supabase is touched, so an
          # unset secret or an outage costs the detail and nothing else.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/fetch_group_streams.py

      - name: Commit the day
        if: inputs.group_dry_run != '1'
        run: |
          if [ -z "$(git status --porcelain data/group_streams)" ]; then
            echo "nothing new recorded"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/group_streams
          git commit -m "data: girl group streams $(date -u +%Y-%m-%d)"
          # Another data job may have pushed while this one ran; rebase rather
          # than fail, since these files are only ever appended to.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"; exit 1

  # Opt-in only: pass run_backfill=true. artist_tracks didn't originally store
  # album metadata; fetch_artist_streams.py captures it now, and this fills it in
  # for rows inserted before that. It re-fetches each track via spotifyscraper and
  # PATCHes artist_tracks only -- never the daily-stats tables -- so unlike
  # fetch-artist-streams it's safe to run outside Spotify's update window.
  #
  # It used to run on EVERY workflow_dispatch, which meant every canary bump
  # (dispatchCatalogFetch sends a workflow_dispatch) re-ran the whole thing: the
  # script selects `album` but never filters on it, so it rewrites all ~214 rows
  # whether or not they need it. Run 36520505572 logged "patched 113/113", "13/13",
  # "43/43" against columns that were already populated. No RapidAPI quota, but ~2
  # minutes of pointless Spotify fetching and 214 redundant Supabase writes each
  # time. Hence the gate rather than deletion — it earns its keep the next time a
  # column needs filling, and stays quiet until then.
  #
  # The input is a string defaulting to 'false' to match its neighbours here, and
  # the comparison fails safe: any typo leaves the backfill OFF.
  backfill-track-albums:
    if: github.event_name == 'workflow_dispatch' && inputs.run_backfill == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Backfill track album metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/backfill_track_albums.py
