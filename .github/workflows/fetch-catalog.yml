name: BLACKPINK Spotify Catalog

on:
  # Ten slots covering 18:11 → 05:19 UTC at ≤80-minute gaps, because Spotify's
  # publish time wanders across that whole window (observed anywhere from ~19:00
  # to ~01:30 UTC) and a fixed nightly slot kept catching a day hours late — or
  # missing one entirely and merging two days into one entry.
  #
  # Two things make ten slots cheap rather than reckless:
  #
  # 1. Only three of them run the `fetch` job's campaign-track step, which is the
  #    one that spends RapidAPI scraper keys (see the `if:` on that step — it
  #    matches these three cron strings verbatim). The other seven run the
  #    catalog total (Cloudflare Worker first, no RapidAPI in the normal case,
  #    and it warms the bp_worker_* Redis cache that fetchTrackMetadata reads
  #    BEFORE RapidAPI — so it lowers scraper spend rather than raising it) plus
  #    fetch-artist-streams / fetch-group-streams, which use spotifyscraper and
  #    Supabase and cost no quota at all.
  # 2. Both python jobs hold when the total is unchanged, so a slot that fires
  #    before Spotify publishes writes nothing.
  #
  # The minutes are deliberately NOT :00. Scheduled workflows are queued
  # behind the top-of-the-hour crush, and on this repo that delay measured
  # 2h10m–5h on every single run (the '0 22' slot was firing at 00:06–01:24, the
  # '0 5' slot at 07:24–09:58) — which is most of why the small-hours floor runs
  # were landing mid-morning and not covering the publish window they were added
  # for. Keep every minute field off :00 and :30.
  schedule:
    - cron: '11 18 * * *'
    - cron: '27 19 * * *'
    - cron: '43 20 * * *'
    - cron: '53 21 * * *'   # full run (campaign tracks) — was '0 22 * * *'
    - cron: '9 23 * * *'
    - cron: '21 0 * * *'
    - cron: '37 1 * * *'
    - cron: '49 2 * * *'    # full run (campaign tracks) — was '0 2 * * *'
    - cron: '7 4 * * *'
    - cron: '19 5 * * *'    # full run (campaign tracks) — was '0 5 * * *'
  workflow_dispatch:   # also allows manual trigger from the GitHub Actions tab
    inputs:
      base_url:
        description: 'Base URL to test against (leave blank for production). Use a Vercel preview URL to validate api/streams.js changes before they reach main.'
        required: false
        default: ''
      run_artist_fetch:
        description: 'Run fetch-artist-streams. Set to false when manually triggering for an unrelated job (e.g. a one-off backfill) outside Spotify''s usual update window (midday-evening Rome time), to avoid writing a premature/duplicate day.'
        required: false
        default: 'true'
      group_dry_run:
        description: 'Girl groups: report what would be recorded without writing (1)'
        required: false
        default: '0'
      group_override_date:
        description: 'Girl groups: force a streaming-day label (backfills only)'
        required: false
        default: ''

# Ten slots a day, each ~12 minutes, and GitHub's scheduler can bunch them when
# it runs late. Two catalog fetches at once would both read the same "last
# recorded day" and could write the same day twice, so serialize the whole
# workflow. cancel-in-progress is false because a run that is already writing
# must be allowed to finish; a superseded PENDING run is only ever a no-op slot.
concurrency:
  group: catalog-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # actionlint typechecks the gate below but cannot verify `github.event.schedule`
      # itself (the event payload is untyped), so print it. If this ever shows an
      # empty value on a scheduled run, the gate is failing CLOSED — the three
      # forced sweeps stop and only Vercel's 21:00 ?cron=1 floor remains, which is
      # survivable but wrong, and this line is how you'd notice.
      - name: Which slot is this
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "campaign-track step will run: ${{ github.event_name != 'schedule' || contains(fromJSON('["53 21 * * *","49 2 * * *","19 5 * * *"]'), github.event.schedule) }}"

      # The ONLY step in this workflow that spends RapidAPI scraper keys: it calls
      # /api/streams?force=1, which bypasses the canary gate and fetches all four
      # campaign tracks. So it is pinned to the three original nightly slots rather
      # than running on all ten. The other seven slots still refresh the catalog
      # total below, which warms bp_worker_* and keeps the campaign cards moving
      # for free; ?cron=1 from Vercel at 21:00 UTC remains the separate daily floor.
      #
      # The cron strings below must stay byte-identical to the three marked
      # "full run" in the schedule above — github.event.schedule returns the
      # literal text from this file, so a reformat there silently turns every
      # slot into a full one.
      - name: Force-refresh campaign tracks (JUMP / Shut Down / DDU-DU DDU-DU) on Vercel
        if: >-
          github.event_name != 'schedule' ||
          contains(fromJSON('["53 21 * * *","49 2 * * *","19 5 * * *"]'), github.event.schedule)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          VERCEL_URL: ${{ inputs.base_url != '' && inputs.base_url || 'https://blinksunited.com' }}
        run: node .github/scripts/fetch-tracks.mjs

      # Runs on all ten slots. Worker-first, so normally no RapidAPI call at all,
      # and a Worker hit side-caches the four campaign tracks in Redis for 4h —
      # which is what lets the seven cheap slots keep the cards fresh.
      - name: Force-refresh BLACKPINK catalog total on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          VERCEL_URL: ${{ inputs.base_url != '' && inputs.base_url || 'https://blinksunited.com' }}
        run: node .github/scripts/fetch-catalog.mjs

  # Experimental, manual-only: test whether spotifyscraper's embed-page-bootstrapped
  # anon token survives GitHub Actions' network, unlike open.spotify.com/get_access_token
  # which is blocked here. Prints diagnostics only, does not touch production data.
  test-spotifyscraper:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Run test fetch
        run: python .github/scripts/test-spotifyscraper.py

  # Runs on EVERY scheduled slot (all ten) and on manual dispatch unless
  # run_artist_fetch=false. Previously manual-only, which silently froze
  # per-member/per-artist streams (and the 2026 streams-gained board) between
  # hand-triggered /update-streams runs.
  #
  # This is the job the ten slots exist for: it uses spotifyscraper + Supabase,
  # costs no RapidAPI quota, and holds (prints "NOT UPDATED YET") when the total
  # is unchanged — so firing it every ~80 minutes across the publish window is
  # free and lands each day close to when Spotify actually publishes it.
  #
  # Sweeping more often does mean meeting Spotify mid-publish more often. That is
  # what publish_unfinished() + the provisional/open-row path are for, and
  # checks/sweep_split_publishes.sql (run weekly by check-split-publishes.yml
  # over every tracked artist) is the backstop if they ever fail.
  fetch-artist-streams:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_artist_fetch != 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Fetch and store artist streams
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/fetch_artist_streams.py

  # The seven K-pop girl groups, fetched straight from Spotify off the seeded
  # track lists in data/group_catalogs/. Runs AFTER fetch-artist-streams (needs:)
  # so the two never fetch at once, and so a day is only ever recorded when the
  # BLACKPINK job judged Spotify had published one.
  #
  # Summing those exact track IDs was verified to reproduce kworb's published
  # total to the digit for BLACKPINK and ILLIT, and to within 0.005% elsewhere —
  # so this is the same measurement kworb reports, on our own schedule rather
  # than its. Writes data/group_streams/{history.json,history.csv}.
  fetch-group-streams:
    needs: fetch-artist-streams
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_artist_fetch != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Fetch the seven group totals
        env:
          OVERRIDE_DATE: ${{ inputs.group_override_date }}
          DRY_RUN: ${{ inputs.group_dry_run }}
        run: python .github/scripts/fetch_group_streams.py

      - name: Commit the day
        if: inputs.group_dry_run != '1'
        run: |
          if [ -z "$(git status --porcelain data/group_streams)" ]; then
            echo "nothing new recorded"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/group_streams
          git commit -m "data: girl group streams $(date -u +%Y-%m-%d)"
          # Another data job may have pushed while this one ran; rebase rather
          # than fail, since these files are only ever appended to.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts"; exit 1

  # One-time, manual-only: artist_tracks didn't originally store album
  # metadata. Backfills album/album_release_date/track_number for every
  # existing track by re-fetching each one via spotifyscraper and PATCHing
  # artist_tracks only -- doesn't touch daily-stats tables, so unlike
  # fetch-artist-streams it's safe to run outside Spotify's update window.
  # Safe to remove once it's been run.
  backfill-track-albums:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install spotifyscraper
        run: pip install spotifyscraper

      - name: Backfill track album metadata
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/backfill_track_albums.py
