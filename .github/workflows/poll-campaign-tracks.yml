name: Poll campaign tracks (overnight)

# Pings /api/streams overnight so Spotify's daily play-count refresh gets caught
# even when it lands in the small hours (when site traffic is too low to trigger
# the visitor-driven poll on its own). This is a PLAIN GET — no force, no cron
# flag — so it goes through the normal canary gate: while waiting for the bump it
# only spends keys on the canary track (JUMP), and the moment the canary shows new
# streams the handler fans out to the other 3. A cache-busting query param
# guarantees the request reaches the function instead of the CDN edge cache.
#
# Schedule: every 20 min from 00:00–04:59 UTC. Spotify's streaming day resets at
# 00:00 UTC (= 2am Rome in summer) and the late refresh lands AFTER that reset, so
# this covers 2am–7am Rome — squarely after the reset and inside the API's active
# watch window (which goes quiet at 7am Rome). GitHub cron timing is best-effort;
# ±10 min drift is fine since the canary only needs to catch the bump once, then
# everything backs off to the 4h TTL. Adjust the interval/hours to taste.

on:
  schedule:
    - cron: '*/20 0-4 * * *'
  workflow_dispatch:

concurrency:
  group: poll-campaign-tracks
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Canary-gated poll of /api/streams
        run: |
          URL="https://blinksunited.com/api/streams?_poll=$(date +%s)"
          echo "GET $URL"
          curl -sf --max-time 60 "$URL" | tee /tmp/resp.json >/dev/null || { echo "poll request failed (transient) — will retry next tick"; exit 0; }
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/resp.json'))
          dbg = d.get('_debug', {})
          print('live (fetched this request?):', dbg.get('live'))
          for name in ('jump', 'shutdown', 'ddududu', 'go'):
              b = d.get(name) or {}
              prev = b.get('prev') or {}
              print(f"  {name:10} total={b.get('total')!s:>12}  prev.date={prev.get('date')}")
          PY
