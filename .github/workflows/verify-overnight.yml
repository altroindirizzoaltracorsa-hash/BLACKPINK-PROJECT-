name: Verify overnight poller

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Pull campaign history + canary log + catalog
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: python .github/scripts/verify-overnight.py
