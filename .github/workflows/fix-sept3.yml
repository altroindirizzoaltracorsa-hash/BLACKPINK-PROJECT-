name: Fix Sept 3 recount

# One-off: CLICK/SaWaDiKa were added with a streams=0 Sep 3 row that bumped
# track_count and tripped the 'recount' flag on Sep 3 (dropping the real Sep 3
# delta from the average). Removes those 0-stream rows and restores Sep 3
# track_count so Sep 3 counts normally and the change lands on Sep 4. Never
# touches totals/deltas. Defaults to a dry-run preview.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Set true to APPLY (default: dry-run preview only)'
        required: false
        default: 'false'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Correct Sep 3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPLY: ${{ github.event.inputs.apply }}
        run: python .github/scripts/fix_sept3.py
