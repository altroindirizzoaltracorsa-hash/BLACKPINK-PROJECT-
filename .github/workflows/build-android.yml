name: Build Android APK

# Builds the Blinks United VMA Vote Counter Android app (android-app/) into a signed
# release APK and commits it to the repo root as blinks-united-vote-counter.apk, so the
# site can offer it as a direct download. Triggered by pushes that touch the app.
on:
  push:
    # main, so a change to the app actually produces a new APK. This used to name a
    # feature branch that was merged and deleted long ago, which meant the trigger
    # silently never fired and the committed APK drifted behind the source.
    branches: [ "main" ]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` is set explicitly. The action's DEFAULT is "tools platform-tools",
      # and `tools` is the obsolete SDK Tools package Google removed from the
      # repository — so the default now fails sdkmanager outright ("Failed to find
      # package 'tools'", exit 1) before a line of our code is compiled. That is what
      # broke this build; nothing in the app changed. Naming exactly what compileSdk 34
      # and AGP 8.5.2 need also means the build stops silently drifting with the
      # runner image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing keystore
        working-directory: android-app
        run: |
          # A stable, committed keystore so sideloaded updates install over old ones.
          # This key only identifies the publisher; it does not protect user data.
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias bu \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass blinksunited -keypass blinksunited \
              -dname "CN=Blinks United, OU=Fans, O=Blinks United, L=Seoul, ST=NA, C=KR"
          fi
          printf 'storeFile=release.keystore\nstorePassword=blinksunited\nkeyAlias=bu\nkeyPassword=blinksunited\n' > keystore.properties

      - name: Build release APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK to site root
        run: |
          set -e
          cp android-app/app/build/outputs/apk/release/app-release.apk blinks-united-vote-counter.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blinks-united-vote-counter.apk android-app/release.keystore
          if git diff --cached --quiet; then
            echo "No APK change to commit."
          else
            VER=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android-app/app/build.gradle | head -1)
            git commit -m "Build Android vote-counter APK v${VER:-unknown} [skip ci]"
            # The branch this run was started on gets written by more than one
            # workflow now — this one, and the hourly link-preview render — so a
            # push can land on a ref that moved underneath it. Rebase and retry
            # rather than failing a build whose artefact is perfectly good.
            REF='${{ github.ref_name }}'
            for i in 1 2 3; do
              if git push origin HEAD:"$REF"; then exit 0; fi
              echo "push rejected; rebasing on $REF (attempt $i)"
              git pull --rebase origin "$REF"
              sleep $((i * 5))
            done
            echo "::error::could not push after 3 attempts"
            exit 1
          fi
