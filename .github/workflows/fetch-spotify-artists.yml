name: Fetch Spotify Top Artists

# Populates the official Spotify Top Artists chart positions (BLACKPINK +
# members) for the /spotify-charts page. The actual charts.spotify.com fetch
# runs server-side on Vercel — Spotify blocks GitHub Actions IPs, so this job
# only *triggers* the Vercel handler (charts=fetch-artists), which mints a token
# from the SPOTIFY_SP_DC cookie and upserts into Supabase (artist_chart_positions).
on:
  schedule:
    - cron: '45 22 * * *'   # daily, just after the Top Songs fetch (30 22 * * *)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (blank = production).'
        required: false
        default: ''
      debug:
        description: 'Set to 1 to return diagnostics instead of writing.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger official artist-chart fetch on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: ${{ inputs.base_url != '' && inputs.base_url || 'https://www.blinksunited.com' }}
          DEBUG: ${{ inputs.debug }}
        run: |
          echo "Fetching official Spotify Top Artists → $BASE"
          URL="$BASE/api/proxy-image?charts=fetch-artists"
          [ -n "$DEBUG" ] && URL="$URL&debug=1"
          code=$(curl -sS -L --max-time 120 -o /tmp/out.json -w '%{http_code}' \
            -H "x-admin-secret: $ADMIN_KEY" \
            "$URL")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          test "$code" = "200"
