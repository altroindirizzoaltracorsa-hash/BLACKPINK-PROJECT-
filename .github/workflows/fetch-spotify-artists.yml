name: Fetch Spotify Charts

# Populates the official Spotify Top Songs (daily+weekly), Top Artists
# (daily+weekly) and Top Albums (weekly) for BLACKPINK + members on the
# /spotify-charts page. The charts.spotify.com fetch runs server-side on Vercel
# (Spotify blocks GitHub IPs); this job only *triggers* the Vercel handlers.
#
# Spotify rate-limits the charts service on a long rolling window, so each 74-req
# pass is spaced apart. Freshness is driven by a 2-hourly canary that does the
# full daily refresh only when the chart actually changes; a nightly floor
# guarantees a full sweep of everything.
on:
  schedule:
    - cron: '0 */2 * * *'    # canary — every 2h: refresh daily songs+artists only if changed
    - cron: '30 23 * * *'    # nightly DAILY floor — daily songs+artists sweep
    # WEEKLY charts publish Fridays. Each type gets its OWN Fri+Sat slot, an hour
    # apart, so every 74-country pass starts with a fresh Spotify rate budget
    # (back-to-back passes starve the later one — the cause of the ~50 skips).
    - cron: '30 19 * * 5,6'  # WEEKLY Top Songs   (Fri+Sat)
    - cron: '30 20 * * 5,6'  # WEEKLY Top Artists (Fri+Sat)
    - cron: '30 21 * * 5,6'  # WEEKLY Top Albums  (Fri+Sat)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (blank = production).'
        required: false
        default: ''
      type:
        description: 'songs | daily | weekly | albums | dailyfloor | weekly-songs | weekly-artists | weekly-albums | weeklyfloor | floor | both | canary. Default: both (artists daily+weekly).'
        required: false
        default: 'both'
      probe:
        description: 'Set to 1 to probe chart aliases and exit.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger official chart fetch on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: ${{ inputs.base_url != '' && inputs.base_url || 'https://www.blinksunited.com' }}
          SCHED: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.type }}
          PROBE: ${{ inputs.probe }}
        run: |
          hit() { # hit <query> → sets global `code`, prints body
            code=$(curl -sS -L --max-time 120 -o /tmp/out.json -w '%{http_code}' \
              -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/proxy-image?$1")
            echo "HTTP $code"; cat /tmp/out.json; echo
          }
          rc=0; need200() { [ "$code" = "200" ] || rc=1; }

          if [ -n "$PROBE" ]; then
            for A in song-global-daily regional-global-daily track-global-daily; do
              echo "── probe alias: $A ──"; hit "charts=probe-albums&alias=$A"
            done
            exit 0
          fi

          # ── Canary (every 2h): songs+artists move together on Spotify, so one
          #    change check gates both. Refresh the daily charts only on change. ──
          if [ "$SCHED" = "0 */2 * * *" ] || [ "$INPUT_TYPE" = "canary" ]; then
            echo "── canary ──"; hit "charts=artist-canary"
            if grep -q '"changed":true' /tmp/out.json; then
              echo "changed → refresh daily songs + artists"
              echo "── Top Songs (daily) ──";   hit "charts=fetch-songs&type=daily";    need200
              sleep 75
              echo "── Top Artists (daily) ──"; hit "charts=fetch-artists&type=daily";  need200
            else
              echo "no change"
            fi
            exit $rc
          fi

          # ── Nightly DAILY floor: daily songs+artists, every night. Spotify's
          #    weekly charts only publish on Fridays, so weekly gets its own slot
          #    (below) instead of re-fetching identical data nightly and burning
          #    the rolling rate budget. ──
          if [ "$SCHED" = "30 23 * * *" ] || [ "$INPUT_TYPE" = "dailyfloor" ] || [ "$INPUT_TYPE" = "floor" ]; then
            for Q in "charts=fetch-songs&type=daily" "charts=fetch-artists&type=daily"; do
              echo "── $Q ──"; hit "$Q"; need200; sleep 75
            done
            # A manual `floor` sweeps everything: fall through into the weekly block.
            [ "$INPUT_TYPE" = "floor" ] || exit $rc
          fi

          # ── WEEKLY sweeps. Spotify rate-limits the charts service on a rolling
          #    window longer than our inter-pass gap, so two 74-country passes close
          #    together starve the second (the ~50-country skips). Each weekly type
          #    therefore has its OWN Fri+Sat slot (19:30 / 20:30 / 21:30), an hour
          #    apart, so every pass starts fresh. A manual `weeklyfloor` (or `floor`)
          #    runs all three in one job, spaced 5 min apart for the same reason. ──
          wf_all=""
          if [ "$INPUT_TYPE" = "weeklyfloor" ] || [ "$INPUT_TYPE" = "floor" ]; then wf_all=1; fi

          if [ "$SCHED" = "30 19 * * 5,6" ] || [ "$INPUT_TYPE" = "weekly-songs" ] || [ -n "$wf_all" ]; then
            echo "── Top Songs (weekly) ──"; hit "charts=fetch-songs&type=weekly"; need200
            if [ -z "$wf_all" ]; then exit $rc; fi
            sleep 300
          fi
          if [ "$SCHED" = "30 20 * * 5,6" ] || [ "$INPUT_TYPE" = "weekly-artists" ] || [ -n "$wf_all" ]; then
            echo "── Top Artists (weekly) ──"; hit "charts=fetch-artists&type=weekly"; need200
            if [ -z "$wf_all" ]; then exit $rc; fi
            sleep 300
          fi
          if [ "$SCHED" = "30 21 * * 5,6" ] || [ "$INPUT_TYPE" = "weekly-albums" ] || [ -n "$wf_all" ]; then
            echo "── Top Albums (weekly) ──"; hit "charts=fetch-albums"; need200
            exit $rc
          fi

          # ── Targeted manual dispatch ──
          case "$INPUT_TYPE" in
            songs)  echo "── Top Songs (daily) ──";  hit "charts=fetch-songs&type=daily";  need200; sleep 75
                    echo "── Top Songs (weekly) ──"; hit "charts=fetch-songs&type=weekly"; need200 ;;
            daily)  echo "── Top Artists (daily) ──";  hit "charts=fetch-artists&type=daily";  need200 ;;
            weekly) echo "── Top Artists (weekly) ──"; hit "charts=fetch-artists&type=weekly"; need200 ;;
            albums) echo "── Top Albums (weekly) ──";  hit "charts=fetch-albums";              need200 ;;
            *)      echo "── Top Artists (daily) ──";  hit "charts=fetch-artists&type=daily";  need200; sleep 75
                    echo "── Top Artists (weekly) ──"; hit "charts=fetch-artists&type=weekly"; need200 ;;
          esac
          exit $rc
