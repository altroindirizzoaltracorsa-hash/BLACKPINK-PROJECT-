name: Fetch Spotify Top Artists

# Populates the official Spotify Top Artists (daily+weekly) and Top Albums
# (weekly) chart positions for BLACKPINK + members on the /spotify-charts page.
# The actual charts.spotify.com fetch runs server-side on Vercel — Spotify blocks
# GitHub Actions IPs — so this job only *triggers* the Vercel handlers, which mint
# a token from SPOTIFY_SP_DC and store into Supabase (artists) / Redis (albums).
#
# Spotify rate-limits the charts service on a long rolling window, so the three
# passes (74 requests each) run on SEPARATE schedules ~35 min apart, each with a
# fresh budget. A manual dispatch can target one via `type`.
on:
  schedule:
    - cron: '45 22 * * *'   # Top Artists — daily
    - cron: '20 23 * * *'   # Top Artists — weekly
    - cron: '55 23 * * *'   # Top Albums  — weekly
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (blank = production).'
        required: false
        default: ''
      type:
        description: 'daily | weekly | albums | both (artists daily+weekly). Default: both.'
        required: false
        default: 'both'
      probe:
        description: 'Set to 1 to probe the album chart shape and exit.'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger official chart fetch on Vercel
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: ${{ inputs.base_url != '' && inputs.base_url || 'https://www.blinksunited.com' }}
          SCHED: ${{ github.event.schedule }}
          INPUT_TYPE: ${{ inputs.type }}
          PROBE: ${{ inputs.probe }}
        run: |
          hit() { # hit <query>  → sets global `code`, prints body
            code=$(curl -sS -L --max-time 120 -o /tmp/out.json -w '%{http_code}' \
              -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/proxy-image?$1")
            echo "HTTP $code"; cat /tmp/out.json; echo
          }

          if [ -n "$PROBE" ]; then
            echo "── probing album chart shape ──"; hit "charts=probe-albums"; test "$code" = "200"; exit $?
          fi

          # Resolve what to fetch from the schedule or the manual `type` input.
          if   [ "$SCHED" = "45 22 * * *" ]; then TARGET="daily";
          elif [ "$SCHED" = "20 23 * * *" ]; then TARGET="weekly";
          elif [ "$SCHED" = "55 23 * * *" ]; then TARGET="albums";
          else TARGET="$INPUT_TYPE"; fi

          rc=0
          if [ "$TARGET" = "albums" ]; then
            echo "── Top Albums (weekly) ──"; hit "charts=fetch-albums"; [ "$code" = "200" ] || rc=1
          elif [ "$TARGET" = "daily" ] || [ "$TARGET" = "weekly" ]; then
            echo "── Top Artists ($TARGET) ──"; hit "charts=fetch-artists&type=$TARGET"; [ "$code" = "200" ] || rc=1
          else
            # "both" (manual): artists daily, then weekly, then albums — spaced so
            # each 74-request burst starts with a fresh-ish rate budget.
            echo "── Top Artists (daily) ──";  hit "charts=fetch-artists&type=daily";  [ "$code" = "200" ] || rc=1
            sleep 75
            echo "── Top Artists (weekly) ──"; hit "charts=fetch-artists&type=weekly"; [ "$code" = "200" ] || rc=1
            sleep 75
            echo "── Top Albums (weekly) ──";  hit "charts=fetch-albums";              [ "$code" = "200" ] || rc=1
          fi
          exit $rc
