name: Probe road-to-1B

# READ-ONLY. Calls /api/girlgroups?view=1b on the live deployment and prints the
# board as text, so the endpoint and the data behind it can be checked without
# opening the page. Direct HTTP to blinksunited.com is blocked from Claude Code
# sessions, so this is the only way to see what it actually returns.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL (blank = production)'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print the board
        env:
          BASE: ${{ inputs.base_url != '' && inputs.base_url || 'https://blinksunited.com' }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          # -L because the apex 308-redirects; without it the probe reports the
          # redirect as a failure rather than reading the endpoint. The admin
          # header is a custom one, so curl carries it across the hop.
          code=$(curl -sS -L -o /tmp/b.json -w '%{http_code}' \
            -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/girlgroups?view=1b")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 600 /tmp/b.json; echo; exit 1; fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/b.json'))
          print(f"as of {d.get('asOf')} · floor {d.get('floor'):,}")
          print(f"{len(d.get('tracks') or [])} racing · {len(d.get('done') or [])} past 1B\n")
          print(f"{'eta':<12} {'days':>5} {'rel→1B':>13} {'streams':>14} {'per day':>10}  track")
          for t in (d.get('tracks') or []):
              dl = t.get('daysLeft'); td = t.get('totalDays'); rt = t.get('rate')
              print(f"{str(t.get('eta') or '—'):<12} {(dl if dl is not None else '—'):>5} "
                    f"{(td if td is not None else '—'):>13} {t['streams']:>14,} "
                    f"{(round(rt) if rt else 0):>10,}  {t['group']} — {t['name']}"
                    + ('' if t.get('releasePrecision') != 'album' else "  [album date, not the song's]"))
          print()
          for t in (d.get('done') or []):
              print(f"{'past 1B':<12} {'—':>5} {'—':>13} {t['streams']:>14,} "
                    f"{(round(t['rate']) if t.get('rate') else 0):>10,}  {t['group']} — {t['name']}")
          PY

      # The artifact is for a human; a session cannot download one (artifacts are
      # served from blob storage, which the session's GitHub client will not
      # follow). So the shapes a chart has to handle are also printed inline:
      # the fastest few, one already past 1B, and one with too few clean days to
      # have a trend at all.
      - name: Dump the series a chart would be drawn from
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/b.json'))
          tracks = (d.get('tracks') or [])
          done = (d.get('done') or [])
          notrend = [t for t in tracks if not t.get('trend')]
          picks = tracks[:3] + done[:1] + notrend[:1]
          seen, out = set(), []
          for t in picks:
              k = (t.get('group'), t.get('name'))
              if k in seen:
                  continue
              seen.add(k)
              out.append({
                  'group': t.get('group'), 'name': t.get('name'),
                  'streams': t.get('streams'), 'rate': t.get('rate'),
                  'daysLeft': t.get('daysLeft'), 'totalDays': t.get('totalDays'),
                  'eta': t.get('eta'), 'trend': t.get('trend'),
                  'series': t.get('series'),
              })
          print('CHARTDATA ' + json.dumps(out, separators=(',', ':')))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-to-1b
          path: /tmp/b.json
