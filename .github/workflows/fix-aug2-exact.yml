name: Fix Aug 2 exact per-track baseline

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to 'true' to write. Leave 'false' for a dry-run diff."
        required: false
        default: "false"
      only:
        description: "Optional comma-separated artist_id filter (e.g. one artist). Blank = all."
        required: false
        default: ""

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Fix Aug 2 exact per-track baseline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
          ONLY: ${{ github.event.inputs.only }}
        run: python .github/scripts/fix-aug2-exact.py
