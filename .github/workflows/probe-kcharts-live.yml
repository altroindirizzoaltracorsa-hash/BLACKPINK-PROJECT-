name: Probe kcharts-live endpoint (read-only)

# One-off check that the deployed /api/kcharts-live endpoint responds and
# returns the two Melon 5분 charts. Removed after verification.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the live endpoint
        run: |
          echo "GET https://www.blinksunited.com/api/kcharts-live (follow redirects)"
          code=$(curl -sL -o resp.json -w '%{http_code} final=%{url_effective}' https://www.blinksunited.com/api/kcharts-live)
          echo "HTTP $code"
          echo "--- body ---"
          cat resp.json
          echo
          echo "--- summary ---"
          node -e '
            const o=JSON.parse(require("fs").readFileSync("resp.json","utf8"));
            console.log("charts:", (o.charts||[]).length, "| generatedAt:", o.generatedAt, "| error:", o.error||"none");
            for(const c of (o.charts||[])) console.log("  "+c.key+" available="+c.available+" rows="+c.totalRows+" BP="+(c.entries||[]).length);
          '
