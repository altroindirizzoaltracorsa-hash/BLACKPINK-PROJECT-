name: Probe extension coverage for one account (read-only)

# DID THE BROWSER EXTENSION ACTUALLY CATCH THE PLAYS?
#
# The extension writes to extension_scrobbles, and those rows are added ON TOP
# OF a profile's Last.fm/ListenBrainz counts (api/cron-scrobbles.js:718 —
# `totalPlays[t.id] += ext.total[t.id]`), with no cross-source de-duplication.
# So there are two opposite ways for an extension-linked profile to be wrong
# and NEITHER of them announces itself:
#
#   UNDER  the extension only sees what this browser plays. A phone, the
#          desktop Spotify app, or a closed tab are invisible to it, and a
#          suspended MV3 service worker can sleep through plays. Those plays
#          are simply absent from extension_scrobbles.
#   OVER   a play scrobbled to Last.fm AND seen by the extension is counted
#          once by each, because the two sources are summed. For someone who
#          runs both, that is a genuine double count.
#
# A third case looks like UNDER but is recoverable: a play the matcher did not
# recognise is not dropped, it is filed under a bucket id (solo_jisoo,
# solo_jennie, bp_group) with its real artist and title kept alongside. That is
# what happened to every extension-scrobbled ADDICTED play before its matcher
# entry existed, and what the 2026_11_backfill_addicted_* pair repaired. This
# probe lists those rows so the same repair can be aimed at the next one.
#
# Scoped to ONE account on purpose — pass a linked Last.fm/ListenBrainz
# username and it reports only that profile. Read-only: selects and counts, no
# writes, no row contents beyond artist/title which the owner already sees on
# their own page.

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'A linked account username (Last.fm or ListenBrainz). BLANK = scan every profile instead.'
        required: false
        default: ''
      days:
        description: 'How many days back to break down (default 14)'
        required: false
        default: '14'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Ask the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACCOUNT: ${{ github.event.inputs.account }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          set -u
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::SUPABASE_DB_URL is not set."; exit 1; fi
          DAYS="${DAYS:-14}"
          case "$DAYS" in ''|*[!0-9]*) DAYS=14 ;; esac

          # SCAN MODE — no account given. One profile going quiet is a browser
          # that stopped; every profile going quiet on the same day is ours.
          # That distinction decides whether the answer is "re-link it" or
          # "we broke ingest", and it cannot be made from a single account.
          # Aggregates only: a row count and two timestamps per profile, no
          # titles, no artists.
          if [ -z "${ACCOUNT:-}" ]; then
            set +e
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A >/tmp/scan.txt 2>&1 <<'SQL'
            select 'TOTAL profiles with extension rows = ' || count(*)
              from (select 1 from public.extension_scrobbles group by app_user_id) s;

            -- Last row per profile, quietest first. A cluster of profiles whose
            -- last row shares a date is the signal worth acting on.
            select 'LAST  ' || to_char(last_row, 'YYYY-MM-DD HH24:MI')
                || '  rows=' || lpad(n::text, 6)
                || '  accounts=' || lpad(accts::text, 3)
                || '  silent_days=' || lpad(round(extract(epoch from (now() - last_row)) / 86400)::text, 4)
              from (select app_user_id, max(listened_at) as last_row, count(*) as n,
                           count(distinct spotify_account) as accts
                      from public.extension_scrobbles group by app_user_id) s
             order by last_row;

            -- And the shape of it: how many profiles stopped on each date.
            select 'STOPPED ON ' || d || '  profiles=' || count(*)
              from (select (max(listened_at) at time zone 'UTC')::date as d
                      from public.extension_scrobbles group by app_user_id) t
             group by d order by d;
          SQL
            rc=$?
            set -e
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::notice title=scan::${line}"
            done < /tmp/scan.txt
            if [ "$rc" -ne 0 ]; then echo "::error::psql exited $rc"; exit "$rc"; fi
            exit 0
          fi

          set +e
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -t -A -v acct="$ACCOUNT" -v days="$DAYS" >/tmp/out.txt 2>&1 <<'SQL'
          \set qacct '''' :acct ''''

          -- Who this is, and every account on the same profile. A profile with
          -- two Last.fm accounts and an extension is exactly the shape where
          -- the sum of sources stops being obvious.
          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          )
          -- app_user_id is a uuid; cast INSIDE the subquery, because coalesce
          -- refuses to match uuid against the text fallback.
          select 'PROFILE  ' || coalesce((select app_user_id::text from me),
                                         '(no linked_accounts row for ' || :qacct || ')');

          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          )
          select '  linked  ' || source || ' = ' || source_username
            from public.linked_accounts
           where app_user_id = (select app_user_id from me)
           order by source, source_username;

          -- Extension rows overall: how many, over what span, from how many
          -- Spotify accounts. A span that stops days ago is the extension
          -- having quietly stopped reporting.
          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          )
          select 'EXTENSION  rows=' || count(*)
              || '  spotify_accounts=' || count(distinct spotify_account)
              || '  first=' || coalesce(min(listened_at)::text, '-')
              || '  last='  || coalesce(max(listened_at)::text, '-')
            from public.extension_scrobbles
           where app_user_id = (select app_user_id from me);

          -- Per day. A day with zero rows beside a day with hundreds is the
          -- shape of a browser that was closed, not of a bug.
          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          )
          -- Aggregate in a subquery and format outside it. Formatting inline
          -- put count(*) inside the GROUP BY expression, which Postgres
          -- rejects outright ("aggregate functions are not allowed in GROUP
          -- BY") — and because each statement is independent, that killed
          -- this query and the two below it while the ones above still
          -- printed, which reads like "no data" rather than like an error.
          select '  day ' || d || '  rows=' || n
            from (select (listened_at at time zone 'UTC')::date as d, count(*) as n
                    from public.extension_scrobbles
                   where app_user_id = (select app_user_id from me)
                     and listened_at >= now() - (:'days' || ' days')::interval
                   group by 1) s
           order by d;

          -- Per track id. Bucket ids (solo_*, bp_group) are the ones worth
          -- looking at twice: a campaign song sitting in one is a matcher miss,
          -- and those rows are repairable because the real title is kept.
          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          )
          select '  track ' || rpad(t, 14) || ' rows=' || n
            from (select track_id as t, count(*) as n
                    from public.extension_scrobbles
                   where app_user_id = (select app_user_id from me)
                   group by 1) s
           order by n desc;

          -- The recoverable set: rows in a bucket whose TITLE matches a song we
          -- track. Mirrors the ADDICTED backfill's predicate (strip (...) and
          -- [...], drop non-alphanumerics) so whatever this lists is what a
          -- backfill would move.
          with me as (
            select app_user_id from public.linked_accounts
             where lower(source_username) = lower(:qacct) limit 1
          ), norm as (
            select track_id, artist, title,
                   regexp_replace(lower(regexp_replace(coalesce(title,''), '\(.*?\)|\[.*?\]', '', 'g')),
                                  '[^a-z0-9]', '', 'g') as tkey
              from public.extension_scrobbles
             where app_user_id = (select app_user_id from me)
               and (track_id like 'solo\_%' or track_id = 'bp_group')
          )
          select 'MISFILED?  bucket=' || t || '  artist=' || a
              || '  title=' || ti || '  rows=' || n
            from (select track_id as t, artist as a, title as ti, count(*) as n
                    from norm
                   where tkey in ('jump','shutdown','dududududu','go','sawadika','click',
                                  'lessthanalover','fallenangel','heaven','newtrick',
                                  'v12','cobra','tarantino','cutuoff','sweat','addicted',
                                  'someonetohold')
                   group by 1, 2, 3) s
           order by n desc
           limit 40;
          SQL
          rc=$?
          set -e
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::notice title=ext::${line}"
          done < /tmp/out.txt
          if [ "$rc" -ne 0 ]; then echo "::error::psql exited $rc"; exit "$rc"; fi

      - name: Compare against Last.fm for the same days
        if: always()
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          python3 - <<'PY'
          import os, json, time, datetime, urllib.parse, urllib.request

          # The same public key the rest of the repo uses (hardcoded in
          # index.html, which is public). Read-only calls only.
          LFM_KEY = "666b8ef2f3cc360fbc20df275fba2981"
          LBASE   = "https://ws.audioscrobbler.com/2.0/"

          user = os.environ["ACCOUNT"].strip()
          if not user:
              # Scan mode: the question there is which profiles went quiet and
              # when, which is answered entirely from our own rows. Asking
              # Last.fm about an empty username would just be an error.
              print("::notice title=lastfm::scan mode — no account, nothing to compare")
              raise SystemExit(0)
          try:
              days = max(1, min(30, int(os.environ.get("DAYS") or 14)))
          except ValueError:
              days = 14

          def note(s):
              print("::notice title=lastfm::" + str(s).replace("%", "%25"))

          def lfm(**p):
              p.update(api_key=LFM_KEY, format="json")
              try:
                  with urllib.request.urlopen(LBASE + "?" + urllib.parse.urlencode(p), timeout=25) as r:
                      return json.load(r)
              except Exception as e:
                  return {"__error": str(e)}

          now = datetime.datetime.now(datetime.timezone.utc)
          start = (now - datetime.timedelta(days=days)).replace(hour=0, minute=0, second=0, microsecond=0)
          frm, to = int(start.timestamp()), int(now.timestamp())

          # Per-UTC-day scrobble counts straight from their own history. This is
          # the figure the extension's per-day row counts get read against: the
          # extension can only ever be a subset of what a scrobbler saw, so a
          # day where Last.fm has plays and the extension has none is a day the
          # browser was not the thing playing.
          # The cap must be high enough that it is not the answer. At 20 pages
          # this reported exactly 4000 scrobbles — 20 x 200, i.e. the cap
          # rendered as a total, which is the kind of round number that reads
          # like data. It now says when it stopped early instead.
          MAXPAGES = 80
          per_day, page, pages = {}, 1, 1
          while page <= pages and page <= MAXPAGES:
              d = lfm(method="user.getRecentTracks", user=user, **{"from": frm, "to": to},
                      limit=200, page=page)
              rt = d.get("recenttracks")
              if not rt:
                  note(f"{user}: {d.get('message') or d.get('__error') or 'no recenttracks'}")
                  break
              pages = int((rt.get("@attr") or {}).get("totalPages") or 1)
              tracks = rt.get("track") or []
              if isinstance(tracks, dict):
                  tracks = [tracks]
              for t in tracks:
                  if (t.get("@attr") or {}).get("nowplaying") == "true":
                      continue
                  uts = (t.get("date") or {}).get("uts")
                  if not uts:
                      continue
                  day = datetime.datetime.fromtimestamp(int(uts), datetime.timezone.utc).date().isoformat()
                  per_day[day] = per_day.get(day, 0) + 1
              page += 1
              time.sleep(0.25)          # the key is shared; stay well inside its budget

          capped = pages > MAXPAGES
          note(f"{user}: {sum(per_day.values())} scrobbles over {len(per_day)} day(s), "
               f"last {days} days" +
               (f"  ** TRUNCATED: Last.fm reports {pages} pages, read {MAXPAGES}; "
                "this is a FLOOR, not a total **" if capped else ""))
          for day in sorted(per_day):
              note(f"  day {day}  scrobbles={per_day[day]}")
          note("Read the two day lists against each other: Last.fm is everything "
               "this account scrobbled, the extension rows are only what this "
               "browser saw. Extension < Last.fm on a day is normal (phone, "
               "desktop app, closed tab). Extension > 0 where Last.fm is 0 means "
               "the two sources are counting different plays, and they are SUMMED.")
          PY
