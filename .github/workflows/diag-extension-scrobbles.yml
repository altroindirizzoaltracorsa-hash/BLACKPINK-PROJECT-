name: Diag extension scrobbles

# One-off, read-only diagnostic: audits the extension_scrobbles table for
# duplicate/inflated ingests. Runs automatically when its own files are pushed
# to the scrobbler branch (so it works without living on the default branch),
# and can also be run manually. Safe to delete once used.
on:
  push:
    branches: [ claude/webscrobbler-per-profile-6vhgdf ]
    paths:
      - '.github/workflows/diag-extension-scrobbles.yml'
      - '.github/scripts/diag-extension-scrobbles.mjs'
  workflow_dispatch:
    inputs:
      acct:  { description: 'spotify_account label to scope (e.g. D)', required: false }
      from:  { description: 'window start ISO (e.g. 2026-08-15T14:00:00Z)', required: false }
      to:    { description: 'window end ISO (optional)', required: false }
      track: { description: 'track id (jump|shutdown|ddududu|ltal|go)', required: false, default: 'jump' }

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit extension_scrobbles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIAG_ACCT: ${{ inputs.acct || 'D,M,S' }}
          DIAG_FROM: ${{ inputs.from || '2026-08-15T15:42:00Z' }}
          DIAG_TO: ${{ inputs.to || '2026-08-15T16:15:00Z' }}
          DIAG_TRACK: ${{ inputs.track }}
        run: node .github/scripts/diag-extension-scrobbles.mjs
