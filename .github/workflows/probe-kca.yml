name: Probe Kids' Choice Awards vote pages (read-only)

# Opens the KCA category pages and reports what they actually say: HTTP status,
# the category heading, every nominee listed, and any text stating a vote limit
# or a closing date.
#
# Why: a card is going on /voting with three per-category links and a stated
# rule. Two things could not be checked from a session — kca.nick.tv does not
# resolve through the egress proxy, and a web search turned up a "100 votes per
# day" rule that belongs to a DIFFERENT award (Academy Kids Choice, Canada), so
# repeating it as Nickelodeon's would be inventing a rule. A dead link or a
# wrong limit on a voting page is worse than no card.
#
# Read-only: GETs only, no vote is ever cast.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Category slugs, space separated'
        required: false
        default: 'favorite-music-group-or-duo favorite-music-collaboration favorite-female-artist'
      slug:
        description: 'Single slug for the ballot-markup job'
        required: false
        default: 'favorite-music-group-or-duo'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch each page
        env:
          SLUGS: ${{ inputs.paths }}
          UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'
        run: |
          set -u
          mkdir -p /tmp/kca
          for u in "https://kca.nick.tv/vote/" $(for s in $SLUGS; do echo "https://kca.nick.tv/vote/$s"; done); do
            f="/tmp/kca/$(echo "$u" | md5sum | cut -c1-8).html"
            code=$(curl -sSL --compressed -m 45 -A "$UA" -w '%{http_code}' -o "$f" "$u" || echo 000)
            echo "GET $u -> HTTP $code · $(wc -c <"$f" 2>/dev/null || echo 0) bytes"
            echo "$u" > "$f.url"
          done

      - name: Read what they say
        run: |
          python3 - <<'PY'
          import glob, html, os, re

          def text(h):
              h = re.sub(r'(?is)<(script|style|noscript)[^>]*>.*?</\1>', ' ', h)
              h = re.sub(r'(?s)<[^>]+>', ' ', h)
              return re.sub(r'\s+', ' ', html.unescape(h)).strip()

          for f in sorted(glob.glob('/tmp/kca/*.html')):
              url = open(f + '.url').read().strip() if os.path.exists(f + '.url') else f
              raw = open(f, encoding='utf-8', errors='replace').read()
              t = text(raw)
              print(f"\n{'='*72}\n{url}\n{'='*72}")
              if len(raw) < 2000:
                  print(f"  tiny response ({len(raw)}B) — almost certainly a bot challenge")
                  print('  ' + t[:400]); continue
              m = re.search(r'(?is)<title[^>]*>(.*?)</title>', raw)
              print('title:', html.unescape(m.group(1)).strip() if m else '—')

              # Anything that states a limit or a deadline, in its own words.
              for pat, lbl in [
                  (r'[^.]*?\b\d+\s*votes?\b[^.]*\.', 'VOTE LIMIT'),
                  (r'[^.]*?\bper (?:day|category|device)\b[^.]*\.', 'PER …'),
                  (r'[^.]*?\b(?:voting (?:ends|closes)|deadline|closes on)\b[^.]*\.', 'CLOSES'),
                  (r'[^.]*?\b(?:November|Nov\.?)\s*\d{1,2}[^.]*\.', 'DATE'),
              ]:
                  hits = {h.strip() for h in re.findall(pat, t, re.I)}
                  for h in list(hits)[:4]:
                      print(f"  [{lbl}] {h[:220]}")

              # Nominee names: the vote pages list them as buttons/cards.
              names = re.findall(r'(?is)(?:alt|aria-label|title)="([^"]{3,80})"', raw)
              keep = [n for n in dict.fromkeys(names)
                      if not re.search(r'(?i)logo|icon|nickelodeon|share|facebook|twitter|close|menu', n)]
              if keep:
                  print('  candidates:', ' | '.join(keep[:25]))
              for who in ['BLACKPINK', 'JENNIE', 'Tame Impala', 'Dracula', 'ROS', 'BTS']:
                  if re.search(who, t, re.I):
                      i = re.search(who, t, re.I).start()
                      print(f"  ✓ {who}: …{t[max(0,i-60):i+90]}…")
          PY

      # The pages are ~10KB client-rendered shells: the titles confirm the
      # category names and that the links are live, but every nominee and every
      # rule arrives via JS. So render one properly and read what a voter reads.
      - name: Render a category page and read the rules
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > kca.mjs <<'JS'
          import { chromium } from 'playwright';
          const slugs = (process.env.SLUGS || '').trim().split(/\s+/).filter(Boolean);
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 1400 } });
          for (const s of slugs) {
            const url = `https://kca.nick.tv/vote/${s}`;
            await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('nav:', e.message));
            await p.waitForTimeout(2500);
            const t = await p.evaluate(() => document.body.innerText.replace(/\s+/g, ' ').trim());
            console.log(`\n${'='.repeat(72)}\n${url}\n${'='.repeat(72)}`);
            // Every sentence that states a limit or a date — quoted, not paraphrased.
            for (const re of [/[^.!?]*\b\d+\s*votes?\b[^.!?]*[.!?]/gi,
                              /[^.!?]*\bper (?:day|category|device|person)\b[^.!?]*[.!?]/gi,
                              /[^.!?]*\b(?:voting|vote)\s*(?:ends|closes|period)\b[^.!?]*[.!?]/gi,
                              /[^.!?]*\b(?:Nov(?:ember)?\.?\s*\d{1,2})\b[^.!?]*[.!?]/gi]) {
              for (const m of new Set(t.match(re) || [])) console.log('  »', m.trim().slice(0, 240));
            }
            const noms = await p.$$eval('button, [role="button"], li, figcaption',
              els => [...new Set(els.map(e => (e.innerText || '').trim())
                .filter(x => x && x.length < 60 && !/^(vote|submit|close|menu|home)$/i.test(x)))].slice(0, 40));
            console.log('  nominees seen:', noms.join(' | ') || '—');
          }
          await b.close();
          JS
          SLUGS="${{ inputs.paths }}" node kca.mjs

  # ── Where do the ballot's ids live, and what does an option look like? ──────
  # Answers the one question the vote capture could not. The KCA vote request is
  #   POST https://kca.nick.tv/api/vote
  #   {"user_id":"…","region":"us","environment":"production",
  #    "votes":[{"question_id":"<uuid>","option_id":"<uuid>"}, …]}
  # — opaque UUIDs for both the category and the nominee, and nothing in the
  # payload names BLACKPINK. So the counter has to learn which pick is ours from
  # the PAGE. The only other signal in the capture was Adobe click telemetry
  # (edge.adobedc.net), which (a) any ad blocker removes and (b) races the SPA
  # router — one BLACKPINK click in that capture was reported under the NEXT
  # category's URL. A counter built on that alone is a silent zero waiting to
  # happen, which is the failure mode BreakTudo already taught us.
  #
  # Prints the page's own network requests (is there a ballot API?), each option
  # element as a click listener would see it, every UUID in the DOM with its
  # context, and any UUID-bearing global. Never clicks a nominee, and FAILS the
  # job if a /api/vote request happens anyway.
  ballot:
    runs-on: ubuntu-latest
    steps:
      - name: Render the page and report its ballot markup
        env:
          SLUG: ${{ inputs.slug || 'favorite-music-group-or-duo' }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > ballot.mjs <<'JS'
          import { chromium } from 'playwright';

          const slug = process.env.SLUG;
          const url = `https://kca.nick.tv/vote/${slug}`;
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 1600 } });

          // Every request, so a ballot API cannot hide. The vote endpoint must
          // never appear — this probe reads, it does not vote.
          const reqs = [];
          let voted = false;
          p.on('request', (r) => {
            const u = r.url();
            if (/\/api\/vote\b/.test(u)) voted = true;
            reqs.push({ m: r.method(), u, rt: r.resourceType() });
          });
          // Bodies of same-origin JSON responses — that is where a ballot would be.
          const bodies = [];
          p.on('response', async (r) => {
            const u = r.url();
            if (!/kca\.nick\.tv/.test(u)) return;
            const ct = (r.headers()['content-type'] || '');
            if (!/json/i.test(ct)) return;
            try { bodies.push({ u, body: (await r.text()).slice(0, 4000) }); } catch {}
          });

          await p.goto(url, { waitUntil: 'networkidle', timeout: 90000 }).catch(e => console.log('nav:', e.message));
          await p.waitForTimeout(4000);

          console.log(`\n${'='.repeat(72)}\n${url}\n${'='.repeat(72)}`);

          console.log('\n--- same-origin / API requests (assets filtered out)');
          for (const r of reqs) {
            if (/\.(png|jpe?g|webp|svg|woff2?|mp3|wav|css|js|ico|gif|mp4)(\?|$)/i.test(r.u)) continue;
            if (/googlesyndication|adobedc|nr-data|videoamp|ketchcdn|demdex|doubleclick|adtrafficquality/.test(r.u)) continue;
            console.log(`  ${r.m} ${r.u}`);
          }

          console.log('\n--- same-origin JSON responses');
          if (!bodies.length) console.log('  none — the ballot is not served as JSON from this origin');
          for (const r of bodies) console.log(`  ${r.u}\n    ${r.body.slice(0, 1200).replace(/\n/g, ' ')}`);

          // What a click listener would actually see. Deliberately several
          // candidate selectors: the counter must key off whichever is real.
          console.log('\n--- option elements, per candidate selector');
          const sels = ['.question-option', '[class*="question-option"]', 'button[class*="option"]',
                        '[role="radio"]', '[role="button"]', 'button'];
          for (const sel of sels) {
            const found = await p.$$eval(sel, (els) => els.slice(0, 8).map((e) => ({
              tag: e.tagName.toLowerCase(),
              cls: (e.getAttribute('class') || '').slice(0, 140),
              attrs: [...e.attributes].filter(a => a.name !== 'class' && a.name !== 'style')
                .map(a => `${a.name}=${a.value.slice(0, 60)}`).join(' '),
              text: (e.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 80),
            }))).catch(() => []);
            console.log(`\n  [${sel}] ${found.length} shown`);
            for (const f of found) console.log(`    <${f.tag}> text="${f.text}"\n       class="${f.cls}"\n       ${f.attrs || '(no other attributes)'}`);
          }

          // Does the nominee's own element carry its option_id? That is the
          // difference between a counter that reads ids off the page and one
          // that has to infer them.
          console.log('\n--- every UUID in the rendered DOM, with context');
          const uuids = await p.evaluate(() => {
            const re = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
            const out = [];
            const walk = (el, path) => {
              for (const a of el.attributes || []) {
                for (const m of String(a.value).match(re) || [])
                  out.push({ id: m, where: `${path}[${a.name}]`, text: (el.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 60) });
              }
              for (const c of el.children) walk(c, `${path}>${c.tagName.toLowerCase()}`);
            };
            walk(document.documentElement, 'html');
            return out.slice(0, 60);
          });
          if (!uuids.length) console.log('  NONE — no UUID appears in any DOM attribute');
          for (const u of uuids) console.log(`  ${u.id}  @ ${u.where}  text="${u.text}"`);

          console.log('\n--- UUIDs in inline <script> / JSON blocks');
          const inline = await p.evaluate(() => {
            const re = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
            return [...document.querySelectorAll('script')]
              .map(s => (s.textContent || ''))
              .filter(t => re.test(t))
              .map(t => t.slice(0, 1500));
          });
          if (!inline.length) console.log('  none');
          inline.forEach((t, i) => console.log(`  [${i}] ${t.replace(/\n/g, ' ')}`));

          console.log('\n--- UUID-bearing globals on window');
          const globals = await p.evaluate(() => {
            const re = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
            const hits = [];
            for (const k of Object.keys(window)) {
              let v; try { v = window[k]; } catch { continue; }
              if (!v || typeof v !== 'object') continue;
              let s; try { s = JSON.stringify(v); } catch { continue; }
              if (s && re.test(s)) hits.push({ k, len: s.length, head: s.slice(0, 400) });
            }
            return hits.slice(0, 10);
          });
          if (!globals.length) console.log('  none');
          for (const g of globals) console.log(`  window.${g.k} (${g.len}B) ${g.head}`);

          // The nominee names, so the counter's name matching can be checked
          // against what the page really renders (accents included).
          console.log('\n--- page text (first 1200 chars)');
          console.log('  ' + (await p.evaluate(() => document.body.innerText.replace(/\s+/g, ' ').trim())).slice(0, 1200));

          console.log(`\n--- read-only assertion: ${voted ? 'FAILED — a /api/vote request was made!' : 'ok, no vote request was made'}`);
          await b.close();
          if (voted) process.exit(1);
          JS
          node ballot.mjs
