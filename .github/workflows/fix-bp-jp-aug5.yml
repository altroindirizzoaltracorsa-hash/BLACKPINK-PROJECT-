name: Fix BP JP Aug5

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to true to APPLY the write (default: dry-run)"
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Correct BLACKPINK 08-05 total (JP tracks)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
        run: python .github/scripts/fix-bp-jp-aug5.py
