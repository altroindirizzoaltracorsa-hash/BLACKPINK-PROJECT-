name: Diagnose Goal History

# One-off: read the live goal-history output and the backfill dry-run so we can
# see, per day, what the durable per-day store actually sums to for the 4-track
# community total. Read-only (dry=1 writes nothing). Trigger from the Actions tab.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: goal-history (merged / derived)
        run: |
          echo "=== GET goal-history ==="
          curl -sSL "https://blinksunited.com/api/leaderboard?action=goal-history" -o gh.json || true
          python3 -c "import json;d=json.load(open('gh.json'));print('top-level keys:',list(d.keys()));print('streak:',d.get('streak'));print('days:',json.dumps(d.get('days',{}),indent=0)[:3000])" || cat gh.json | head -c 800
          echo

      - name: backfill dry-run (per-day 4-track totals from user_daily_counts)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "=== POST backfill-goal-history?dry=1 ==="
          curl -sSL -X POST --post301 --post302 \
            "https://blinksunited.com/api/leaderboard?action=backfill-goal-history&dry=1&key=${ADMIN_KEY}" \
            -o bf.json || true
          python3 -c "import json;d=json.load(open('bf.json'));print('keys:',list(d.keys()));print('recorded(>=15k):',json.dumps(d.get('recorded',[])[:40]));print('skipped sample:',json.dumps(d.get('skipped',[])[:15]))" || cat bf.json | head -c 2000
          echo
