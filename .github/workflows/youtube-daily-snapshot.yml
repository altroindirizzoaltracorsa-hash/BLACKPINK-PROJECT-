name: YouTube daily snapshot

# One reading a day of every tracked YouTube video, into Supabase.
#
# This is what turns the milestone board from "how far" into "how soon".
# /api/youtube-catalog can only ever say where things are now; a rate needs two
# readings, and YouTube serves a cumulative number with no history, so a reading
# not taken is gone for good.
#
# Minute is deliberately not :00 or :30. GitHub queues scheduled runs behind the
# top-of-the-hour crush and on this repo that delay has measured 2h10m-5h, which
# is documented in CLAUDE.md and is why the fetch-catalog slots all use odd
# minutes. It matters less here than there — snapshot_youtube.py records the real
# elapsed hours between readings rather than assuming a day — but a run that
# lands when it is supposed to is still worth having.
#
# THIS IS NOW THE BACKSTOP, NOT THE PRIMARY. /api/youtube-snapshot runs from a
# Vercel cron at 05:00 UTC (vercel.json) and lands within about a minute of the
# boundary, which is what makes the daily gain a real fixed day rather than a
# floating ~24h window.
#
# 05:00 UTC is 2PM KST, the instant these videos are released — so the first
# full row after a release covers exactly release → release+24h and the table's
# day one IS the 24h figure. See the note at the top of api/youtube-snapshot.js.
#
# WHY IT MOVED: this job is 21 seconds of work and GitHub was running it about
# NINE HOURS LATE, every day — scheduled 04:41, ran 13:36 and 13:53 on
# consecutive days. That does not break a rate (the row carries hours_since and
# the page divides by it) but it means "daily gain" is measured between two
# arbitrary instants. Measured on the hourly series, that drift puts a fixed
# 00:00 boundary off by a median of 50 minutes and up to 110.
#
# IT IS KEPT because a reading not taken is gone for good — YouTube serves a
# cumulative number with no history — so the endpoint failing silently must not
# mean a lost day. snapshot_youtube.py now SKIPS a date that already has rows,
# so a late run can never overwrite the midnight one; without that guard this
# backstop would undo the fix daily. FORCE=1 overrides for a deliberate re-run.
#
# 05:47 UTC: 47 minutes after the Vercel cron, so on a normal day the row for
# that date already exists and the skip is the cheap path. GitHub's delay puts
# it nearer 14:00 in practice, which is still the same UTC date and still a
# skip. Not :00 or :30, for the queue reason above.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report, write nothing (1 = dry run)'
        required: false
        default: ''
      min_views:
        description: 'View floor (default 50000000)'
        required: false
        default: ''
      override_date:
        description: 'Label this reading YYYY-MM-DD instead of today (backfill a hole)'
        required: false
        default: ''
      force:
        description: 'Overwrite a date that already has rows (1 = force). Normally OFF so this backstop cannot clobber the punctual midnight reading.'
        required: false
        default: ''

# One reading at a time. Two overlapping runs would both read the same previous
# reading and compute the same delta twice; the upsert makes that harmless for
# the stored row, but hours_since would be wrong on whichever lost the race.
concurrency:
  group: youtube-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet httpx
      - name: Take the reading
        env:
          BASE: https://blinksunited.com
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_VIEWS: ${{ inputs.min_views }}
          OVERRIDE_DATE: ${{ inputs.override_date }}
        run: python .github/scripts/snapshot_youtube.py
