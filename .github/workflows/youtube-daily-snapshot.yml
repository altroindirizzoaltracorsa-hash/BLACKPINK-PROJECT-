name: YouTube daily snapshot

# One reading a day of every tracked YouTube video, into Supabase.
#
# This is what turns the milestone board from "how far" into "how soon".
# /api/youtube-catalog can only ever say where things are now; a rate needs two
# readings, and YouTube serves a cumulative number with no history, so a reading
# not taken is gone for good.
#
# Minute is deliberately not :00 or :30. GitHub queues scheduled runs behind the
# top-of-the-hour crush and on this repo that delay has measured 2h10m-5h, which
# is documented in CLAUDE.md and is why the fetch-catalog slots all use odd
# minutes. It matters less here than there — snapshot_youtube.py records the real
# elapsed hours between readings rather than assuming a day — but a run that
# lands when it is supposed to is still worth having.
#
# THIS IS THE BACKSTOP, NOT THE PRIMARY. /api/youtube-snapshot runs from a
# Vercel cron at 15:00 UTC — midnight KST — and lands within about a minute of
# it, which is what makes the daily gain a real fixed day rather than a
# floating window. See the note at the top of api/youtube-snapshot.js for why
# that hour.
#
# WHY IT MOVED OFF GITHUB: this job is 21 seconds of work and GitHub was
# running it 4h25m-9h12m late, measured across 30 consecutive scheduled runs —
# drifting from ~09:30 in October to ~13:40 in November. That never broke a
# rate (the row carries hours_since and the page divides by it) but it meant
# "daily gain" was measured between two arbitrary instants.
#
# IT IS KEPT because a reading not taken is gone for good — YouTube serves a
# cumulative number with no history — so the endpoint failing silently must
# not cost a day.
#
# ITS GUARD IS ON STALENESS, NOT THE DATE. It used to skip when the current
# date already had rows, which only works if this job is guaranteed to run
# AFTER the cron on the same UTC date. At 15:00 UTC that guarantee is gone:
# GitHub's delay can put this either side of 15:00 and on either date, and a
# date check would then let a mid-morning reading write the row first and
# reintroduce the drift. "Is the newest reading more than 26 hours old?" needs
# no assumption about when either job runs. FORCE=1 overrides.
#
# The slot stays at 05:47 and the hour no longer matters, because the guard no
# longer depends on it. Not :00 or :30, for the queue reason above.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report, write nothing (1 = dry run)'
        required: false
        default: ''
      min_views:
        description: 'View floor (default 50000000)'
        required: false
        default: ''
      override_date:
        description: 'Label this reading YYYY-MM-DD instead of today (backfill a hole)'
        required: false
        default: ''
      force:
        description: 'Overwrite a date that already has rows (1 = force). Normally OFF so this backstop cannot clobber the punctual midnight reading.'
        required: false
        default: ''

# One reading at a time. Two overlapping runs would both read the same previous
# reading and compute the same delta twice; the upsert makes that harmless for
# the stored row, but hours_since would be wrong on whichever lost the race.
concurrency:
  group: youtube-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet httpx
      - name: Take the reading
        env:
          BASE: https://blinksunited.com
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_VIEWS: ${{ inputs.min_views }}
          OVERRIDE_DATE: ${{ inputs.override_date }}
        run: python .github/scripts/snapshot_youtube.py
