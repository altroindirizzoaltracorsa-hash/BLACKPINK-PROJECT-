name: Probe circlechart.kr rows (read-only)

# Dumps a chart table's row markup + the sidebar's serviceGbn->label map so we
# can write a parser and name each sub-chart. Removed after.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect rows
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36';
          async function get(u){const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'ko,en;q=0.9'}});return {status:r.status, body:await r.text()};}
          function clip(s,n){return s.length>n?s.slice(0,n)+'…[+'+(s.length-n)+']':s;}
          (async()=>{
            const digital = await get('https://circlechart.kr/page_chart/onoff.circle?serviceGbn=ALL&termGbn=week');
            console.log('=== DIGITAL status', digital.status, 'len', digital.body.length);
            // sidebar/menu: map serviceGbn codes to their visible label
            console.log('\n--- serviceGbn -> label ---');
            const seen=new Set();
            for(const m of digital.body.matchAll(/href="([^"]*onoff\.circle\?serviceGbn=([^"&]+)[^"]*)"[^>]*>([\s\S]*?)<\/a>/g)){
              const code=m[2]; if(seen.has(code))continue; seen.add(code);
              const label=m[3].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
              console.log('  '+code.padEnd(8)+' '+label);
            }
            for(const other of ['global','album','retail','social']){
              for(const m of digital.body.matchAll(new RegExp('href="([^"]*'+other+'\\.circle[^"]*)"[^>]*>([\\s\\S]*?)</a>','g'))){
                const label=m[2].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
                if(label){ console.log('  '+(other+'.circle').padEnd(16)+' '+label); break; }
              }
            }
            // dump the first tbody's first ~2 rows raw
            const tb = digital.body.slice(digital.body.indexOf('<tbody'));
            const rows = [...tb.matchAll(/<tr[\s\S]*?<\/tr>/g)].slice(0,2);
            console.log('\n--- first rows (raw, clipped) ---');
            rows.forEach((r,i)=>console.log('ROW'+i+': '+clip(r[0].replace(/\s+/g,' '),1400)));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
