name: Update Streams

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Force-refresh the 4 campaign tracks only (RapidAPI scraper keys, no catalog)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "Calling force refresh (tracks only)..."
          # Capture the status and, on failure, the body. `curl -sf` used to swallow
          # both: a non-2xx exited the step with nothing but a curl code, no status
          # and no message, and the summary below never ran — so the one case where
          # you most need to know what /api/streams said was the case that told you
          # nothing. The body is provider names, HTTP statuses and exception text
          # (RapidAPI keys travel in request headers and are never echoed back), and
          # the URL is never printed, so this stays safe in a public repo's logs.
          code=$(curl -sS -L --max-time 120 -o /tmp/resp.json -w '%{http_code}' \
            "https://blinksunited.com/api/streams?force=1&tracks_only=1&key=${ADMIN_KEY}") || code=000
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- response body (first 2000 chars) ---"
            head -c 2000 /tmp/resp.json; echo
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/resp.json'))
          dbg = d.get('_debug', {})
          print('live (fetched via scraper keys?):', dbg.get('live'))
          print('errors:', dbg.get('errors') or '(none)')
          for name in ('jump', 'shutdown', 'ddududu', 'go'):
              b = d.get(name) or {}
              prev = b.get('prev') or {}
              print(f"  {name:10} total={b.get('total')!s:>12}  prev.date={prev.get('date')}")
          PY
