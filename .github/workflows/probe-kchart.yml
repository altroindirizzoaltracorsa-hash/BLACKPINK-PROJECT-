name: Probe kchart source (read-only)

# Inspects a kchart chart page: pulls the Next.js __NEXT_DATA__ JSON, prints the
# chart-array structure, and checks whether BLACKPINK / member rows are present
# and filterable. Also tries the /_next/data/<buildId>/<path>.json endpoint.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Chart path'
        required: true
        default: '/chart/melon/realtime'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          BASE: 'https://xn--o39an51b2re.com'
          CPATH: ${{ github.event.inputs.path }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request
          UA = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko,en;q=0.9'}
          base=os.environ['BASE']; path=os.environ['CPATH']
          def get(u):
              req=urllib.request.Request(u, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.status, r.read()
          st, body = get(base+path)
          html = body.decode('utf-8','replace')
          print(f'GET {path} -> {st}  bytes={len(html)}')

          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
          if not m:
              print('NO __NEXT_DATA__ found');
          else:
              nd = json.loads(m.group(1))
              bid = nd.get('buildId')
              print('buildId:', bid)
              pp = (nd.get('props') or {}).get('pageProps') or {}
              print('pageProps keys:', list(pp.keys()))
              # Find the biggest list in pageProps — that's the chart rows
              def walk(o, p=''):
                  out=[]
                  if isinstance(o, list): out.append((p, len(o), o))
                  elif isinstance(o, dict):
                      for k,v in o.items(): out+=walk(v, p+'.'+k)
                  return out
              lists = sorted(walk(pp), key=lambda x:-x[1])
              for p_,n,arr in lists[:4]:
                  print(f'  list at {p_}: len={n}')
                  if n and isinstance(arr[0], dict):
                      print('    item keys:', list(arr[0].keys()))
                      print('    sample row:', json.dumps(arr[0], ensure_ascii=False)[:400])
              # BLACKPINK / member presence
              flat = json.dumps(pp, ensure_ascii=False).lower()
              print('--- artist presence in pageProps ---')
              for a in ['blackpink','블랙핑크','jisoo','지수','jennie','제니','rosé','rose','로제','lisa','리사','뷔','jennie ruby']:
                  c = flat.count(a.lower())
                  if c: print(f'  {a!r}: {c}')
              # try the next data json endpoint
              if bid:
                  ju = f"{base}/_next/data/{bid}{path}.json"
                  try:
                      s2,b2 = get(ju)
                      print(f'--- _next/data endpoint {s2} {len(b2)}b (clean JSON pull path) ---')
                      print('  ', ju)
                  except Exception as e:
                      print('  _next/data ->', e)
          PY
