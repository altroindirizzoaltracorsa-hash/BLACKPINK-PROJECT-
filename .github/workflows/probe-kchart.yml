name: Probe kchart source (read-only)

# Fetches a set of kchart pages, extracts the Next.js chart JSON, and prints only
# the BLACKPINK / member (Jisoo, Jennie, Rosé, Lisa) rows — proving the filter.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Comma-separated chart paths'
        required: true
        default: '/chart/melon/realtime,/chart/genie/realtime,/chart/circle/digital-weekly,/chart/youtube/track-weekly'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          BASE: 'https://xn--o39an51b2re.com'
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept-Language':'ko,en;q=0.9'}
          base=os.environ['BASE']; paths=[p.strip() for p in os.environ['PATHS'].split(',') if p.strip()]
          # BLACKPINK group + 4 members, EN + KR aliases
          TARGETS=['blackpink','블랙핑크','jisoo','지수','jennie','제니','rosé','rose','로제','lisa','리사']
          def get(u):
              req=urllib.request.Request(u, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r: return r.read()
          def artists_of(song):
              # collect any artist-name-ish strings in the song object
              names=[]
              for k in ('artists','artist','artistName','artistsName'):
                  v=song.get(k)
                  if isinstance(v,list):
                      for a in v:
                          if isinstance(a,dict): names+= [str(a.get(n)) for n in ('name','nameEn','fullName') if a.get(n)]
                          elif a: names.append(str(a))
                  elif isinstance(v,str): names.append(v)
              return [n for n in names if n]
          for path in paths:
              try:
                  html=get(base+path).decode('utf-8','replace')
              except Exception as e:
                  print(f'\n### {path}: FETCH ERR {e}'); continue
              m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', html, re.S)
              if not m: print(f'\n### {path}: no __NEXT_DATA__'); continue
              pp=json.loads(m.group(1)).get('props',{}).get('pageProps',{})
              # find the 100-row chart list
              rows=None
              for cand in (pp.get('data',{}) or {}).get('data',None), pp.get('data',None):
                  if isinstance(cand,list): rows=cand; break
              if rows is None:
                  # deep search
                  def find(o):
                      if isinstance(o,list) and o and isinstance(o[0],dict) and 'ranking' in o[0]: return o
                      if isinstance(o,dict):
                          for v in o.values():
                              r=find(v)
                              if r: return r
                      return None
                  rows=find(pp)
              print(f'\n### {path}  ({len(rows) if rows else 0} rows)')
              if not rows: continue
              hits=0
              for r in rows:
                  song=r.get('song') or {}
                  arts=artists_of(song)
                  blob=(' '.join(arts)+' '+json.dumps(song, ensure_ascii=False)).lower()
                  if any(t in blob for t in TARGETS):
                      hits+=1
                      print(f'  #{r.get("ranking"):>3} (prev {r.get("previous")}) {song.get("name")!r} — {", ".join(arts) or "?"}  like={r.get("like")}')
              if not hits: print('  (no BLACKPINK/member entries on this chart right now)')
          PY
