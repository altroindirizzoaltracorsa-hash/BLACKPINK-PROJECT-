name: Probe VMA statistics endpoint

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe voteapi.votenow.tv for BLACKPINK standings
        run: node .github/scripts/probe-vma-stats.mjs
