name: Backfill new-release badges

# Recovers per-user SaWaDiKa / CLICK / Fallen Angel / Heaven daily counts for PAST
# days from the finalized daily leaderboard_archive snapshots and writes them into
# user_daily_counts, so the badges "Today's Challenge" breakdown shows those songs
# for past days. Max-merge (only ever raises). Dry-run by default.

on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (preview only, write nothing)'
        type: boolean
        default: true
      from:
        description: 'Start day YYYY-MM-DD (default 2026-08-28, the EP release)'
        type: string
        default: '2026-08-28'
      to:
        description: 'End day YYYY-MM-DD (default: today)'
        type: string
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill new-release daily counts from archive
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          DRY: ${{ inputs.dry }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          url="https://blinksunited.com/api/leaderboard?action=backfill-newrelease&key=${ADMIN_KEY}"
          [ "$DRY" = "true" ] && url="${url}&dry=1"
          [ -n "$FROM" ] && url="${url}&from=${FROM}"
          [ -n "$TO" ] && url="${url}&to=${TO}"
          # URL carries the admin key, so never echo it. Body has no secrets.
          code=$(curl -sS -L -X POST --max-time 180 -o /tmp/resp.json -w '%{http_code}' "$url") || code=000
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "--- response body (first 2000 chars) ---"; head -c 2000 /tmp/resp.json; echo; exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/resp.json'))
          print('dry:', d.get('dry'), ' from:', d.get('from'), ' to:', d.get('to'))
          print('archives scanned:', d.get('archivesScanned'),
                ' days with data:', d.get('daysWithData'),
                ' rows wanted:', d.get('rowsWanted'),
                ' written:', d.get('written'))
          print(f"\n{'day':<12}{'users':>7}{'sawadika':>12}{'click':>10}{'fallenangel':>13}{'heaven':>9}")
          for r in (d.get('perDay') or []):
              print(f"{r['day']:<12}{r['users']:>7}{r['sawadika']:>12,}{r['click']:>10,}{r['fallenangel']:>13,}{r['heaven']:>9,}")
          PY
