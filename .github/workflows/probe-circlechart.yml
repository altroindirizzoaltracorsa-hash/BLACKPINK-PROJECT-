name: Probe circlechart.kr structure (read-only)

# Investigates the official Circle Chart site to learn how its charts are
# served (HTML table vs API vs Next.js JSON, and what URL params select the
# chart type + period), so we can pull them directly. Removed after.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect circlechart.kr
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36';
          async function get(u){
            const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),20000);
            try{ const r=await fetch(u,{headers:{'User-Agent':UA,'Accept-Language':'ko,en;q=0.9'},signal:ctrl.signal});
                 const body=await r.text(); return {status:r.status, ct:r.headers.get('content-type'), body}; }
            catch(e){ return {status:'ERR', ct:'', body:String(e.message)}; }
            finally{ clearTimeout(t); }
          }
          function summarize(tag,u,res){
            console.log('\n==== '+tag+' ====');
            console.log(u);
            console.log('status='+res.status+'  ct='+res.ct+'  len='+res.body.length);
            const b=res.body;
            console.log('has __NEXT_DATA__:', /id="__NEXT_DATA__"/.test(b));
            console.log('has <table:', /<table/i.test(b), ' <tbody:', /<tbody/i.test(b));
            console.log('mentions rank/순위:', /rank|순위/i.test(b));
            // chart-ish links
            const links=[...b.matchAll(/href="([^"]*(?:chart|circle|\.php)[^"]*)"/gi)].map(m=>m[1]);
            console.log('chart-ish links (first 25):'); [...new Set(links)].slice(0,25).forEach(l=>console.log('   '+l));
            // api/fetch hints
            const apis=[...b.matchAll(/(?:fetch|axios|url)\(?["'`]([^"'`]*(?:api|\.circle|chart)[^"'`]*)["'`]/gi)].map(m=>m[1]);
            console.log('api-ish refs (first 15):'); [...new Set(apis)].slice(0,15).forEach(l=>console.log('   '+l));
            // script srcs
            const scripts=[...b.matchAll(/<script[^>]+src="([^"]+)"/gi)].map(m=>m[1]);
            console.log('scripts (first 10):'); [...new Set(scripts)].slice(0,10).forEach(l=>console.log('   '+l));
          }
          (async()=>{
            const bases=['https://circlechart.kr','https://circlechart.kr/','https://www.circlechart.kr'];
            for(const u of bases){ const r=await get(u); if(r.status!=='ERR'){ summarize('HOME',u,r); break; } else console.log('home ERR',u,r.body); }
            // candidate legacy chart endpoints (Gaon/Circle style)
            const cands=[
              '/page_chart/onoff.circle?nationGbn=T&termGbn=week',
              '/page_chart/streaming.circle?nationGbn=T&termGbn=week',
              '/page_chart/download.circle?nationGbn=T&termGbn=week',
              '/page_chart/global.circle?termGbn=week',
              '/en/page_chart/onoff.circle?nationGbn=T&termGbn=week',
            ];
            for(const c of cands){ const r=await get('https://circlechart.kr'+c); summarize('CAND',('https://circlechart.kr'+c),r); await new Promise(z=>setTimeout(z,400)); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
