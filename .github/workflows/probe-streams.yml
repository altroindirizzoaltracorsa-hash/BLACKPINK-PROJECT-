name: Probe stream history

# Diagnostic (read-only): dump each campaign track's daily history + prev/live so
# we can spot duplicate/mislabeled/premature day entries. GETs the public
# /api/streams (a normal visitor read; no force, no writes).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump campaign-track history
        run: |
          curl -sS "https://www.blinksunited.com/api/streams" -o /tmp/s.json
          python3 - <<'PY'
          import json, datetime
          d=json.load(open('/tmp/s.json'))
          today=datetime.datetime.now(datetime.timezone.utc).strftime('%d/%m')
          print("UTC todayLabel:", today)
          def pdl(l):
              dd,mm=map(int,l.split('/')); return datetime.date(2026,mm,dd)
          for t in ('jump','shutdown','ddududu','go'):
              j=d.get(t)
              if not j: print(f"\n{t}: (missing)"); continue
              h=j.get('history') or []
              print(f"\n=== {t} === total={j.get('total')} prev={j.get('prev')} histlen={len(h)}")
              for e in h[-5:]: print("   ", e)
              # flags
              for a,b in zip(h,h[1:]):
                  if a.get('streams')==b.get('streams'):
                      print("   ⚠ DUP consecutive:", a, b)
              for e in h:
                  try:
                      if pdl(e['date']) >= pdl(today):
                          print("   ⚠ TODAY/FUTURE-dated entry:", e)
                  except Exception: pass
          PY
