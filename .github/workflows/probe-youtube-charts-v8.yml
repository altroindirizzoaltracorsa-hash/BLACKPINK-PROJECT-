name: Probe YouTube Charts v8

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe YouTube Charts v8
        run: node .github/scripts/probe-youtube-charts-v8.mjs
