name: Who Was At Risk (multi-account load)
# Read-only: counts how many leaderboard users use the multi-account badge-load
# path (2+ linked scrobblers, or a single non-Last.fm one) — the only path the
# badge-load freeze could affect. Also flags how many of those look stale
# (no successful update in >2 days), a weak hint they may have hit the hang.
on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Tally at-risk users
        run: |
          python3 - <<'PY'
          import json, subprocess, datetime
          BASE = "https://blinksunited.com/api/leaderboard"
          out = subprocess.run(["curl","-sS","-L",BASE], capture_output=True, text=True)
          try:
              users = json.loads(out.stdout).get("users", {})
          except Exception:
              print("Bad response:", out.stdout[:400]); raise SystemExit(1)

          def real_accounts(e):
              accts = e.get("linkedAccounts") or [{"type":"lastfm","username":e.get("username")}]
              real = []
              for a in accts:
                  src = (a.get("type") or a.get("source") or "").lower()
                  if src == "extension":
                      continue
                  real.append(src)
              return real

          total = len(users)
          multi = []          # 2+ real scrobblers
          single_nonlfm = []  # exactly 1 real, not lastfm
          for k, e in users.items():
              real = real_accounts(e)
              if len(real) >= 2:
                  multi.append((k, e))
              elif len(real) == 1 and real[0] != "lastfm":
                  single_nonlfm.append((k, e))

          at_risk = multi + single_nonlfm
          signed_in = [ (k,e) for k,e in at_risk if e.get("appUserId") ]

          # Stale = no update in >2 days (weak hint their loads may have been failing)
          now = datetime.datetime.now(datetime.timezone.utc)
          def days_since(ts):
              if not ts: return None
              try:
                  t = datetime.datetime.fromisoformat(str(ts).replace("Z","+00:00"))
                  return (now - t).total_seconds()/86400
              except Exception:
                  return None
          stale = [ (k,e) for k,e in at_risk
                    if (days_since(e.get("updatedAt")) or 0) > 2 ]

          print(f"total leaderboard users:            {total}")
          print(f"at-risk (multi-account path):       {len(at_risk)}")
          print(f"   • 2+ linked scrobblers:          {len(multi)}")
          print(f"   • single non-Last.fm scrobbler:  {len(single_nonlfm)}")
          print(f"of those, signed-in (appUserId):    {len(signed_in)}")
          print(f"of those, not updated in >2 days:   {len(stale)}  (weak 'maybe hit it' hint)")
          print()
          print("--- at-risk users (key · #accts · updatedAt) ---")
          for k, e in sorted(at_risk, key=lambda x: str(x[1].get('updatedAt') or ''), reverse=True):
              print(f"  {k:<24} {len(real_accounts(e))} accts   updated={e.get('updatedAt')}")
          PY
