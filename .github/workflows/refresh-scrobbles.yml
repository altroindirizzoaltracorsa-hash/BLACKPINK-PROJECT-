name: Refresh scrobbles

on:
  schedule:
    # ── THIS IS NO LONGER THE HOURLY REFRESH. ────────────────────────────────
    # It was, and it did not run hourly. GitHub delays and DROPS scheduled runs
    # under load, and on this repo it dropped most of them: 24 scheduled runs a
    # day actually fired five or six, at unpredictable times, with an 8-hour
    # hole on 13 Nov (10:05 → 18:09 UTC) and nothing at all between 02:10 and
    # 05:32. One run reaches ~90 of ~200 accounts before its time budget, so a
    # full sweep needs two or three back to back — which at five runs a day
    # means an account is refreshed perhaps twice, at no particular hour. That
    # is why somebody who streamed saw 0 on the board: no run had reached them
    # between the reset and when they looked, and their archived day froze that
    # way.
    #
    # The hourly job is a VERCEL cron now (vercel.json, '50 * * * *'), which
    # fires when it says it will. What is left here is a BACKSTOP, for the case
    # the Vercel cron is removed or silently stops: four spread slots a day, so
    # the board can never go a whole day unrefreshed without anybody noticing.
    # Minutes are deliberately not :00 or :30 — see the note in
    # fetch-catalog.yml about the top-of-the-hour queue.
    #
    # Overlap is safe now: the endpoint takes a Redis NX lock and a second
    # caller is turned away rather than clobbering the first.
    - cron: '23 4 * * *'
    - cron: '41 10 * * *'
    - cron: '17 16 * * *'
    # Final end-of-day sweep, 2 minutes before the reset, so the day frozen
    # into the archive is as complete as it can be.
    #
    # THE RESET IS 00:00 UTC. getDayBounds() anchors to UTC midnight and has
    # since the DST fix; this block still described it as "1:58am Italy" and
    # scheduled BOTH DST candidates to chase a local hour that the code does
    # not use. That is the bug CLAUDE.md warns is always coming back by a new
    # route — here it had survived in a comment, and the winter slot it
    # justified fires 58 minutes AFTER the day it was meant to close.
    # One slot, in UTC, because there is one boundary.
    - cron: '58 23 * * *'
  workflow_dispatch:          # also runnable manually from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          set -e
          # --location-trusted: VERCEL_URL may point at an old domain that now
          # 307-redirects to the current one (e.g. after a custom-domain
          # migration) — without following, curl "succeeds" on the redirect
          # stub and never reaches the real endpoint. Safe to keep the
          # Authorization header across the redirect here since both ends are
          # our own infrastructure.
          http_code=$(curl -s -L --location-trusted -o response.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_URL }}/api/cron-scrobbles")
          echo "HTTP $http_code"
          echo "--- response body ---"
          cat response.json
          echo ""
          # ── A NON-JSON BODY IS ITS OWN FAILURE, SAID ONCE ────────────────
          #
          # A 504 FUNCTION_INVOCATION_TIMEOUT is an HTML-ish error page, and
          # every jq below then prints "parse error: Invalid numeric literal"
          # — seven identical lines that say nothing about what happened. Run
          # 44723785222 failed exactly that way. Name it instead, and stop:
          # there are no counts to summarise, and a timeout means the run was
          # killed mid-write, so the lock is still held and the next scheduled
          # run will be turned away until CRON_LOCK_TTL_S expires.
          if ! jq -e . response.json >/dev/null 2>&1; then
            echo "::error title=The endpoint did not return JSON::HTTP $http_code with a non-JSON body (see above). If it is FUNCTION_INVOCATION_TIMEOUT the run exceeded Vercel's 300s wall: lower SCROBBLE_RUN_BUDGET_MS (the loop budget does NOT cover the archive/upsert tail) and expect the Redis lock to block the next run until it expires."
            exit 1
          fi
          echo "--- summary ---"
          jq -r '"refreshed: \(.refreshed | length) · failed: \(.failed | length) · dead (skipped): \(.dead // [] | length) · unverified (skipped): \(.unverified | length) · merged duplicates: \(.merged | length)"' response.json || true
          jq -r '"last.fm calls: \(.lastfmCalls // "?") · rate-limited: \(.rateLimited // 0) · took: \(.tookMs // "?")ms · started from: \(.startedFrom // "top") · stopped at: \(.stoppedAt // "finished")"' response.json || true
          jq -r '.failed[]? | "  FAILED: \(.username) — \(.error)"' response.json || true
          jq -r '.merged[]? | "  MERGED (dropped stale duplicate): \(.)"' response.json || true
          # Printed every run on purpose. A skip list that nobody ever reads is
          # how a real blink who renamed their Last.fm quietly stops counting.
          jq -r '.dead[]? | "  SKIPPED (Last.fm has no such account): \(.)"' response.json || true
          # ── TITLES LAST.FM HAS NO PAGE FOR ────────────────────────────────
          #
          # A WARNING, NOT A FAILURE, and the distinction is the whole point.
          # Last.fm creates a track's page on its first scrobble anywhere, so
          # on a release day track.getInfo answers error 6 for a song thousands
          # of people are playing. That used to THROW and fail the whole user:
          # adding "Sun Showers" to TRACKS failed 46 of 51 accounts in one run,
          # every one of them "error 6: Track not found". It is now treated as
          # 0 plays, which is the honest answer for a track with no page.
          #
          # But error 6 is ALSO what a misspelled entry in TRACKS returns, and
          # that reads 0 forever while the day and week counts stay correct —
          # the "Someone to Hold" failure. So the titles are printed every run.
          # A title here on a release day clears itself; a title STILL here a
          # day later is our spelling being wrong.
          jq -r '.missingTracks[]? | "  NO LAST.FM PAGE (counted as 0 all-time): \(.)"' response.json || true
          # Same account linked twice on one row under two spellings. Printed,
          # not errored: it is a tidy-up on somebody's profile, not a failure,
          # and a red run nobody can act on is a red run nobody reads.
          jq -r '.duplicateAccounts[]? | "  DUPLICATE ACCOUNT (counted once): \(.)"' response.json || true
          miss=$(jq -r '.missingTracks // [] | length' response.json)
          if [ "$miss" -gt 0 ]; then
            echo "::warning title=Titles with no Last.fm page::$miss title(s) answered \"Track not found\" — normal within hours of a release, and OUR spelling being wrong if it persists past a day. See the NO LAST.FM PAGE lines above."
          fi
          if [ "$http_code" -ge 400 ]; then exit 1; fi

          # ── THE RUN HAS TO GO RED WHEN THE BOARD STOPS UPDATING ──────────
          #
          # It did not, and that is why the scrobble outage of early November
          # 2026 lasted days: the endpoint answers 200 with ok:true whatever
          # happens to the individual users, so a run that refreshed 46 of 201
          # and rate-limited the other 155 was indistinguishable, in the Actions
          # list, from a perfect one. A list of FAILED lines printed into a log
          # nobody opens is not an alert.
          #
          # Any rate limiting at all is a real signal — the request budget is
          # supposed to be under the ceiling now, so a 29 means it is not.
          rl=$(jq -r '.rateLimited // 0' response.json)
          refreshed=$(jq -r '.refreshed | length' response.json)
          failed=$(jq -r '.failed | length' response.json)
          if [ "$rl" -gt 0 ]; then
            echo "::error title=Last.fm rate limit::$rl user(s) hit error 29 — the refresh is over the shared key's budget again. Lower LASTFM_RATE_PER_SEC or cut calls per user; while this persists the board silently freezes for everyone past the cut-off."
            exit 1
          fi
          # A 404/403 on a renamed or now-private account is nobody's bug and
          # always a few. A majority failing is never normal.
          #
          # `dead` is NOT counted on either side. Those names were not attempted
          # this run, so putting them in the denominator would dilute the ratio
          # this guard exists to watch, and putting them in the numerator would
          # turn a tidy-up into a permanent red run.
          total=$((refreshed + failed))
          if [ "$total" -gt 0 ] && [ "$((failed * 2))" -gt "$total" ]; then
            echo "::error title=Most users failed to refresh::$failed of $total failed. Their rows keep their last-known numbers, so the board looks healthy while it is frozen."
            exit 1
          fi
