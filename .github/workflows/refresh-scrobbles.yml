name: Refresh scrobbles

on:
  schedule:
    # :55 instead of :00 — Italy's UTC offset is always a whole number of hours,
    # so this lands 5 minutes before every hour boundary, including whichever
    # one is that day's 2am-Italy reset. Avoids losing up to ~59 minutes of
    # streams right before reset that no later run would ever look back for.
    - cron: '55 * * * *'   # every hour, 5 min before the top of the hour
    # Final end-of-day sweep ~2 min before the 2am-Italy reset, so the day we
    # freeze into the archive is as complete as possible (the plain :55 run lands
    # a whole ~7 min earlier, at 1:55am summer). Cron can't do timezones and Italy
    # shifts with DST, so we schedule both candidates: in summer (UTC+2) the reset
    # is 00:00 UTC and 23:58 is 1:58am Italy; in winter (UTC+1) the reset is 01:00
    # UTC and 00:58 is 1:58am Italy. The off-season one just lands as a harmless
    # extra refresh well after reset — the hourly :55 already runs anyway.
    - cron: '58 23 * * *'  # 1:58am Italy in summer (UTC+2)
    - cron: '58 0 * * *'   # 1:58am Italy in winter (UTC+1)
  workflow_dispatch:          # also runnable manually from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          set -e
          # --location-trusted: VERCEL_URL may point at an old domain that now
          # 307-redirects to the current one (e.g. after a custom-domain
          # migration) — without following, curl "succeeds" on the redirect
          # stub and never reaches the real endpoint. Safe to keep the
          # Authorization header across the redirect here since both ends are
          # our own infrastructure.
          http_code=$(curl -s -L --location-trusted -o response.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_URL }}/api/cron-scrobbles")
          echo "HTTP $http_code"
          echo "--- response body ---"
          cat response.json
          echo ""
          echo "--- summary ---"
          jq -r '"refreshed: \(.refreshed | length) · failed: \(.failed | length) · unverified (skipped): \(.unverified | length) · merged duplicates: \(.merged | length)"' response.json || true
          jq -r '"last.fm calls: \(.lastfmCalls // "?") · rate-limited: \(.rateLimited // 0) · took: \(.tookMs // "?")ms · started from: \(.startedFrom // "top") · stopped at: \(.stoppedAt // "finished")"' response.json || true
          jq -r '.failed[]? | "  FAILED: \(.username) — \(.error)"' response.json || true
          jq -r '.merged[]? | "  MERGED (dropped stale duplicate): \(.)"' response.json || true
          if [ "$http_code" -ge 400 ]; then exit 1; fi

          # ── THE RUN HAS TO GO RED WHEN THE BOARD STOPS UPDATING ──────────
          #
          # It did not, and that is why the scrobble outage of early November
          # 2026 lasted days: the endpoint answers 200 with ok:true whatever
          # happens to the individual users, so a run that refreshed 46 of 201
          # and rate-limited the other 155 was indistinguishable, in the Actions
          # list, from a perfect one. A list of FAILED lines printed into a log
          # nobody opens is not an alert.
          #
          # Any rate limiting at all is a real signal — the request budget is
          # supposed to be under the ceiling now, so a 29 means it is not.
          rl=$(jq -r '.rateLimited // 0' response.json)
          refreshed=$(jq -r '.refreshed | length' response.json)
          failed=$(jq -r '.failed | length' response.json)
          if [ "$rl" -gt 0 ]; then
            echo "::error title=Last.fm rate limit::$rl user(s) hit error 29 — the refresh is over the shared key's budget again. Lower LASTFM_RATE_PER_SEC or cut calls per user; while this persists the board silently freezes for everyone past the cut-off."
            exit 1
          fi
          # A 404/403 on a renamed or now-private account is nobody's bug and
          # always a few. A majority failing is never normal.
          total=$((refreshed + failed))
          if [ "$total" -gt 0 ] && [ "$((failed * 2))" -gt "$total" ]; then
            echo "::error title=Most users failed to refresh::$failed of $total failed. Their rows keep their last-known numbers, so the board looks healthy while it is frozen."
            exit 1
          fi
