name: Probe YouTube Charts v24

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe v24 (proto params + global region for daily chart)
        run: node .github/scripts/probe-youtube-charts-v24.mjs
