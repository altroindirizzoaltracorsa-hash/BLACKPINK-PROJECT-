name: Probe kworb girl-group totals

# Read-only. Dumps the structure of a kworb page so a parser can be written
# against what is actually there. The existing fetchCatalogViaKworb() in
# api/streams.js is BLACKPINK-shaped — its heuristics hard-code ">= 10 billion",
# which no other girl group's catalogue reaches — so a shared page needs its own
# parse of the per-track table rather than that cascade.
#
# Dispatch-only, no secrets. Safe to delete once the parser exists.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated Spotify artist ids (blank = the seven groups).'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the page structure
        env:
          IDS: ${{ inputs.ids != '' && inputs.ids || '41MozSoPIsD1dJM0CLPjZF,7n2Ycct7Beij7Dj7meI4X0,4SpbR6yFEvexJuaBpgAU5p,36cgvBn0aadzOijnjjwqMN,630wzNP2OL7fl4Xl0GnMWq,6HvZYsbFfjnjFrWF950C9d,6YVMFz59CuY7ngCxTxjpxE' }}
        run: |
          set -u
          printf '%-24s %-14s %16s %14s %8s\n' ID ARTIST 'STREAMS(total)' 'DAILY(total)' TRACKS
          for id in ${IDS//,/ }; do
            url="https://kworb.net/spotify/artist/${id}_songs.html"
            code=$(curl -sS -L --max-time 60 -A 'Mozilla/5.0' -o /tmp/p.html -w '%{http_code}' "$url") || code=000
            if [ "$code" != "200" ]; then printf '%-24s HTTP %s\n' "$id" "$code"; continue; fi
            ID="$id" python3 - <<'PY'
          import os, re
          h = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          title = re.search(r'<title>(.*?)</title>', h, re.S | re.I)
          name = title.group(1).replace(' - Spotify Top Songs', '').strip() if title else '?'
          def cells(r):
              return [re.sub(r'\s+', ' ', re.sub(r'<[^>]*>', '', c)).strip()
                      for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S | re.I)]
          rows = [cells(r) for r in re.findall(r'<tr[^>]*>(.*?)</tr>', h, re.S | re.I)]
          def summary(label):
              for c in rows:
                  if c and c[0] == label and len(c) > 1:
                      return c[1]
              return '—'
          print('%-24s %-14s %16s %14s %8s' % (os.environ['ID'], name[:14],
                summary('Streams'), summary('Daily'), summary('Tracks')))
          PY
          done
