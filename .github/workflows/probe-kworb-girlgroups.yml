name: Probe kworb girl-group totals

# Read-only. Dumps the structure of a kworb page so a parser can be written
# against what is actually there. The existing fetchCatalogViaKworb() in
# api/streams.js is BLACKPINK-shaped — its heuristics hard-code ">= 10 billion",
# which no other girl group's catalogue reaches — so a shared page needs its own
# parse of the per-track table rather than that cascade.
#
# Dispatch-only, no secrets. Safe to delete once the parser exists.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'kworb page to inspect'
        required: false
        default: 'https://kworb.net/spotify/artist/6RHTUrRF63xao58xh9FXYJ_songs.html'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the page structure
        env:
          URL: ${{ inputs.url != '' && inputs.url || 'https://kworb.net/spotify/artist/6RHTUrRF63xao58xh9FXYJ_songs.html' }}
        run: |
          set -u
          code=$(curl -sS -L --max-time 60 -A 'Mozilla/5.0' -o /tmp/p.html -w '%{http_code}' "$URL") || code=000
          echo "HTTP $code   bytes $(wc -c < /tmp/p.html 2>/dev/null || echo 0)"
          [ "$code" = "200" ] || { head -c 300 /tmp/p.html; exit 1; }

          echo; echo "── who is this? ──"
          grep -oiE "<title>[^<]*</title>|<h1[^>]*>[^<]*</h1>" /tmp/p.html | head -3

          echo; echo "── table headers ──"
          grep -oiE "<th[^>]*>[^<]*</th>" /tmp/p.html | sed 's/<[^>]*>//g' | head -12

          echo; echo "── first 5 data rows (tags stripped) ──"
          python3 - <<'PY'
          import re
          h = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          rows = re.findall(r'<tr[^>]*>(.*?)</tr>', h, re.S | re.I)
          print(f'   {len(rows)} <tr> rows found')
          def cells(r):
              return [re.sub(r'\s+', ' ', re.sub(r'<[^>]*>', '', c)).strip()
                      for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S | re.I)]
          for r in rows[:5]:
              print('   ', cells(r))
          print('   … last 3 rows (a Total row would live here):')
          for r in rows[-3:]:
              print('   ', cells(r))
          PY
          echo; echo "── any explicit Total/Sum label ──"
          grep -oiE "(total|sum)[^<]{0,50}" /tmp/p.html | head -6
