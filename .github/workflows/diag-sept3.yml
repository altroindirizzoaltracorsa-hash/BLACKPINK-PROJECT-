name: Diag Sept 3 streams

# Read-only: dump JISOO/LISA artist_daily_stats + CLICK/SaWaDiKa track rows so we
# can see how the new releases landed on the Sep 3 snapshot. Writes nothing.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dump rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python .github/scripts/diag_sept3.py
