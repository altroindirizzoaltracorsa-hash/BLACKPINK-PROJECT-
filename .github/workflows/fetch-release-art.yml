name: Fetch release art

# Pull an official cover/artwork into the repo from a URL, and commit it.
#
# WHY A WORKFLOW. Claude Code sessions cannot reach most third-party hosts —
# the egress proxy answers 403 — but a GitHub runner can. Artwork for a new
# release lives on the distributor's CDN (imagestore.ffm.to, i.ffmcdn.com,
# Spotify's i.scdn.co…), so this is the same arrangement as probe-page.yml:
# the runner fetches, the session reads the result.
#
# It REFUSES TO COMMIT ANYTHING THAT IS NOT AN IMAGE. A CDN that wants a
# browser answers a bare curl with an HTML error page and HTTP 200, and that
# would otherwise land in the repo as a .jpg which renders as a broken icon
# on every card that points at it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Absolute https URL of the image'
        required: true
      path:
        description: 'Where to save it, repo-relative (e.g. steps/someone-to-hold-cover.jpg)'
        required: true
      commit:
        description: 'Set to 1 to commit it. Blank = fetch and report only.'
        required: false
        default: ''
      width:
        description: 'Resize to this width in px before saving (blank = keep original). Never upscales.'
        required: false
        default: ''
      webp:
        description: 'Set to 1 to encode as WebP. The path should end .webp.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify
        env:
          URL: ${{ github.event.inputs.url }}
          DEST: ${{ github.event.inputs.path }}
        run: |
          set -eu
          case "$URL" in https://*) ;; *) echo "::error::url must be https"; exit 1 ;; esac
          # No path traversal, and nothing outside the repo.
          case "$DEST" in /*|*..*) echo "::error::path must be repo-relative with no .."; exit 1 ;; esac
          mkdir -p "$(dirname "$DEST")"
          code=$(curl -sSL --max-time 60 -o "$DEST" -w '%{http_code}' \
                 -H 'User-Agent: Mozilla/5.0 (blinksunited release-art fetcher)' "$URL")
          echo "HTTP $code · $(wc -c <"$DEST") bytes"
          [ "$code" = "200" ] || { echo "::error::expected 200, got $code"; exit 1; }
          # file(1) on the bytes, not the extension — this is the check that
          # stops an HTML error page being committed as artwork.
          kind=$(file -b --mime-type "$DEST")
          echo "::notice title=art::$DEST is $kind, $(wc -c <"$DEST") bytes"
          case "$kind" in
            image/*) ;;
            *) echo "::error::not an image: $kind"; head -c 300 "$DEST"; exit 1 ;;
          esac
          # No `identify` here on purpose — ImageMagick is NOT on the runner
          # image, so this used to be a `command -v` guard that silently
          # skipped and reported no dimensions at all. Sizes are reported by
          # the encode step below, which installs it.
      - name: Resize and encode
        if: ${{ github.event.inputs.width != '' || github.event.inputs.webp == '1' }}
        env:
          DEST: ${{ github.event.inputs.path }}
          W: ${{ github.event.inputs.width }}
          WEBP: ${{ github.event.inputs.webp }}
        run: |
          set -eu
          # ubuntu-latest ships NEITHER convert NOR identify. Install it, and
          # take whichever name is present: ImageMagick 7 renamed `convert` to
          # `magick` and the old name is going away.
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          ID=$(command -v identify || echo "$IM identify")
          echo "using $IM"
          before=$(wc -c <"$DEST")
          echo "::notice title=art::source $($ID -format '%wx%h' "$DEST")"
          # '>' means never upscale: a source smaller than the target is left
          # alone rather than blown up into a soft version of itself.
          args=""
          [ -n "$W" ] && args="-resize ${W}x>"
          if [ "$WEBP" = "1" ]; then
            $IM "$DEST" $args -quality 82 -define webp:method=6 "$DEST.tmp.webp"
            mv "$DEST.tmp.webp" "$DEST"
          else
            $IM "$DEST" $args "$DEST.tmp"; mv "$DEST.tmp" "$DEST"
          fi
          kind=$(file -b --mime-type "$DEST")
          case "$kind" in image/*) ;; *) echo "::error::encode produced $kind"; exit 1 ;; esac
          echo "::notice title=art::encoded $($ID -format '%wx%h' "$DEST") $kind · $before -> $(wc -c <"$DEST") bytes"
      - name: Commit
        if: ${{ github.event.inputs.commit == '1' }}
        env:
          DEST: ${{ github.event.inputs.path }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "art: add $DEST [skip ci]"
          git push
