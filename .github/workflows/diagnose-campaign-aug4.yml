name: Diagnose campaign Aug4

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Dump campaign track history + debug from live /api/streams
        run: python .github/scripts/diagnose-campaign-aug4.py
