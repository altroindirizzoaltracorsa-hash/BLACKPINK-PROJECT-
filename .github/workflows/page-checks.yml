name: Page checks

# The browser checks that guard things which are invisible on the page itself:
# a project filed under the wrong heading or linking somewhere that 404s, a
# country label that disagrees between the picker and the chart tables, and the
# iTunes peak column silently reading "—" on every row.
#
# Deliberately NOT triggered by data/**. The chore jobs commit chart data many
# times a day and none of it can break these; running on code is what catches
# regressions. Use the manual run to check against a day's fresh data.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-spotify-artists.yml'
      - '.github/scripts/test_canary_dispatch.sh'
      - 'index.html'
      - 'projects.html'
      - 'awards.html'
      - 'collabs.html'
      - 'api/collabs.js'
      - 'vote-extension/**'
      - 'android-app/app/src/main/**'
      - 'vmas.html'
      - 'breaktudo.html'
      - 'achievements.html'
      - 'middleware.js'
      - 'vercel.json'
      - '.github/scripts/test_*.mjs'
      - '.github/scripts/_playwright.mjs'
      - '.github/workflows/page-checks.yml'
  pull_request:
    paths:
      - '.github/workflows/fetch-spotify-artists.yml'
      - '.github/scripts/test_canary_dispatch.sh'
      - 'index.html'
      - 'projects.html'
      - 'awards.html'
      - 'collabs.html'
      - 'api/collabs.js'
      - 'vote-extension/**'
      - 'android-app/app/src/main/**'
      - 'vmas.html'
      - 'breaktudo.html'
      - 'achievements.html'
      - 'middleware.js'
      - 'vercel.json'
      - '.github/scripts/test_*.mjs'
      - '.github/scripts/_playwright.mjs'
      - '.github/workflows/page-checks.yml'
  workflow_dispatch:

# A later push supersedes an in-flight run of the same ref; nothing here writes
# anything, so cancelling one is free.
concurrency:
  group: page-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the version these tests were written and verified against
      # (the same one the Claude Code container ships), so the browser under
      # them cannot change without a commit. No cache: `npm install playwright`
      # fetches the browser in its own postinstall, which would run BEFORE a
      # restore step and make the cache pointless — and the whole install is
      # under a minute on a workflow that only fires on code changes.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Each runs regardless of the ones before it: three separate reports beat
      # one that stops at the first failure. The job still fails if any did.
      - name: The project board
        if: always()
        run: node .github/scripts/test_projects_page.mjs

      - name: Country labels
        if: always()
        run: node .github/scripts/test_country_labels.mjs

      - name: The iTunes peak column
        if: always()
        run: node .github/scripts/test_itunes_peaks.mjs

      - name: The front door
        if: always()
        run: node .github/scripts/test_awards_page.mjs

      - name: Fandom collabs
        if: always()
        run: node .github/scripts/test_collabs_page.mjs

      - name: The collab board endpoint
        if: always()
        run: node .github/scripts/test_collabs_api.mjs

      # Three files carry the same ballot slugs. Drift between them does not
      # throw — it silently counts nothing, and reads on the page exactly like
      # an honest empty board.
      - name: Collab slugs agree across the site, the API and the counter
        if: always()
        run: node .github/scripts/test_collab_slugs.mjs

      # The anonymous name a new account is given follows the fandom it says it
      # is. The rule that matters is the dangerous one: rename a name the site
      # issued, never a name somebody chose for themselves.
      - name: Auto display names follow the fandom
        if: always()
        run: node .github/scripts/test_fandom_names.mjs

      # Supabase stopped auto-granting Data API access to new public tables on
      # 2026-10-30, so a migration now has to say who may reach its table. The
      # failure is a permission-denied on a recreate, months later.
      - name: Every table a migration creates says who may reach it
        if: always()
        run: node .github/scripts/test_sql_grants.mjs

      # Two EP groups share the leaderboard tab row; pointing both at one
      # nested row shows the wrong tracks under a lit tab, silently.
      - name: The leaderboard EP tabs
        if: always()
        run: node .github/scripts/test_leaderboard_ep_tabs.mjs

      # A release reaches the page through about ten separate lists. Wire it
      # into some and not the rest and nothing throws: the card shows
      # `undefined` plays, or the board reads zero because the posted payload
      # had no field to carry the number. The PRESS PLAY EP shipped that way.
      - name: Every track is wired all the way through
        if: always()
        run: node .github/scripts/test_track_wiring.mjs

      # The canary hands its refresh to the chunked sweep. Every way that
      # handover breaks is quiet — above all a refused dispatch passing as
      # success, which looks just like a canary that found nothing to do.
      - name: The canary dispatches the chunked sweep
        if: always()
        run: bash .github/scripts/test_canary_dispatch.sh

      # Spotify publishes its daily charts in arrears, so a row stamped with
      # the fetch date is dated one to two days ahead of the data in it.
      - name: Chart rows carry the chart's own date
        if: always()
        run: node .github/scripts/test_chart_dates.mjs

      # A video can carry a 24h mark and still never be recorded, in which case
      # the pin is silently never taken — nothing errors, the figure is just
      # gone. Tarantino lost its 24h number exactly that way.
      - name: Every marked video is actually recorded
        if: always()
        run: node .github/scripts/test_youtube_marks.mjs

      # Spotify files a pre-release single under its own album name, so the
      # BY ALBUM view showed the same record twice and the EP's total was
      # missing the track carrying most of its streams.
      - name: Albums group by record, not by sleeve
        if: always()
        run: node .github/scripts/test_album_grouping.mjs

      # The daily challenge folds each EP behind one tile. Three ways that goes
      # wrong without throwing: a track shown both inside the EP and loose, a
      # summary that is not the sum of what opening it reveals, and a body
      # clipped by its max-height so the last track cannot be reached at all.
      - name: The collapsible EP cards on My Badges
        if: always()
        run: node .github/scripts/test_badges_ep_cards.mjs

      # Every countdown prints its time on the reader's own clock, cross-checked
      # against the foreign-zone label each card already hand-types.
      - name: Local times on every countdown
        if: always()
        run: node .github/scripts/test_local_times.mjs

      # The share card's picture picker: one shared element that every release
      # rebuilds, checked on the canvas pixels rather than the state behind it.
      - name: The PRESS PLAY share picker
        if: always()
        run: node .github/scripts/test_pressplay_share.mjs

      # Each countdown's picture strip: the files load, the dots match, and
      # they stay on the release's own page rather than the home carousel.
      - name: The countdown picture strips
        if: always()
        run: node .github/scripts/test_countdown_strips.mjs

      # One card carries a release that lands at midnight in each country and a
      # video that premieres at one instant worldwide. Both wrong silently: a
      # clock that looks healthy and is thirteen hours out for Seoul.
      - name: Release timing, local and global
        if: always()
        run: node .github/scripts/test_release_timing.mjs

      # The countdowns are a carousel now, and everything that can go wrong
      # with one is invisible in a screenshot: dots that drift from the slide
      # you are on, controls left over after a filter hides every card but one,
      # and a swipe that opens the countdown it was scrolling past.
      - name: The countdown carousel
        if: always()
        run: node .github/scripts/test_countdown_carousel.mjs

      # A release touches two manifests, two zips and two pages. The quiet
      # failure is a page still advertising the old version, which on a
      # blink's board looks like "my votes aren't counting".
      - name: The extension release is consistent
        if: always()
        run: node .github/scripts/test_extension_release.mjs
