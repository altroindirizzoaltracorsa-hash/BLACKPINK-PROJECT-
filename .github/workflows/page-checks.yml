name: Page checks

# The browser checks that guard things which are invisible on the page itself:
# a project filed under the wrong heading or linking somewhere that 404s, a
# country label that disagrees between the picker and the chart tables, and the
# iTunes peak column silently reading "—" on every row.
#
# Deliberately NOT triggered by data/**. The chore jobs commit chart data many
# times a day and none of it can break these; running on code is what catches
# regressions. Use the manual run to check against a day's fresh data.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-spotify-artists.yml'
      - '.github/scripts/test_canary_dispatch.sh'
      - 'index.html'
      - 'projects.html'
      - 'awards.html'
      - 'collabs.html'
      - 'api/collabs.js'
      - 'api/leaderboard.js'
      - 'api/youtube-history.js'
      - 'vs.html'
      - 'mama-guide.html'
      - 'api/proxy-image.js'
      - 'addicted/**'
      - 'vendor/three/**'
      - 'vote-extension/**'
      - 'android-app/app/src/main/**'
      - 'vmas.html'
      - 'breaktudo.html'
      - 'achievements.html'
      - 'middleware.js'
      - 'vercel.json'
      - '.github/scripts/test_*.mjs'
      - '.github/scripts/_playwright.mjs'
      - '.github/workflows/page-checks.yml'
  pull_request:
    paths:
      - '.github/workflows/fetch-spotify-artists.yml'
      - '.github/scripts/test_canary_dispatch.sh'
      - 'index.html'
      - 'projects.html'
      - 'awards.html'
      - 'collabs.html'
      - 'api/collabs.js'
      - 'api/leaderboard.js'
      - 'api/youtube-history.js'
      - 'vs.html'
      - 'mama-guide.html'
      - 'api/proxy-image.js'
      - 'addicted/**'
      - 'vendor/three/**'
      - 'vote-extension/**'
      - 'android-app/app/src/main/**'
      - 'vmas.html'
      - 'breaktudo.html'
      - 'achievements.html'
      - 'middleware.js'
      - 'vercel.json'
      - '.github/scripts/test_*.mjs'
      - '.github/scripts/_playwright.mjs'
      - '.github/workflows/page-checks.yml'
  workflow_dispatch:

# A later push supersedes an in-flight run of the same ref; nothing here writes
# anything, so cancelling one is free.
concurrency:
  group: page-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned to the version these tests were written and verified against
      # (the same one the Claude Code container ships), so the browser under
      # them cannot change without a commit. No cache: `npm install playwright`
      # fetches the browser in its own postinstall, which would run BEFORE a
      # restore step and make the cache pointless — and the whole install is
      # under a minute on a workflow that only fires on code changes.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # FIRST, because it is about the steps below rather than about the site.
      # A browser test that resolves Playwright by the session's absolute path
      # dies on a runner with ERR_MODULE_NOT_FOUND before its first assertion —
      # correct test, zero checks run, red step. test_mama_votes.mjs did that
      # the day it was wired in here. This reads the workflow and refuses any
      # script it runs that cannot start.
      - name: Every check CI runs can actually start
        if: always()
        run: node .github/scripts/test_ci_can_start.mjs

      # Each runs regardless of the ones before it: three separate reports beat
      # one that stops at the first failure. The job still fails if any did.
      - name: The project board
        if: always()
        run: node .github/scripts/test_projects_page.mjs

      - name: Country labels
        if: always()
        run: node .github/scripts/test_country_labels.mjs

      - name: The iTunes peak column
        if: always()
        run: node .github/scripts/test_itunes_peaks.mjs

      - name: The front door
        if: always()
        run: node .github/scripts/test_awards_page.mjs

      - name: Fandom collabs
        if: always()
        run: node .github/scripts/test_collabs_page.mjs

      - name: The collab board endpoint
        if: always()
        run: node .github/scripts/test_collabs_api.mjs

      # Three files carry the same ballot slugs. Drift between them does not
      # throw — it silently counts nothing, and reads on the page exactly like
      # an honest empty board.
      - name: Collab slugs agree across the site, the API and the counter
        if: always()
        run: node .github/scripts/test_collab_slugs.mjs

      # The anonymous name a new account is given follows the fandom it says it
      # is. The rule that matters is the dangerous one: rename a name the site
      # issued, never a name somebody chose for themselves.
      - name: Auto display names follow the fandom
        if: always()
        run: node .github/scripts/test_fandom_names.mjs

      # Supabase stopped auto-granting Data API access to new public tables on
      # 2026-10-30, so a migration now has to say who may reach its table. The
      # failure is a permission-denied on a recreate, months later.
      - name: Every table a migration creates says who may reach it
        if: always()
        run: node .github/scripts/test_sql_grants.mjs

      # Two EP groups share the leaderboard tab row; pointing both at one
      # nested row shows the wrong tracks under a lit tab, silently.
      - name: The leaderboard EP tabs
        if: always()
        run: node .github/scripts/test_leaderboard_ep_tabs.mjs

      # A release reaches the page through about ten separate lists. Wire it
      # into some and not the rest and nothing throws: the card shows
      # `undefined` plays, or the board reads zero because the posted payload
      # had no field to carry the number. The PRESS PLAY EP shipped that way.
      - name: Every track is wired all the way through
        if: always()
        run: node .github/scripts/test_track_wiring.mjs

      # The community goal's daily total is added up in three places — the bar,
      # the nightly recompute and the live read — and ADDICTED reached two of
      # them. Nothing failed: each copy is valid, each returns a plausible
      # number, and they differ by one song. Measured against
      # CAMPAIGN_TOTAL_IDS, which is where the site declares what counts, so
      # three copies agreeing on the wrong set still fails.
      - name: The community goal counts the same tracks everywhere
        if: always()
        run: node .github/scripts/test_community_goal_ids.mjs

      # A campaign can be registered with no goals and a mount that does not
      # exist, and nothing throws — the renderer returns early on both. PRESS
      # PLAY sat like that while the admin picker said "no goals yet".
      # A countdown slug lives in three places and two of them fail silently:
      # no preview entry, or no matcher line, and a shared link falls back to
      # the generic site preview with nothing erroring.
      - name: Countdown slugs are wired in all three places
        if: always()
        run: node .github/scripts/test_countdown_slugs.mjs

      # The ADDICTED card carries jisoo.io's art and moves the way that site
      # does. Every way it breaks still looks finished in a screenshot: the
      # bolt stuck at opacity 0, the logo rendering one transform wherever
      # the finger is, an <img> that 404d. Measured, not read off the source.
      - name: The ADDICTED sky strikes and the logo turns
        if: always()
        run: node .github/scripts/test_addicted_sky.mjs

      # One of the share-card backgrounds comes in two cuts, a portrait and the
      # official wide, chosen by the shape being drawn and sharing one
      # thumbnail. Every way that breaks leaves a finished-looking card — above
      # all the wide cut surviving onto the NEXT background somebody picks.
      - name: The ADDICTED card picks the right cut for its shape
        if: always()
        run: node .github/scripts/test_addicted_card_art.mjs

      # A pre-save campaign is seven things in five files and every half-wired
      # state is silent — above all a counter the API has no branch for, which
      # leaves the bar reading "0 / 50" for the whole campaign and looks
      # exactly like a release nobody pre-saved.
      - name: Every pre-save campaign is wired end to end
        if: always()
        run: node .github/scripts/test_presave_wiring.mjs

      - name: Campaign goal checklists are wired up
        if: always()
        run: node .github/scripts/test_campaign_goals.mjs

      # The canary hands its refresh to the chunked sweep. Every way that
      # handover breaks is quiet — above all a refused dispatch passing as
      # success, which looks just like a canary that found nothing to do.
      - name: The canary dispatches the chunked sweep
        if: always()
        run: bash .github/scripts/test_canary_dispatch.sh

      # Spotify publishes its daily charts in arrears, so a row stamped with
      # the fetch date is dated one to two days ahead of the data in it.
      - name: Chart rows carry the chart's own date
        if: always()
        run: node .github/scripts/test_chart_dates.mjs

      # A video can carry a 24h mark and still never be recorded, in which case
      # the pin is silently never taken — nothing errors, the figure is just
      # gone. Tarantino lost its 24h number exactly that way.
      - name: Every marked video is actually recorded
        if: always()
        run: node .github/scripts/test_youtube_marks.mjs

      # The read pipeline fetched the same list twice and dragged the full
      # 2400-point hourly series along on every 45s live poll. The output was
      # correct throughout — it just bought it several times over, which used up
      # a 10 GB monthly Upstash allowance and suspended the database, taking
      # /streams, the leaderboard, badges and the playlist down with it.
      - name: The history read asks for each thing once
        if: always()
        run: node .github/scripts/test_youtube_history_reads.mjs

      # The MAMA ballot is two rounds with different deep links, and the poster
      # page keeps its own copy of the caption because it is standalone and
      # cannot call the site's generator. Both go stale at a round rollover —
      # and both did, silently, because this check existed and was never run
      # from CI. Round 2 opened on 28 Oct with the card still offering the
      # event page and the poster still saying "round 1, Ends 22 Oct".
      - name: The MAMA rounds, links and captions agree
        if: always()
        run: node .github/scripts/test_mama_votes.mjs

      # The teaser rows poll hourly instead of every 45s, which is a quarter of
      # the commands this page costs — and on pay-as-you-go commands are the
      # bill. The split only works because the fast poll MERGES: assigning
      # histData whole, as it used to, wipes the rows that were not in that
      # request and blanks their charts for an hour.
      - name: /vs.html merges its fast and slow polls
        if: always()
        run: node .github/scripts/test_vs_poll_split.mjs

      # When Upstash suspended the database, four endpoints answered a 96-byte
      # FUNCTION_INVOCATION_FAILED that named nothing, and the stream cards sat
      # there showing a seeded July chart as if it were today. Hours went into
      # working out it was neither the scrapers nor the env vars.
      - name: A missing store is a 503 with a reason, not a crash
        if: always()
        run: node .github/scripts/test_store_unavailable.mjs

      # While the primary Upstash database is suspended, the endpoints whose
      # data rebuilds itself run on a second free one and the leaderboard waits
      # for the primary rather than restarting from zero. Splitting a key family
      # across the two is a bug with no error message.
      - name: No key family spans the two Redis databases
        if: always()
        run: node .github/scripts/test_store_split.mjs

      # The whole PRESS PLAY EP announced itself as LESS THAN A LOVER on the
      # leaderboard: five copies of a hand-written ternary chain all ended
      # `: 'LESS THAN A LOVER'`, so any track they had not been taught borrowed
      # Jennie's title. ltal read correctly because the fallback WAS its title.
      - name: Every leaderboard track names itself
        if: always()
        run: node .github/scripts/test_lb_song_labels.mjs

      # The board is 235 KB in one key and the heaviest thing the site reads,
      # so its cache window is most of the Upstash bill — and the one cache
      # that has to end at a precise instant, because a copy served across
      # 00:00 UTC shows yesterday's standings. s-maxage and
      # stale-while-revalidate ADD UP, which is how it once kept serving the
      # old board 90 seconds into the new day.
      - name: The leaderboard cache ends exactly at the reset
        if: always()
        run: node .github/scripts/test_leaderboard_cache.mjs

      # The day boundary was computed as 2 AM Rome, which equals 00:00 UTC only
      # on summer time. DST ended 2026-10-25 and it slid to 01:00 UTC — an hour
      # of plays filed under the previous date, in six separate copies.
      - name: The day turns over at 00:00 UTC, all year
        if: always()
        run: node .github/scripts/test_day_boundary.mjs

      # The countdown was set to 1PM KST, the hour JISOO's earlier singles used.
      # The official timetable says 8AM KST — five hours earlier — so the card
      # would have shown time remaining while the song was already out, and the
      # old test asserted the wrong value and so protected the bug. This derives
      # the instant from the poster's fourteen cities instead.
      - name: ADDICTED goes out when the timetable says
        if: always()
        run: node .github/scripts/test_addicted_release_time.mjs

      # The per-trade rows show BINI's single ballot category behind three of
      # them. Summed, that is three times the votes that exist — so a shared
      # slot must stay hatched and marked, and the rows must never imply three
      # agreements where BLOOMs made one.
      - name: The collab trade rows do not double-count
        if: always()
        run: node .github/scripts/test_collab_pairings.mjs

      # One selector now switches between votes an act received and people by
      # the side they say they are on. Reading the second as the first split up
      # is a claim about other fandoms' voting the page has no data for — and
      # the bars are votes EACH, which drawn on totals contradicts the figure
      # printed beside them while looking perfectly healthy.
      - name: The collab block's two views count different things
        if: always()
        run: node .github/scripts/test_collab_views.mjs

      # Spotify files a pre-release single under its own album name, so the
      # BY ALBUM view showed the same record twice and the EP's total was
      # missing the track carrying most of its streams.
      - name: Albums group by record, not by sleeve
        if: always()
        run: node .github/scripts/test_album_grouping.mjs

      # The daily challenge folds each EP behind one tile. Three ways that goes
      # wrong without throwing: a track shown both inside the EP and loose, a
      # summary that is not the sum of what opening it reveals, and a body
      # clipped by its max-height so the last track cannot be reached at all.
      - name: The collapsible EP cards on My Badges
        if: always()
        run: node .github/scripts/test_badges_ep_cards.mjs

      # Every countdown prints its time on the reader's own clock, cross-checked
      # against the foreign-zone label each card already hand-types.
      - name: Local times on every countdown
        if: always()
        run: node .github/scripts/test_local_times.mjs

      # The share card's picture picker: one shared element that every release
      # rebuilds, checked on the canvas pixels rather than the state behind it.
      - name: The PRESS PLAY share picker
        if: always()
        run: node .github/scripts/test_pressplay_share.mjs

      # Each countdown's picture strip: the files load, the dots match, and
      # they stay on the release's own page rather than the home carousel.
      - name: The countdown picture strips
        if: always()
        run: node .github/scripts/test_countdown_strips.mjs

      # One card carries a release that lands at midnight in each country and a
      # video that premieres at one instant worldwide. Both wrong silently: a
      # clock that looks healthy and is thirteen hours out for Seoul.
      - name: Release timing, local and global
        if: always()
        run: node .github/scripts/test_release_timing.mjs

      # The countdowns are a carousel now, and everything that can go wrong
      # with one is invisible in a screenshot: dots that drift from the slide
      # you are on, controls left over after a filter hides every card but one,
      # and a swipe that opens the countdown it was scrolling past.
      - name: The countdown carousel
        if: always()
        run: node .github/scripts/test_countdown_carousel.mjs

      # A release touches two manifests, two zips and two pages. The quiet
      # failure is a page still advertising the old version, which on a
      # blink's board looks like "my votes aren't counting".
      - name: The extension release is consistent
        if: always()
        run: node .github/scripts/test_extension_release.mjs
