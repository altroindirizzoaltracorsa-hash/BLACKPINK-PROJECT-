name: Rebuild JENNIE EP totals

# One-off: rebuild JENNIE's artist total from her per-track sums (drop the
# external whole-catalog pins) and pin the Fallen Angel EP tracks to the
# authoritative card values. Read-only diag by default; apply=true writes.
# Safe to delete once run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Set to 'true' to WRITE. Blank/false = read-only diag."
        required: false
        default: ""

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install httpx
        run: pip install httpx
      - name: Rebuild JENNIE EP totals (diag unless apply=true)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '' }}
        run: python .github/scripts/rebuild_jennie_ep.py
