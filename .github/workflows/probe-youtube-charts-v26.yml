name: Probe YouTube Charts v26

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe v26 (daily chart response structure)
        run: node .github/scripts/probe-youtube-charts-v26.mjs
