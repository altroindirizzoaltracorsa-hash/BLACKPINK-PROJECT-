name: Probe 5min row shape (read-only)

# Inspects the raw row objects of the two Melon 5분 charts to confirm they
# carry a usable `previous` rank (so ▲/▼ movement renders). Removed after.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36';
          const BASE='https://xn--o39an51b2re.com';
          async function get(u){const r=await fetch(BASE+u,{headers:{'User-Agent':UA,'Accept-Language':'ko,en;q=0.9'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();}
          function nextData(h){const m=h.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);if(!m)return null;try{return JSON.parse(m[1]);}catch{return null;}}
          function findRows(o){if(Array.isArray(o)){if(o.length&&o[0]&&typeof o[0]==='object'&&('ranking'in o[0])&&('song'in o[0]))return o;return null;}if(o&&typeof o==='object'){for(const v of Object.values(o)){const r=findRows(v);if(r)return r;}}return null;}
          (async()=>{
            for(const p of ['/chart/melon/realtime-five','/chart/melon/hot100-five','/chart/melon/realtime']){
              let rows=null; try{rows=findRows(nextData(await get(p))?.props?.pageProps);}catch(e){console.log(p,'ERR',e.message);continue;}
              console.log('\n### '+p+'  ('+(rows?rows.length:0)+' rows)');
              if(!rows||!rows.length)continue;
              console.log('row[0] keys:', Object.keys(rows[0]).join(', '));
              for(const r of rows.slice(0,5)){
                console.log('  ranking='+r.ranking+'  previous='+JSON.stringify(r.previous)+'  song='+(r.song&&r.song.name));
              }
            }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
