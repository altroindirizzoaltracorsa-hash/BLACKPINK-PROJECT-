name: Probe kcharts-live after redis (read-only)

# Confirms /api/kcharts-live still returns 200 (no runtime error) after adding
# the Redis previous-rank memory, and prints previous values. Removed after.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl twice ~10s apart
        run: |
          for i in 1 2; do
            echo "=== call $i ==="
            code=$(curl -sL -o resp.json -w '%{http_code}' https://www.blinksunited.com/api/kcharts-live)
            echo "HTTP $code"
            cat resp.json; echo
            node -e '
              const o=JSON.parse(require("fs").readFileSync("resp.json","utf8"));
              console.log("charts:",(o.charts||[]).length,"error:",o.error||"none");
              for(const c of (o.charts||[])) console.log("  "+c.key+" avail="+c.available+" rows="+c.totalRows+" BP="+(c.entries||[]).length+" "+JSON.stringify((c.entries||[]).map(e=>({r:e.rank,p:e.previous}))));
            '
            sleep 10
          done
