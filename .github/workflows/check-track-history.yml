name: Check track history

# Repurposed as a small admin utility runner. Currently: build the Blinks United
# VMA Vote Counter Android app (android-app/) into a signed release APK and commit
# it to the repo root as blinks-united-vote-counter.apk on the dispatched branch,
# so the site can offer it as a direct download. (Push-triggered builds via
# build-android.yml take over once that workflow lands on the default branch.)
on:
  workflow_dispatch:
    inputs:
      task:
        description: "build-android-apk"
        required: false
        default: "build-android-apk"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing keystore
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        working-directory: android-app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias bu \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass blinksunited -keypass blinksunited \
              -dname "CN=Blinks United, OU=Fans, O=Blinks United, L=Seoul, ST=NA, C=KR"
          fi
          printf 'storeFile=release.keystore\nstorePassword=blinksunited\nkeyAlias=bu\nkeyPassword=blinksunited\n' > keystore.properties

      - name: Build release APK
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish APK to site root
        if: ${{ github.event.inputs.task == 'build-android-apk' }}
        run: |
          set -e
          cp android-app/app/build/outputs/apk/release/app-release.apk blinks-united-vote-counter.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blinks-united-vote-counter.apk android-app/release.keystore
          if git diff --cached --quiet; then
            echo "No APK change to commit."
          else
            git commit -m "Build Android vote-counter APK v1.0.0 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
