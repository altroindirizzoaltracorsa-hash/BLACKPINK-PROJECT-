name: Check track history

# Repurposed as a small admin utility runner. Currently: seed the 2026
# Streams-Gained baselines (computes baseline = current total − BPx gained).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "seed-year-gained"
        required: false
        default: "seed-year-gained"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Seed 2026 streams-gained baselines
        if: ${{ github.event.inputs.task == 'seed-year-gained' }}
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          echo "Seeding year-gained baselines…"
          code=$(curl -sS -o /tmp/seed.json -w '%{http_code}' \
            "https://blinksunited.com/api/proxy-image?year_gained=seed&key=${ADMIN_KEY}")
          echo "HTTP $code"; cat /tmp/seed.json; echo
          echo "--- verify list ---"
          curl -sS "https://blinksunited.com/api/proxy-image?year_gained=list" | head -c 2000; echo
          test "$code" = "200"
