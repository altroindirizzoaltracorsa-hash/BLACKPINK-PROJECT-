name: Check track history

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Focus track-family name substring"
        required: false
        default: "how you like that"
      from:
        description: "Window start (YYYY-MM-DD)"
        required: false
        default: "2026-08-14"
      to:
        description: "Window end (YYYY-MM-DD)"
        required: false
        default: "2026-08-19"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Inspect merge window (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NAME: ${{ github.event.inputs.name }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: python .github/scripts/check_merge_window.py
