name: Check track history

# Repurposed as a small admin utility runner. Currently: fetch JENNIE
# "Fallen Angel" brand assets from her Shopify store (open internet on the
# runner) and commit them into fa-assets/ on the dispatched branch, so they
# can be inspected and used same-origin for the Early Supporter badge.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "fetch-fa-assets"
        required: false
        default: "fetch-fa-assets"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch JENNIE Fallen Angel assets
        if: ${{ github.event.inputs.task == 'fetch-fa-assets' }}
        run: |
          set -e
          mkdir -p fa-assets
          base="https://shopeu.jenn.ie/cdn/shop/files"
          for f in J-FA-Presave_FA.png J-FA-Presave_LOGO.png J-FA-Presave.png WideFAEPCDJewelCase2000x2000.png; do
            echo "=== $f ==="
            code=$(curl -sSL -A "Mozilla/5.0" -o "fa-assets/$f" -w '%{http_code}' "$base/$f" || echo 000)
            echo "HTTP $code"
            file "fa-assets/$f" || true
            ls -la "fa-assets/$f" || true
          done
          echo "--- listing ---"
          ls -la fa-assets/

      - name: Commit assets
        if: ${{ github.event.inputs.task == 'fetch-fa-assets' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fa-assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fetch JENNIE Fallen Angel brand assets into fa-assets/ [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
