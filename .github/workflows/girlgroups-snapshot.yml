name: Girl Group Snapshot

# Captures each group's running Spotify total once per kworb streaming day, for
# /girlgroups.html. The fetch and the Upstash write happen on Vercel
# (/api/girlgroups?snapshot=1); this job only triggers it.
#
# Four attempts spread through the morning rather than one, because GitHub sheds
# scheduled runs — the youtube-snapshots job saw 4-5h gaps against an hourly
# cron. Extra runs are free: the endpoint files points by kworb's own streaming
# day and holds when that day has not advanced, so re-running cannot double-count
# or overwrite. kworb publishes once a day, some days not at all.
on:
  schedule:
    - cron: '20 6 * * *'
    - cron: '20 9 * * *'
    - cron: '20 13 * * *'
    - cron: '20 18 * * *'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Capture the seven totals
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          BASE: https://www.blinksunited.com
        run: |
          set -u
          code=$(curl -sS -L --max-time 120 -o /tmp/gg.json -w '%{http_code}' \
            -H "x-admin-secret: $ADMIN_KEY" "$BASE/api/girlgroups?snapshot=1") || code=000
          echo "HTTP $code"
          # Always print the body: `written` / `held` / `errors` is the whole
          # diagnosis, and holding is the normal case for three runs out of four.
          head -c 2000 /tmp/gg.json; echo
          [ "$code" = "200" ] || exit 1

          # Read back what the page will actually show. Writing is only half the
          # job: a read-path failure would leave the page broken with the data
          # sitting fine in Redis, which is exactly the outage that went unseen
          # for 90 minutes on /api/youtube-history.
          echo "── what the page will show ──"
          rcode=$(curl -sS -L --max-time 60 -o /tmp/ggr.json -w '%{http_code}' "$BASE/api/girlgroups") || rcode=000
          echo "HTTP $rcode"
          if [ "$rcode" != "200" ]; then head -c 2000 /tmp/ggr.json; echo; exit 1; fi
          python3 -c "
          import json
          d = json.load(open('/tmp/ggr.json'))
          print('as of streaming day', d.get('asOf'))
          for i, g in enumerate(d.get('groups', []), 1):
              ytd = g.get('ytd')
              print('  %d. %-12s %s  (%d pts)' % (i, g['name'],
                    ('%.3fB' % (ytd/1e9)) if ytd else '—', len(g.get('series') or [])))
          "'
