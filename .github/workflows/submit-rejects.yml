name: Leaderboard Submit Rejects (diagnostic)
# Read-only: dumps the last ~50 rejected leaderboard submissions (401 token vs
# 403 not-linked) captured server-side, so we can see exactly why an account
# never appears on the board.
on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Dump rejects
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          KEY = os.environ["ADMIN_KEY"]
          url = f"https://blinksunited.com/api/leaderboard?action=submit-rejects&key={KEY}"
          out = subprocess.run(["curl","-sS","-L",url], capture_output=True, text=True)
          try:
              d = json.loads(out.stdout)
          except Exception:
              print("Unexpected response:", out.stdout[:500]); raise SystemExit(1)
          rejects = d.get("rejects", [])
          attempts = d.get("attempts", [])
          beacons = d.get("beacons", [])
          print(f"=== CLIENT BEACONS (submit attempted on device): {d.get('beaconCount', 0)} ===")
          for b in beacons:
              print(f"[{b.get('at')}] u={b.get('u')!r}")
          print(f"\n=== SUBMIT ATTEMPTS that reached the server: {d.get('attemptCount', 0)} ===")
          for a in attempts:
              print(f"[{a.get('at')}] {a.get('username')!r}  hasToken={a.get('hasToken')}  accounts={a.get('accounts')}")
          print(f"\n=== REJECTED submits: {d.get('rejectCount', 0)} ===")
          for r in rejects:
              print(f"[{r.get('at')}] {r.get('username')!r}  HTTP {r.get('status')}  — {r.get('reason')}")
              extra = r.get("extra")
              if extra:
                  print(f"      submitted={extra.get('submitted')}")
                  print(f"      linked   ={extra.get('linked')}")
                  print(f"      appUserId={extra.get('appUserId')}")
          PY
