name: Diagnose leaderboard undercount (one-off)

# For a set of accounts, dump the LIVE leaderboard entry (scores + which
# scrobblers are linked + whether providerScores/Musicat/Stats.fm is present)
# and the durable user_daily_counts for Aug 13 and Aug 14, so we can see
# exactly what's recorded vs reality. Safe to delete after use.
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Comma-separated name/handle substrings'
        required: true
        default: 'demibandwout,blinksunited,colxrzone,blackpinkshazam'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Dump
        env:
          BASE: ${{ secrets.VERCEL_URL }}
          NAMES: ${{ github.event.inputs.names }}
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          base = os.environ["BASE"].rstrip("/")
          names = [n.strip().lower() for n in os.environ["NAMES"].split(",") if n.strip()]

          def get(url):
              out = subprocess.run(["curl","-sS","-L","--location-trusted",url],
                                   capture_output=True, text=True)
              try: return json.loads(out.stdout)
              except Exception:
                  print("NON-JSON:", out.stdout[:200]); return {}

          live = get(f"{base}/api/leaderboard")
          users = live.get("users") or {}

          def match(u, name):
              cand = [(u.get("displayName") or ""), (u.get("username") or "")]
              cand += [a.get("username","") for a in (u.get("linkedAccounts") or [])]
              return any(name in (c or "").lower() for c in cand)

          for name in names:
              hits = [u for u in users.values() if match(u, name)]
              print(f"\n================ {name} ({len(hits)} board entr{'y' if len(hits)==1 else 'ies'}) ================")
              for u in hits:
                  s = u.get("scores") or {}
                  accts = [f"{a.get('type','?')}:{a.get('username')}" for a in (u.get("linkedAccounts") or [])]
                  ps = u.get("providerScores")
                  ps_note = "none"
                  if ps:
                      ov = ps.get("overall") or {}
                      td = ps.get("today") or {}
                      ps_note = f"dailyDate={ps.get('dailyDate')} overallSum={sum(ov.values()) if ov else 0} todaySum={sum(td.values()) if td else 0} breakdown={'yes' if ps.get('breakdown') else 'no'}"
                  uid = u.get("appUserId")
                  print(f"  displayName={u.get('displayName')!r}  appUserId={uid}")
                  print(f"    scrobblers: {accts}")
                  print(f"    daily_date={s.get('daily_date')}  daily_all={s.get('daily_all')}  (jump={s.get('daily_jump')} sd={s.get('daily_shutdown')} ddu={s.get('daily_ddududu')} ltal={s.get('daily_ltal')} go={s.get('daily_go')})")
                  print(f"    overall_all={s.get('overall_all')}  updatedAt={u.get('updatedAt')}")
                  print(f"    providerScores: {ps_note}")
                  if uid:
                      hist = get(f"{base}/api/user-week?appUserId={uid}&from=2026-08-13&to=2026-08-14")
                      for k in sorted((hist.get('days') or {}).keys()):
                          v = hist['days'][k]
                          tot = v.get('jump',0)+v.get('shutdown',0)+v.get('ddududu',0)+v.get('ltal',0)+v.get('go',0)
                          bs = v.get('by_source')
                          bsk = ", ".join(bs.keys()) if isinstance(bs, dict) else "—"
                          print(f"    user_daily_counts {k}: total={tot} (jump={v.get('jump')} sd={v.get('shutdown')} ddu={v.get('ddududu')} ltal={v.get('ltal')} go={v.get('go')})  by_source=[{bsk}]")
          PY
