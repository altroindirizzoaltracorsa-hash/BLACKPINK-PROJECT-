name: Probe page (read-only)

# Fetch a page from the live site and report whether given strings are present.
# Read-only: one GET, nothing written anywhere.
#
# Generic on purpose. Claude Code sessions cannot reach blinksunited.com directly
# (outbound HTTP to it is blocked), so confirming "did that deploy actually land"
# has meant adding a throwaway probe workflow each time. This is the reusable one:
# give it a path and the strings that should be in the deployed markup.
#
# Fails the run when a required pattern is missing, so a red run means "not
# deployed (or deployed wrong)" rather than needing the log read closely.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path on www.blinksunited.com (e.g. /voting or /)'
        required: true
        default: '/'
      expect:
        description: 'Strings that must ALL be present, separated by |||'
        required: false
        default: ''
      forbid:
        description: 'Strings that must NOT be present, separated by |||'
        required: false
        default: ''
      admin:
        description: 'Set to 1 to send the admin secret — needed for admin-gated endpoints like /api/youtube-history, which 401 without it.'
        required: false
        default: ''
      show:
        description: 'Print this many bytes of the body (e.g. 600). A 200 can still be a refusal; the size and the text say which.'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and check
        env:
          P: ${{ github.event.inputs.path }}
          EXPECT: ${{ github.event.inputs.expect }}
          FORBID: ${{ github.event.inputs.forbid }}
          ADMIN: ${{ github.event.inputs.admin }}
          SHOW: ${{ github.event.inputs.show }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -u
          BASE="https://www.blinksunited.com"
          echo "===== GET $BASE$P ====="
          # -S so curl reports transport errors; the status line is echoed before
          # any pattern check so a 404 or a redirect is obvious on its own.
          # Admin-gated endpoints (/api/youtube-history and friends) answer 401
          # to an unauthenticated GET, so a probe of one without this reports
          # "not deployed" when the truth is "not allowed to look". The secret
          # travels in a header, never the URL, so it cannot reach a redirect
          # target or a log line.
          if [ -n "$ADMIN" ]; then
            if [ -z "$ADMIN_KEY" ]; then echo "::error::admin=1 but ADMIN_KEY is not set"; exit 1; fi
            code=$(curl -sSL -w '%{http_code}' -o /tmp/page \
              -H "x-admin-secret: $ADMIN_KEY" "$BASE$P")
          else
            code=$(curl -sSL -w '%{http_code}' -o /tmp/page "$BASE$P")
          fi
          echo "HTTP $code · $(wc -c </tmp/page) bytes"
          if [ "$code" != "200" ]; then echo "::error::expected HTTP 200, got $code"; exit 1; fi

          # A 200 is not the same as an answer: an endpoint that cannot serve a
          # country returns a short refusal body with a 200, which byte count
          # alone hints at and the text settles. A literal newline would end
          # the workflow command, so the body is flattened into one line.
          if [ -n "$SHOW" ]; then
            head -c "$SHOW" /tmp/page | tr '\n\r' '  ' | sed 's/%/%25/g' \
              | while IFS= read -r l; do echo "::notice title=body::$l"; done
          fi

          fail=0
          # ||| as the separator, not newline or comma: the strings being looked
          # for are HTML/JS fragments that routinely contain both.
          check() {   # check <mode> <blob>
            mode="$1"; blob="$2"
            [ -z "$blob" ] && return 0
            printf '%s' "$blob" | awk 'BEGIN{RS="\\|\\|\\|"} {print}' | while IFS= read -r pat; do
              [ -z "$pat" ] && continue
              if grep -qF -- "$pat" /tmp/page; then found=yes; else found=no; fi
              if [ "$mode" = expect ] && [ "$found" = no ]; then
                echo "MISSING  $pat"; echo "$pat" >> /tmp/failures
                echo "MISSING  $pat" >> /tmp/results
              elif [ "$mode" = forbid ] && [ "$found" = yes ]; then
                echo "PRESENT (should not be)  $pat"; echo "$pat" >> /tmp/failures
                echo "PRESENT but should not be  $pat" >> /tmp/results
              else
                echo "ok       $pat"; echo "ok  $pat" >> /tmp/results
              fi
            done
          }

          # The while loop above runs in a subshell (pipeline), so a variable set
          # inside it would not survive — failures go to a file instead.
          : > /tmp/failures; : > /tmp/results
          echo "HTTP $code · $(wc -c </tmp/page) bytes · final URL $(curl -sSL -o /dev/null -w '%{url_effective}' "$BASE$P")" >> /tmp/results
          echo "----- must be present -----"; check expect "$EXPECT"
          echo "----- must be absent -----";  check forbid "$FORBID"

          # Each result as its own annotation: the job log lives in blob storage
          # that a Claude Code session cannot fetch, so "6 checks failed" with
          # the names only in the log is a dead end.
          if [ -s /tmp/results ]; then
            while IFS= read -r line; do
              echo "::notice title=probe::${line}"
            done < /tmp/results
          fi
          if [ -s /tmp/failures ]; then
            echo "::error::$(wc -l </tmp/failures) pattern check(s) failed — see the notices"
            exit 1
          fi
          echo "all pattern checks passed."
