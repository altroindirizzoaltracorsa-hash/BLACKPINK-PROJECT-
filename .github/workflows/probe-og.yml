name: Probe OG preview

# Diagnostic: fetch a countdown share URL as Twitterbot and check the rewritten
# og:image, plus the image URL's own HTTP status/content-type. Read-only.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to probe'
        required: true
        default: '/countdowns/lalisaofficial.com'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch canonical www page as Twitterbot + inspect og:image
        run: |
          BASE="https://www.blinksunited.com"
          P="${{ github.event.inputs.path }}"
          echo "===== PAGE $BASE$P (www, as Twitterbot, follow redirects) ====="
          curl -sSL -A "Twitterbot/1.0" -D - "$BASE$P" -o /tmp/page.html | grep -iE "^HTTP/|^location" || true
          echo "----- meta the crawler actually gets -----"
          grep -oE '<meta property="og:image" content="[^"]*"' /tmp/page.html || echo "(no og:image)"
          grep -oE '<meta name="twitter:image" content="[^"]*"' /tmp/page.html || echo "(no twitter:image)"
          grep -oE '<meta property="og:title" content="[^"]*"' /tmp/page.html || echo "(no og:title)"
          grep -oE '<meta name="twitter:card" content="[^"]*"' /tmp/page.html || echo "(no twitter:card)"
          echo
          IMG=$(grep -oE '<meta property="og:image" content="[^"]*"' /tmp/page.html | sed -E 's/.*content="([^"]*)".*/\1/')
          echo "===== the exact og:image URL the page advertises: $IMG ====="
          echo "--- fetch it WITHOUT following redirects (what a naive crawler does) ---"
          curl -sS -A "Twitterbot/1.0" -D - -o /dev/null "$IMG" | grep -iE "^HTTP/|^content-type|^content-length|^location"
          echo "--- same but following redirects ---"
          curl -sSL -A "Twitterbot/1.0" -D - -o /dev/null "$IMG" | grep -iE "^HTTP/|^content-type|^content-length"
