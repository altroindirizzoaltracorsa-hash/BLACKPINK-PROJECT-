name: Check countdown OG previews
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OG tags for each deep link
        run: |
          for p in /countdowns/jisoo.io /countdowns/jenn.ie /countdowns/hellosawadika.com /countdowns/vmas; do
            echo "===== https://www.blinksunited.com$p ====="
            html=$(curl -sSL --max-time 25 -A "facebookexternalhit/1.1" "https://www.blinksunited.com$p")
            echo "$html" | grep -oiE '<title>[^<]*</title>' | head -1
            echo "$html" | grep -oiE '<meta property="og:title" content="[^"]*"' | head -1
            echo "$html" | grep -oiE '<meta property="og:image" content="[^"]*"' | head -1
            echo
          done
