name: Check countdown OG previews
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deep link (plain + query) and the image
        run: |
          probe () {
            url="$1"
            echo "===== $url ====="
            code=$(curl -s -o /tmp/p.html -w "%{http_code}" -L --max-time 25 -A "Twitterbot/1.0" "$url")
            echo "HTTP $code  bytes=$(wc -c </tmp/p.html)"
            grep -oiE '<meta property="og:(title|image)" content="[^"]*"' /tmp/p.html | head -2
            grep -oiE '<meta name="twitter:(card|image)" content="[^"]*"' /tmp/p.html | head -2
            echo
          }
          probe "https://www.blinksunited.com/countdowns/jisoo.io"
          probe "https://www.blinksunited.com/countdowns/jisoo.io?x=1"
          echo "===== og image ====="
          curl -s -o /dev/null -w "img HTTP %{http_code}  type=%{content_type}  bytes=%{size_download}\n" -L --max-time 25 -A "Twitterbot/1.0" "https://www.blinksunited.com/og-countdown-jisoo.jpg"
