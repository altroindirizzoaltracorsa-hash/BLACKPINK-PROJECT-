name: Probe YouTube Charts v22

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe v22 (dump all trackTypes + JENNIE search)
        run: node .github/scripts/probe-youtube-charts-v22.mjs
