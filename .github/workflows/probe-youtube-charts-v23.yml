name: Probe YouTube Charts v23

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe v23 (find daily chart endpoint)
        run: node .github/scripts/probe-youtube-charts-v23.mjs
