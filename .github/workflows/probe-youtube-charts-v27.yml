name: Probe YouTube Charts v27

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run probe v27 (daily chart content.videos structure)
        run: node .github/scripts/probe-youtube-charts-v27.mjs
