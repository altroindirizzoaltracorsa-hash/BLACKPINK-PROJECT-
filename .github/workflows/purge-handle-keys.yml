name: Purge stray handle recovery rows

# One-off cleanup of legacy "h:<handle>" recovery rows in user_daily_counts,
# superseded by "user_<name>" rows. Run dry=1 to preview, dry=0 to delete.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: '1 = preview only, 0 = delete'
        required: true
        default: '1'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call purge endpoint
        env:
          BASE: ${{ secrets.VERCEL_URL }}
          KEY:  ${{ secrets.ADMIN_KEY }}
          DRY:  ${{ github.event.inputs.dry }}
        run: |
          set -e
          B="${BASE%/}"
          code=$(curl -sS -X POST -L --location-trusted -o resp.json -w "%{http_code}" \
            "$B/api/leaderboard?action=purge-handle-keys&key=$KEY&dry=$DRY")
          echo "HTTP $code"
          jq -r '"dry=\(.dry)  matched=\(.matched)"' resp.json || cat resp.json
          echo "--- sample (up to 60) ---"
          jq -r '.sample[]?' resp.json || true
          if [ "$code" -ge 400 ]; then exit 1; fi
