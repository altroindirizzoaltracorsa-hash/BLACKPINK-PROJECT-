<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link your vote counter — blinksunited</title>
  <style>
    :root { --pink:#ff2e77; --pink-soft:#ff8fb4; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(900px 420px at 80% -10%, #3a0c22 0%, transparent 60%), #0b0509;
      color:#fff2f6; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(420px,92vw); background:#15070c; border:1px solid #4a1526; border-radius:14px; padding:24px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#d38aa4; font-size:13px; margin:6px 0 16px; }
    label { display:block; font-size:12px; color:#d38aa4; margin:10px 0 4px; }
    input { width:100%; box-sizing:border-box; background:#0a0407; border:1px solid #4a1526; border-radius:8px;
      padding:10px; color:#fff2f6; font-size:14px; }
    button { width:100%; margin-top:10px; padding:11px; border:none; border-radius:8px; cursor:pointer;
      background:var(--pink); color:#12000a; font-weight:700; font-size:14px; }
    button.ghost { background:transparent; border:1px solid #4a1526; color:#fff2f6; font-weight:500; }
    .or { text-align:center; color:#8a5c6c; font-size:11px; margin:14px 0 2px; }
    .msg { margin-top:14px; font-size:13px; }
    .ok { color:#39d98a; } .err { color:#ff8f8f; }
    .hidden { display:none; }
    .foot { margin-top:16px; font-size:11px; color:#6a4a56; }
    a { color:var(--pink-soft); }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
    .chips button { width:auto; margin:0; padding:7px 12px; border:1px solid #4a1526; border-radius:999px;
      background:transparent; color:#d38aa4; font-weight:500; font-size:12px; }
    .chips button.on { border-color:var(--pink); background:rgba(255,46,119,0.14); color:#fff2f6; }
  </style>
  <script src="/i18n/i18n.js" defer></script>
</head>
<body>
  <div class="card">
    <h1>♥ Link your vote counter</h1>
    <p id="lead">Connecting your blinksunited profile to the Vote Counter extension…</p>

    <div id="login" class="hidden">
      <!-- Asked here because THIS is the sign-up a partner fandom actually
           does: the counter sends them to this page, not to /badges. The
           answer decides the anonymous name their new account is given, and
           that name has to exist before the token below is minted — the token's
           label is stored once and reused for ever. -->
      <label>Which fandom are you? <span style="opacity:0.6">(optional)</span></label>
      <div id="fandoms" class="chips"></div>
      <button id="google">Continue with Google</button>
      <button id="x">Continue with X</button>
      <button id="discord">Continue with Discord</button>
      <div class="or">— or with email —</div>
      <label>Email<input id="email" type="email" autocomplete="email" /></label>
      <button id="magic" class="ghost">Email me a login link</button>
    </div>

    <!-- Their one chance to pick a name. A partner fandom's whole visit to this
         site can be this page: the counter sends them here and nowhere else, so
         "change it in Settings on blinksunited.com" is the same as "you cannot".
         The anonymous bloom7 the account was given is prefilled, so the field
         says what they are currently called rather than looking empty. -->
    <div id="namebox" class="hidden">
      <label>Your name on the <a href="/collabs">collab board</a>
        <span style="opacity:0.6">(optional — leave it as it is and stay anonymous)</span></label>
      <input id="dname" type="text" maxlength="40" autocomplete="off" />
      <button id="savename" class="ghost">Save this name</button>
    </div>

    <div id="status" class="msg"></div>
    <div class="foot">The anon key here is public by design; your account stays protected by Supabase RLS.
      Same blinksunited account you use on the site — sign in with whichever method you signed up with.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://esbzlrmrdvvsrsobrzfz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzYnpscm1yZHZ2c3Jzb2JyemZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODQyNDYsImV4cCI6MjA5NTY2MDI0Nn0.P3VhWYeog5CmE67VjvHboG3rP876OPjcmmtBmz1zfck';
    // Guarded, because this page is somebody's whole encounter with the site
    // and the library comes from a CDN. If that script does not arrive — a
    // blocked domain, a captive wifi, an ad blocker that is too keen — the
    // unguarded version threw here, the script stopped, and the sign-in card
    // stayed hidden: a dead page with no buttons and no explanation, which
    // reads as "this is broken" rather than "try again". index.html has always
    // guarded this; this page did not.
    if (typeof supabase === 'undefined' || !supabase.createClient) {
      document.getElementById('lead').textContent =
        'Could not load the sign-in library — something is blocking cdn.jsdelivr.net.';
      document.getElementById('status').className = 'msg err';
      document.getElementById('status').textContent =
        'Try another network or turn off a content blocker for this page, then reload.';
      throw new Error('supabase-js did not load');
    }
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $ = (id) => document.getElementById(id);
    const status = (html, cls) => { $('status').className = 'msg ' + (cls || ''); $('status').innerHTML = html; };
    let extensionSeen = false;
    let pending = null; // minted token waiting to be handed over

    function deliver() {
      if (!pending) return;
      window.postMessage({ source: 'bu-ext-link', token: pending.token, profile: pending.profile }, '*');
    }

    // The extension's content script announces itself and acks the save. It may
    // announce AFTER we've already minted (older engines inject late), so we (re)send
    // the token whenever we hear "ready" — no ordering assumptions.
    window.addEventListener('message', (e) => {
      if (e.source !== window || !e.data) return;
      if (e.data.source === 'bu-ext-link-ready') { extensionSeen = true; deliver(); }
      if (e.data.source === 'bu-ext-link-ack') {
        // Was "your BLACKPINK & LISA votes on vote.mtv.com" — the award this
        // counter was built for, and the acts a partner fandom is not here to
        // vote. Whoever is reading this may be a BLOOM who has just made an
        // account to help with a trade.
        if (e.data.ok) status('✅ Linked! The votes you cast will now log to your profile and to the '
          + '<a href="/collabs">collab board</a>. You can close this tab.', 'ok');
        else status('Could not save to the extension. Make sure it is installed and enabled, then reload.', 'err');
      }
    });

    // ── which fandom, and the name that follows from it ───────────────────
    // Keys are the ones the collab board counts people by — FANDOMS in
    // index.html, COLLABS[].fandoms in collabs.html, COLLAB.fandoms in the
    // counter. test_collab_slugs checks they all agree.
    const FANDOMS = [
      { key: 'blink',    label: 'BLINK' },
      { key: 'bloom',    label: 'BLOOM' },
    ];
    const myFandom = () => {
      try {
        const v = localStorage.getItem('buFandom');
        return FANDOMS.some((f) => f.key === v) ? v : null;
      } catch { return null; }
    };
    function renderFandoms() {
      const cur = myFandom();
      $('fandoms').innerHTML = FANDOMS.map((f) =>
        `<button type="button" data-f="${f.key}" class="${f.key === cur ? 'on' : ''}">${f.label}</button>`).join('');
    }
    $('fandoms').addEventListener('click', (e) => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      try { localStorage.setItem('buFandom', b.getAttribute('data-f')); } catch {}
      renderFandoms();
    });
    renderFandoms();

    // A new account gets a clean anonymous "<fandom>N" rather than the OAuth real
    // name or email this page would otherwise label them with — the same naming
    // the main site does, which is the whole reason it exists. It has to happen
    // BEFORE the token is minted: /api/extension-link stores the label once and
    // reuses it for ever, so a name arriving afterwards would never be seen.
    async function ensureFanName(session) {
      const md = session.user.user_metadata || {};
      const fandom = md.fandom || myFandom();
      try {
        if (md.display_name) {
          // Already named, and they may have answered since. reissue_fan_name
          // renames an auto name and refuses one they chose — that call is the
          // decision, not this code.
          if (!fandom) return;
          const { data: name } = await sb.rpc('reissue_fan_name', { p_fandom: fandom });
          if (!name || name === md.display_name) return;
          await sb.auth.updateUser({ data: { display_name: name, display_name_auto: true } });
          return;
        }
        // Brand-new signups only — the same rule the site applies. An
        // established fan who never chose a name keeps their handle.
        const created = session.user.created_at ? Date.parse(session.user.created_at) : 0;
        if (!created || (Date.now() - created) > 10 * 60 * 1000) return;
        let name = null;
        const got = await sb.rpc('assign_fan_name', { p_fandom: fandom || 'blink' });
        if (got.error) {
          // fan_display_names.sql is applied by hand, so the page can ship
          // first. Name them a blink rather than leaving them nameless.
          const old = await sb.rpc('assign_blink_name');
          name = old.error ? null : old.data;
        } else { name = got.data; }
        if (!name) return;
        const data = { display_name: name, display_name_auto: true };
        if (fandom && md.fandom !== fandom) data.fandom = fandom;
        await sb.auth.updateUser({ data });
      } catch {}
    }

    async function mintAndSend() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showLogin(); return; }
      status('Linking…');
      await ensureFanName(session);
      try {
        const r = await fetch('/api/extension-link', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: session.access_token }),
        });
        const d = await r.json();
        if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
        pending = { token: d.token, profile: d.profile };
        deliver(); // send now; if the extension announces later, we resend on "ready"
        $('login').classList.add('hidden');
        $('lead').textContent = `Signed in as ${d.profile}.`;
        const { data: { session: s2 } } = await sb.auth.getSession();
        showNameBox((s2 && s2.user.user_metadata && s2.user.user_metadata.display_name) || '');
        status('Handing the token to the extension…');
        setTimeout(() => {
          if (!extensionSeen) {
            status('Extension not detected on this page. Install/enable the Blinks United Vote Counter, then reload this page.', 'err');
          }
        }, 2500);
      } catch (err) {
        status('Error: ' + err.message, 'err');
      }
    }

    function showLogin() {
      $('lead').innerHTML = 'Sign in with your blinksunited account to link the vote counter. '
        + '<b>An account is all this needs</b> — no scrobbler, no streaming, nothing to set up.';
      $('login').classList.remove('hidden');
      status('');
    }

    // OAuth — same provider slugs the main site uses (google / x / discord).
    async function oauth(provider, label) {
      status('Redirecting to ' + label + '…');
      const { error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.href } });
      if (error) status(label + ' sign-in failed: ' + error.message, 'err');
    }
    $('google').addEventListener('click', () => oauth('google', 'Google'));
    $('x').addEventListener('click', () => oauth('x', 'X'));
    $('discord').addEventListener('click', () => oauth('discord', 'Discord'));

    $('magic').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { status('Enter your email first.', 'err'); return; }
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href } });
      status(error ? ('Could not send link: ' + error.message) : 'Check your email for a login link, then reopen this page.', error ? 'err' : 'ok');
    });

    // Every numbered auto name is reserved, so a hand-picked one cannot collide
    // with an auto-named fan's leaderboard key and overwrite their row. Built
    // from the same list the chips above come from.
    const RESERVED = new RegExp('^(' + FANDOMS.map((f) => f.key).join('|') + ')\\d+$', 'i');

    function showNameBox(current) {
      $('dname').value = current || '';
      $('namebox').classList.remove('hidden');
    }

    $('savename').addEventListener('click', async () => {
      const name = $('dname').value.trim();
      if (!name) { status('Enter a name, or leave this alone to stay anonymous.', 'err'); return; }
      if (RESERVED.test(name)) {
        status('That name is reserved — it is one the site hands out. Please choose another.', 'err');
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { status('Sign in first.', 'err'); return; }
      if (name === (session.user.user_metadata || {}).display_name) {
        status('That is already your name.', 'ok'); return;
      }
      // display_name_auto: FALSE is the point. The name this account was given
      // is flagged auto so a later fandom answer may replace it; a name they
      // chose themselves must never be replaced, and metadata MERGES, so the
      // flag has to be cleared here rather than just left out.
      const { error } = await sb.auth.updateUser({
        data: { display_name: name, display_name_auto: false } });
      if (error) { status('Could not save that: ' + error.message, 'err'); return; }
      // The board keys on the name, so it is pushed straight across rather than
      // waiting for the hourly reconcile.
      try {
        await fetch('/api/leaderboard?action=set-display-name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ displayName: name, accessToken: session.access_token }),
        });
      } catch (e) {}
      status('✅ Saved — you are <b>' + name.replace(/[<&>]/g, '') + '</b> on the collab board.', 'ok');
    });

    // Re-run when auth state resolves (e.g. returning from OAuth / a magic link).
    sb.auth.onAuthStateChange(() => mintAndSend());
    mintAndSend();
  </script>
</body>
</html>
